name = "mkety-copier-engine"
main = "src/v1_runtime_entry.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
TRADINGVIEW_DIRECT_INGRESS_ENABLED = "false"
TRADINGVIEW_CERT_PROBE_ENABLED = "false"
TRADING_ACCESS_ENABLED = "false"
BROKER_EXECUTION_ENABLED = "false"
TRADING_CUSTOM_HOSTNAMES_ENABLED = "false"
CTRADER_REDIRECT_URI = "https://trade.mkety.com/api/v1/integrations/ctrader/callback"
CTRADER_CBOT_GATEWAY_URL = "https://cbot.mkety.com:25345"
CTRADER_CBOT_WS_URL = "wss://cbot.mkety.com:25345/v1/cbot"
MTPROTO_INTERNAL_SOURCE_URL = "https://mkety-copier-engine.dry-glitter-7e16.workers.dev/api/v1/internal/source-event"

[secrets]
required = ["CBOT_TOKEN_SIGNING_KEY", "CBOT_CONTROL_SECRET"]

[[containers]]
class_name = "MtprotoContainerRuntime"
image = "./containers/mtproto-listener/Dockerfile"
max_instances = 100
instance_type = "lite"

[durable_objects]
bindings = [
  { name = "MTPROTO_LISTENER_NAMESPACE", class_name = "MTProtoListenerNode" },
  { name = "TRADE_STATE_NAMESPACE", class_name = "TradeStateNode" },
  { name = "MTPROTO_CONTAINER_NAMESPACE", class_name = "MtprotoContainerRuntime" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MTProtoListenerNode"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TradeStateNode"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MtprotoContainerRuntime"]

[[queues.producers]]
binding = "SOURCE_EVENT_QUEUE"
queue = "mkety-trading-source-events"

[[queues.consumers]]
queue = "mkety-trading-source-events"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 8
dead_letter_queue = "mkety-trading-source-events-dlq"

[triggers]
crons = ["*/15 * * * *", "* * * * *"]