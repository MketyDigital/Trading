name: Configure cBot DNS Only Origin

on:
  push:
    branches:
      - 'diag/coolify-cbot-runtime'
    paths:
      - '.github/workflows/ops-cbot-dns-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Create or update explicit DNS-only cBot A record
        shell: bash
        run: |
          set -euo pipefail
          origin_ip='20.57.161.98'
          zone_code="$(curl -sS -o /tmp/zones.json -w '%{http_code}' 'https://api.cloudflare.com/client/v4/zones?name=mkety.com&status=active' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          test "$zone_code" = 200 || { echo "Zone lookup HTTP $zone_code"; exit 1; }
          zone_id="$(python - <<'PY'
          import json
          b=json.load(open('/tmp/zones.json')); rows=b.get('result') or []
          if len(rows)!=1: raise SystemExit('Expected one active mkety.com zone')
          print(rows[0]['id'])
          PY
          )"

          curl -fsS "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=cbot.mkety.com&type=A" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/current.json
          record_id="$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/current.json')).get('result') or []
          if len(rows)>1: raise SystemExit('Refusing: more than one explicit cbot A record exists')
          print(rows[0]['id'] if rows else '')
          PY
          )"
          payload="$(python - <<'PY'
          import json
          print(json.dumps({'type':'A','name':'cbot.mkety.com','content':'20.57.161.98','ttl':300,'proxied':False}))
          PY
          )"
          if [ -n "$record_id" ]; then
            code="$(curl -sS -o /tmp/change.json -w '%{http_code}' -X PUT "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$payload")"
            test "$code" = 200 || { echo "DNS update HTTP $code"; cat /tmp/change.json; exit 1; }
            echo 'Updated explicit cbot A record.'
          else
            code="$(curl -sS -o /tmp/change.json -w '%{http_code}' -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$payload")"
            test "$code" = 200 || { echo "DNS create HTTP $code"; cat /tmp/change.json; exit 1; }
            echo 'Created explicit cbot A record.'
          fi

          python - <<'PY'
          import json
          b=json.load(open('/tmp/change.json'))
          if not b.get('success'): raise SystemExit('Cloudflare DNS mutation was not successful')
          r=b.get('result') or {}
          assert r.get('name')=='cbot.mkety.com'
          assert r.get('type')=='A'
          assert r.get('content')=='20.57.161.98'
          assert r.get('proxied') is False
          print('Cloudflare stored DNS-only cbot.mkety.com -> 20.57.161.98')
          PY

      - name: Verify authoritative DNS result
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            answers="$(dig +short A cbot.mkety.com @1.1.1.1 | sort -u | tr '\n' ' ')"
            echo "DNS answer: $answers"
            if [ "$answers" = '20.57.161.98 ' ]; then exit 0; fi
            sleep 2
          done
          echo 'DNS did not converge to the Azure origin'; exit 1
