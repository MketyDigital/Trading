name: Production D1 Read-only Demo Diagnostics

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Lookback window in hours (1-120); defaults to five days"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

jobs:
  d1-readonly-diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WINDOW_HOURS: ${{ inputs.window_hours }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Query production D1 without printing message contents
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';

          const hours = Number(process.env.WINDOW_HOURS);
          if (!Number.isInteger(hours) || hours < 1 || hours > 120) {
            throw new Error('WINDOW_HOURS must be an integer from 1 to 120');
          }
          if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) {
            throw new Error('Cloudflare credentials are not configured');
          }

          const config = fs.readFileSync('cloudflare-v2/wrangler.toml', 'utf8');
          const start = config.indexOf('[[d1_databases]]');
          if (start < 0) throw new Error('Production D1 binding was not found');
          const next = config.indexOf('\n[[', start + 1);
          const binding = config.slice(start, next < 0 ? config.length : next);
          const name = binding.match(/^database_name\s*=\s*"([^"]+)"/m)?.[1];
          const databaseId = binding.match(/^database_id\s*=\s*"([^"]+)"/m)?.[1];
          if (name !== 'trading-staging' || !/^[0-9a-f-]{36}$/i.test(databaseId || '')) {
            throw new Error('Expected existing production Trading D1 binding was not verified');
          }

          const cutoff = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
          const queries = [
            {
              title: 'Incoming events by processing state',
              sql: "SELECT CASE lower(COALESCE(processing_status, '')) WHEN 'ready' THEN 'READY' WHEN 'management' THEN 'MANAGEMENT' WHEN 'no_action' THEN 'NO_ACTION' WHEN 'needs_review' THEN 'NEEDS_REVIEW' WHEN 'received' THEN 'RECEIVED' WHEN 'interpreted' THEN 'LEGACY_INTERPRETED' WHEN 'processed' THEN 'PROCESSED' WHEN 'executed' THEN 'EXECUTED' WHEN 'failed' THEN 'FAILED' WHEN 'rejected' THEN 'REJECTED' WHEN 'ignored' THEN 'IGNORED' WHEN 'pending' THEN 'PENDING' WHEN 'processing' THEN 'PROCESSING' ELSE 'OTHER' END AS processing_state, CASE WHEN COALESCE(error_code, '') = '' THEN 0 ELSE 1 END AS has_error, COUNT(*) AS events FROM trading_events WHERE datetime(received_at) >= datetime(?) GROUP BY processing_state, has_error ORDER BY events DESC LIMIT 50",
            },
            {
              title: 'Latest signal queue state (no IDs or message text)',
              sql: "SELECT COALESCE(received_at, '') AS received_at, CASE lower(COALESCE(processing_status, '')) WHEN 'ready' THEN 'READY' WHEN 'management' THEN 'MANAGEMENT' WHEN 'no_action' THEN 'NO_ACTION' WHEN 'needs_review' THEN 'NEEDS_REVIEW' WHEN 'received' THEN 'RECEIVED' WHEN 'interpreted' THEN 'LEGACY_INTERPRETED' WHEN 'processed' THEN 'PROCESSED' WHEN 'executed' THEN 'EXECUTED' WHEN 'failed' THEN 'FAILED' WHEN 'rejected' THEN 'REJECTED' WHEN 'ignored' THEN 'IGNORED' WHEN 'pending' THEN 'PENDING' WHEN 'processing' THEN 'PROCESSING' ELSE 'OTHER' END AS processing_state, CASE WHEN COALESCE(error_code, '') = '' THEN 0 ELSE 1 END AS has_error, CASE WHEN EXISTS (SELECT 1 FROM position_groups g WHERE g.workspace_id = e.workspace_id AND (g.source_event_id = e.id OR EXISTS (SELECT 1 FROM json_each(COALESCE(g.source_event_ids, '[]')) WHERE value = e.id))) THEN 1 ELSE 0 END AS linked_to_position_group FROM trading_events e ORDER BY datetime(e.received_at) DESC LIMIT 20",
              params: [],
            },
            {
              title: 'Recent signal protection and Telegram delivery trace (no IDs or text)',
              sql: "WITH recent_events AS (SELECT id, workspace_id, external_event_id, received_at, processing_status, canonical_intent, error_code FROM trading_events WHERE datetime(received_at) >= datetime(?) ORDER BY datetime(received_at) DESC LIMIT 40), event_groups AS (SELECT DISTINCT e.id AS event_id, g.id AS group_id FROM recent_events e JOIN position_groups g ON g.workspace_id = e.workspace_id AND (g.source_event_id = e.id OR EXISTS (SELECT 1 FROM json_each(COALESCE(g.source_event_ids, '[]')) WHERE value = e.id OR value = e.external_event_id))), group_rollup AS (SELECT eg.event_id, MAX(g.canonical_symbol) AS group_symbol, COUNT(DISTINCT g.id) AS group_count, COUNT(DISTINCT l.id) AS leg_count, MAX(CASE WHEN l.target_index = 1 AND l.stop_loss IS NOT NULL THEN 1 ELSE 0 END) AS first_leg_has_sl, MAX(CASE WHEN l.target_index = 1 AND l.take_profit IS NOT NULL THEN 1 ELSE 0 END) AS first_leg_has_tp, SUM(CASE WHEN l.target_index > 1 AND l.stop_loss IS NOT NULL THEN 1 ELSE 0 END) AS later_legs_with_sl, SUM(CASE WHEN l.target_index > 1 AND l.take_profit IS NOT NULL THEN 1 ELSE 0 END) AS later_legs_with_tp FROM event_groups eg JOIN position_groups g ON g.id = eg.group_id LEFT JOIN position_legs l ON l.workspace_id = g.workspace_id AND l.position_group_id = g.id GROUP BY eg.event_id), delivery_rollup AS (SELECT trading_event_id, SUM(CASE WHEN upper(destination_type) = 'TELEGRAM' AND upper(status) = 'SUCCEEDED' THEN 1 ELSE 0 END) AS telegram_succeeded, SUM(CASE WHEN upper(destination_type) = 'TELEGRAM' AND upper(status) IN ('FAILED', 'REJECTED', 'BLOCKED') THEN 1 ELSE 0 END) AS telegram_failed, SUM(CASE WHEN upper(destination_type) = 'TELEGRAM' AND upper(status) IN ('PENDING', 'RETRYABLE') THEN 1 ELSE 0 END) AS telegram_pending FROM destination_deliveries WHERE trading_event_id IN (SELECT id FROM recent_events) GROUP BY trading_event_id) SELECT e.received_at, CASE WHEN upper(COALESCE(json_extract(e.canonical_intent, '$.symbol.canonical'), json_extract(e.canonical_intent, '$.symbol'), '')) LIKE '%XAUUSD%' THEN 'XAUUSD' WHEN upper(COALESCE(json_extract(e.canonical_intent, '$.symbol.canonical'), json_extract(e.canonical_intent, '$.symbol'), '')) LIKE '%VOLATILITY%75%' OR upper(COALESCE(json_extract(e.canonical_intent, '$.symbol.canonical'), json_extract(e.canonical_intent, '$.symbol'), '')) LIKE '%V75%' THEN 'VOLATILITY_75' ELSE CASE WHEN upper(COALESCE(gr.group_symbol, '')) LIKE '%XAUUSD%' THEN 'XAUUSD' WHEN upper(COALESCE(gr.group_symbol, '')) LIKE '%VOLATILITY%75%' OR upper(COALESCE(gr.group_symbol, '')) LIKE '%V75%' THEN 'VOLATILITY_75' ELSE 'OTHER' END END AS symbol_class, CASE upper(COALESCE(json_extract(e.canonical_intent, '$.side'), '')) WHEN 'BUY' THEN 'BUY' WHEN 'SELL' THEN 'SELL' ELSE 'OTHER' END AS side, CASE upper(COALESCE(json_extract(e.canonical_intent, '$.orderType'), json_extract(e.canonical_intent, '$.order_type'), '')) WHEN 'MARKET' THEN 'MARKET' WHEN 'LIMIT' THEN 'LIMIT' WHEN 'STOP' THEN 'STOP' WHEN 'STOP_LIMIT' THEN 'STOP_LIMIT' ELSE 'OTHER' END AS order_type, CASE upper(COALESCE(e.processing_status, '')) WHEN 'READY' THEN 'READY' WHEN 'MANAGEMENT' THEN 'MANAGEMENT' WHEN 'NEEDS_REVIEW' THEN 'NEEDS_REVIEW' WHEN 'NO_ACTION' THEN 'NO_ACTION' WHEN 'FAILED' THEN 'FAILED' ELSE 'OTHER' END AS processing_state, CASE WHEN json_extract(e.canonical_intent, '$.stopLoss') IS NOT NULL THEN 1 ELSE 0 END AS signal_has_sl, CASE WHEN json_type(e.canonical_intent, '$.takeProfits') = 'array' THEN json_array_length(e.canonical_intent, '$.takeProfits') WHEN json_extract(e.canonical_intent, '$.takeProfit') IS NOT NULL THEN 1 ELSE 0 END AS signal_tp_count, CASE WHEN COALESCE(e.error_code, '') = '' THEN 0 ELSE 1 END AS has_error, COALESCE(gr.group_count, 0) AS groups, COALESCE(gr.leg_count, 0) AS legs, COALESCE(gr.first_leg_has_sl, 0) AS first_leg_has_sl, COALESCE(gr.first_leg_has_tp, 0) AS first_leg_has_tp, COALESCE(gr.later_legs_with_sl, 0) AS later_legs_with_sl, COALESCE(gr.later_legs_with_tp, 0) AS later_legs_with_tp, COALESCE(dr.telegram_succeeded, 0) AS telegram_succeeded, COALESCE(dr.telegram_failed, 0) AS telegram_failed, COALESCE(dr.telegram_pending, 0) AS telegram_pending FROM recent_events e LEFT JOIN group_rollup gr ON gr.event_id = e.id LEFT JOIN delivery_rollup dr ON dr.trading_event_id = e.id ORDER BY datetime(e.received_at) DESC LIMIT 40",
            },
            {
              title: 'Volatility signal broker trace (safe categories only)',
              sql: "WITH recent_events AS (SELECT e.id,e.workspace_id,e.source_connection_id,e.received_at,e.processing_status,e.canonical_intent,e.error_code FROM trading_events e WHERE datetime(e.received_at)>=datetime(?) AND upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')) LIKE '%VOLATILITY%' ORDER BY datetime(e.received_at) DESC LIMIT 20) SELECT e.received_at,'VOLATILITY' AS symbol_class,CASE upper(COALESCE(json_extract(e.canonical_intent,'$.side'),'')) WHEN 'BUY' THEN 'BUY' WHEN 'SELL' THEN 'SELL' ELSE 'OTHER' END AS side,CASE upper(COALESCE(e.processing_status,'')) WHEN 'READY' THEN 'READY' WHEN 'NEEDS_REVIEW' THEN 'NEEDS_REVIEW' WHEN 'NO_ACTION' THEN 'NO_ACTION' WHEN 'MANAGEMENT' THEN 'MANAGEMENT' ELSE 'OTHER' END AS processing_state,CASE WHEN json_extract(e.canonical_intent,'$.stopLoss') IS NOT NULL THEN 1 ELSE 0 END AS has_sl,CASE WHEN json_type(e.canonical_intent,'$.takeProfits')='array' THEN json_array_length(e.canonical_intent,'$.takeProfits') WHEN json_extract(e.canonical_intent,'$.takeProfit') IS NOT NULL THEN 1 ELSE 0 END AS tp_count,CASE WHEN COALESCE(e.error_code,'')='' THEN 0 ELSE 1 END AS has_error,(SELECT COUNT(*) FROM source_destination_routes r JOIN trading_destinations d ON d.workspace_id=r.workspace_id AND d.id=r.destination_id WHERE r.workspace_id=e.workspace_id AND r.source_connection_id=e.source_connection_id AND COALESCE(r.is_active,0)=1 AND lower(COALESCE(d.destination_type,''))='broker_account' AND COALESCE(d.is_active,0)=1) AS active_broker_routes,(SELECT CASE upper(COALESCE(json_extract(j.details,'$.status'),'')) WHEN 'NEEDS_REVIEW' THEN 'NEEDS_REVIEW' WHEN 'SIMULATED' THEN 'SIMULATED' WHEN 'READY' THEN 'READY' WHEN 'NO_ACTION' THEN 'NO_ACTION' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'FAILED' THEN 'FAILED' ELSE 'OTHER' END FROM operation_journal j WHERE j.workspace_id=e.workspace_id AND j.trading_event_id=e.id AND upper(j.stage)='BROKER_PLANNING' ORDER BY datetime(j.observed_at) DESC LIMIT 1) AS planning_state,(SELECT CASE upper(COALESCE(json_extract(j.details,'$.correlationReason'),'')) WHEN 'NEW_GROUP' THEN 'NEW_GROUP' WHEN 'FAST_ENTRY_COMPLETION' THEN 'FAST_ENTRY_COMPLETION' WHEN 'FAST_ENTRY_SUPERSESSION' THEN 'FAST_ENTRY_SUPERSESSION' WHEN 'EDIT_TARGET' THEN 'EDIT_TARGET' WHEN 'AMBIGUOUS_FAST_ENTRY_COMPLETION' THEN 'AMBIGUOUS_FAST_ENTRY_COMPLETION' WHEN 'AMBIGUOUS_FAST_ENTRY_SUPERSESSION' THEN 'AMBIGUOUS_FAST_ENTRY_SUPERSESSION' WHEN 'AMBIGUOUS_MANAGEMENT_TARGET' THEN 'AMBIGUOUS_MANAGEMENT_TARGET' WHEN 'NO_MANAGEMENT_TARGET' THEN 'NO_MANAGEMENT_TARGET' WHEN 'NO_REPLY_TARGET' THEN 'NO_REPLY_TARGET' WHEN 'NO_THREAD_TARGET' THEN 'NO_THREAD_TARGET' WHEN 'FAST_ENTRY_COMPLETION_MISMATCH' THEN 'FAST_ENTRY_COMPLETION_MISMATCH' ELSE CASE WHEN COALESCE(json_extract(j.details,'$.correlationReason'),'')='' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END FROM operation_journal j WHERE j.workspace_id=e.workspace_id AND j.trading_event_id=e.id AND upper(j.stage)='BROKER_PLANNING' ORDER BY datetime(j.observed_at) DESC LIMIT 1) AS correlation_reason,(SELECT COUNT(*) FROM json_each(COALESCE((SELECT json_extract(j.details,'$.accounts') FROM operation_journal j WHERE j.workspace_id=e.workspace_id AND j.trading_event_id=e.id AND upper(j.stage)='BROKER_PLANNING' ORDER BY datetime(j.observed_at) DESC LIMIT 1),'[]'))) AS account_results,(SELECT group_concat((CASE upper(COALESCE(json_extract(a.value,'$.status'),'')) WHEN 'READY' THEN 'READY' WHEN 'SKIPPED' THEN 'SKIPPED' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'FAILED' THEN 'FAILED' ELSE 'OTHER' END)||':'||(CASE upper(COALESCE(json_extract(a.value,'$.reason'),'')) WHEN 'EXECUTION_DISABLED' THEN 'EXECUTION_DISABLED' WHEN 'ACCOUNT_EXECUTION_NOT_ENABLED' THEN 'ACCOUNT_EXECUTION_NOT_ENABLED' WHEN 'MARKET_CONTEXT_UNAVAILABLE' THEN 'MARKET_CONTEXT_UNAVAILABLE' WHEN 'SYMBOL_NOT_FOUND' THEN 'SYMBOL_NOT_FOUND' WHEN 'AMBIGUOUS_SYMBOL' THEN 'AMBIGUOUS_SYMBOL' WHEN 'INVALID_PROTECTION' THEN 'INVALID_PROTECTION' WHEN 'INVALID_PROTECTION_REQUIRED_FOR_RISK_SIZING' THEN 'INVALID_PROTECTION_REQUIRED_FOR_RISK_SIZING' WHEN 'ACCOUNT_ACTIONS_REQUIRED' THEN 'ACCOUNT_ACTIONS_REQUIRED' WHEN 'ACCOUNT_INACTIVE' THEN 'ACCOUNT_INACTIVE' WHEN 'ACCOUNT_NOT_FOUND' THEN 'ACCOUNT_NOT_FOUND' WHEN 'ACCOUNT_POLICY_BLOCKED' THEN 'ACCOUNT_POLICY_BLOCKED' WHEN 'NO_REASON' THEN 'NO_REASON' ELSE CASE WHEN COALESCE(json_extract(a.value,'$.reason'),'')='' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END),',') FROM json_each(COALESCE((SELECT json_extract(j.details,'$.accounts') FROM operation_journal j WHERE j.workspace_id=e.workspace_id AND j.trading_event_id=e.id AND upper(j.stage)='BROKER_PLANNING' ORDER BY datetime(j.observed_at) DESC LIMIT 1),'[]')) a) AS account_plan_summary,(SELECT COUNT(*) FROM position_groups g WHERE g.workspace_id=e.workspace_id AND (g.source_event_id=e.id OR EXISTS(SELECT 1 FROM json_each(COALESCE(g.source_event_ids,'[]')) WHERE value=e.id))) AS groups,(SELECT COUNT(*) FROM destination_deliveries d WHERE d.workspace_id=e.workspace_id AND d.trading_event_id=e.id AND upper(d.destination_type)='TELEGRAM' AND upper(d.status)='SUCCEEDED') AS telegram_succeeded FROM recent_events e ORDER BY datetime(e.received_at) DESC",
            },
            {
              title: 'Recent broker action results by signal (no IDs or text)',
              sql: "WITH recent_events AS (SELECT e.id, e.workspace_id, e.received_at, e.canonical_intent, (SELECT g.canonical_symbol FROM position_groups g WHERE g.workspace_id = e.workspace_id AND (g.source_event_id = e.id OR EXISTS (SELECT 1 FROM json_each(COALESCE(g.source_event_ids, '[]')) WHERE value = e.id OR value = e.external_event_id)) ORDER BY datetime(g.updated_at) DESC LIMIT 1) AS group_symbol FROM trading_events e WHERE datetime(e.received_at) >= datetime(?) ORDER BY datetime(e.received_at) DESC LIMIT 40) SELECT e.received_at, CASE WHEN upper(COALESCE(json_extract(e.canonical_intent, '$.symbol.canonical'), json_extract(e.canonical_intent, '$.symbol'), e.group_symbol, '')) LIKE '%XAUUSD%' THEN 'XAUUSD' WHEN upper(COALESCE(json_extract(e.canonical_intent, '$.symbol.canonical'), json_extract(e.canonical_intent, '$.symbol'), e.group_symbol, '')) LIKE '%VOLATILITY%75%' OR upper(COALESCE(json_extract(e.canonical_intent, '$.symbol.canonical'), json_extract(e.canonical_intent, '$.symbol'), e.group_symbol, '')) LIKE '%V75%' THEN 'VOLATILITY_75' ELSE 'OTHER' END AS symbol_class, CASE lower(COALESCE(a.environment, '')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END AS environment, CASE lower(COALESCE(a.platform, '')) WHEN 'mt5' THEN 'MT5' WHEN 'ctrader' THEN 'CTRADER' WHEN 'deriv' THEN 'DERIV' ELSE 'OTHER' END AS platform, CASE upper(COALESCE(json_extract(action.value, '$.type'), '')) WHEN 'OPEN_POSITION' THEN 'OPEN' WHEN 'MODIFY_POSITION' THEN 'MODIFY' WHEN 'CANCEL_PENDING' THEN 'CANCEL_PENDING' WHEN 'CLOSE_PARTIAL' THEN 'CLOSE_PARTIAL' WHEN 'CLOSE_POSITION' THEN 'CLOSE' ELSE 'OTHER' END AS action_type, CASE upper(COALESCE(json_extract(action.value, '$.status'), '')) WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'DUPLICATE' THEN 'DUPLICATE' WHEN 'FAILED' THEN 'FAILED' WHEN 'BLOCKED' THEN 'BLOCKED' ELSE 'OTHER' END AS action_state, CASE upper(COALESCE(json_extract(action.value, '$.reason'), '')) WHEN 'BROKER_DISPATCH_FAILED' THEN 'BROKER_DISPATCH_FAILED' WHEN 'INVALID_PROTECTION_GEOMETRY' THEN 'INVALID_PROTECTION_GEOMETRY' WHEN 'BROKER_RISK_CONTEXT_UNAVAILABLE' THEN 'BROKER_RISK_CONTEXT_UNAVAILABLE' WHEN 'MT5_CONNECTOR_OFFLINE' THEN 'MT5_CONNECTOR_OFFLINE' WHEN 'POSITION_NOT_FOUND' THEN 'POSITION_NOT_FOUND' WHEN 'ACCOUNT_POLICY_BLOCKED' THEN 'ACCOUNT_POLICY_BLOCKED' WHEN 'EXECUTION_AUTHORITY_REVOKED' THEN 'EXECUTION_AUTHORITY_REVOKED' ELSE CASE WHEN COALESCE(json_extract(action.value, '$.reason'), '') = '' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END AS reason_category, COUNT(*) AS actions FROM recent_events e JOIN operation_journal j ON j.workspace_id = e.workspace_id AND j.trading_event_id = e.id JOIN json_each(COALESCE(json_extract(j.details, '$.accounts'), '[]')) AS account JOIN json_each(COALESCE(json_extract(account.value, '$.actions'), '[]')) AS action LEFT JOIN trade_accounts a ON a.workspace_id = j.workspace_id AND a.id = json_extract(account.value, '$.accountId') WHERE upper(j.stage) = 'BROKER_EXECUTION' GROUP BY e.id, environment, platform, action_type, action_state, reason_category ORDER BY datetime(e.received_at) DESC, environment, platform, action_type LIMIT 120",
            },
            {
              title: 'Latest broker operation categories (no IDs or details)',
              sql: "SELECT COALESCE(observed_at, '') AS observed_at, CASE upper(COALESCE(stage, '')) WHEN 'BROKER_PLANNING' THEN 'BROKER_PLANNING' ELSE 'BROKER_EXECUTION' END AS stage, CASE upper(COALESCE(status, '')) WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'FAILED' THEN 'FAILED' WHEN 'SKIPPED' THEN 'SKIPPED' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'RETRYABLE' THEN 'RETRYABLE' WHEN 'UNCERTAIN' THEN 'UNCERTAIN' WHEN 'INFO' THEN 'INFO' ELSE 'OTHER' END AS operation_state, CASE upper(COALESCE(json_extract(details, '$.status'), '')) WHEN 'SIMULATED' THEN 'SIMULATED' WHEN 'NOT_EXECUTABLE' THEN 'NOT_EXECUTABLE' WHEN 'EXECUTED' THEN 'EXECUTED' WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'PARTIAL_SUCCESS' THEN 'PARTIAL_SUCCESS' WHEN 'PARTIAL_FAILURE' THEN 'PARTIAL_FAILURE' WHEN 'FAILED' THEN 'FAILED' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'TRADING_ACCESS_DISABLED' THEN 'TRADING_ACCESS_DISABLED' WHEN 'BROKER_OWNER_SWITCH_OFF' THEN 'BROKER_OWNER_SWITCH_OFF' WHEN 'TRADING_RUNTIME_CONTROL_UNAVAILABLE' THEN 'TRADING_RUNTIME_CONTROL_UNAVAILABLE' WHEN 'BROKER_RUNTIME_CONTROL_UNAVAILABLE' THEN 'BROKER_RUNTIME_CONTROL_UNAVAILABLE' WHEN 'LIVE_BROKER_RUNTIME_CONTROL_UNAVAILABLE' THEN 'LIVE_BROKER_RUNTIME_CONTROL_UNAVAILABLE' WHEN 'NEEDS_REVIEW' THEN 'NEEDS_REVIEW' WHEN 'READY' THEN 'READY' WHEN 'NO_ACTION' THEN 'NO_ACTION' ELSE 'OTHER' END AS result_state, CASE WHEN COALESCE(error_code, '') = '' THEN 0 ELSE 1 END AS has_error, CASE WHEN COALESCE(failure_class, '') = '' THEN 0 ELSE 1 END AS has_failure FROM operation_journal WHERE upper(COALESCE(stage, '')) IN ('BROKER_PLANNING', 'BROKER_EXECUTION') ORDER BY datetime(observed_at) DESC LIMIT 30",
              params: [],
            },
            {
              title: 'Broker execution outcomes by platform and safe reason category',
              sql: "SELECT COALESCE(j.observed_at, '') AS observed_at, CASE lower(COALESCE(a.environment, 'unknown')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END AS environment, CASE lower(COALESCE(a.platform, '')) WHEN 'deriv' THEN 'DERIV' WHEN 'ctrader' THEN 'CTRADER' WHEN 'mt5' THEN 'MT5' ELSE 'OTHER' END AS platform, CASE upper(COALESCE(json_extract(account.value, '$.status'), '')) WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'PARTIAL' THEN 'PARTIAL' WHEN 'FAILED' THEN 'FAILED' WHEN 'BLOCKED' THEN 'BLOCKED' ELSE 'OTHER' END AS account_state, CASE upper(COALESCE(json_extract(account.value, '$.reason'), '')) WHEN 'ACCOUNT_LOAD_FAILED' THEN 'ACCOUNT_LOAD_FAILED' WHEN 'EXECUTION_AUTHORITY_LOAD_FAILED' THEN 'EXECUTION_AUTHORITY_LOAD_FAILED' WHEN 'EXECUTION_AUTHORITY_REVOKED' THEN 'EXECUTION_AUTHORITY_REVOKED' WHEN 'ACCOUNT_NOT_FOUND' THEN 'ACCOUNT_NOT_FOUND' WHEN 'ACCOUNT_WORKSPACE_MISMATCH' THEN 'ACCOUNT_WORKSPACE_MISMATCH' WHEN 'ACCOUNT_ID_MISMATCH' THEN 'ACCOUNT_ID_MISMATCH' WHEN 'ACCOUNT_INACTIVE' THEN 'ACCOUNT_INACTIVE' WHEN 'ACCOUNT_EXECUTION_DISABLED' THEN 'ACCOUNT_EXECUTION_DISABLED' WHEN 'ACCOUNT_LIVE_EXECUTION_DISABLED' THEN 'ACCOUNT_LIVE_EXECUTION_DISABLED' WHEN 'LIVE_BROKER_RUNTIME_CONTROL_UNAVAILABLE' THEN 'LIVE_BROKER_RUNTIME_CONTROL_UNAVAILABLE' WHEN 'LIVE_BROKER_EXECUTION_DISABLED' THEN 'LIVE_BROKER_EXECUTION_DISABLED' WHEN 'ACCOUNT_ENVIRONMENT_INVALID' THEN 'ACCOUNT_ENVIRONMENT_INVALID' WHEN 'ACCOUNT_ACTIONS_REQUIRED' THEN 'ACCOUNT_ACTIONS_REQUIRED' WHEN 'ACCOUNT_ACTION_FAILED' THEN 'ACCOUNT_ACTION_FAILED' WHEN 'ACCOUNT_ACTION_PARTIALLY_BLOCKED' THEN 'ACCOUNT_ACTION_PARTIALLY_BLOCKED' WHEN 'ACCOUNT_POLICY_BLOCKED' THEN 'ACCOUNT_POLICY_BLOCKED' WHEN 'SUPERSESSION_CLOSE_GROUP_REQUIRED' THEN 'SUPERSESSION_CLOSE_GROUP_REQUIRED' WHEN 'SUPERSESSION_CLOSE_RETRY_FAILED' THEN 'SUPERSESSION_CLOSE_RETRY_FAILED' ELSE CASE WHEN COALESCE(json_extract(account.value, '$.reason'), '') = '' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END AS reason_category, COUNT(*) AS account_outcomes FROM operation_journal j, json_each(COALESCE(json_extract(j.details, '$.accounts'), '[]')) AS account LEFT JOIN trade_accounts a ON a.workspace_id = j.workspace_id AND a.id = json_extract(account.value, '$.accountId') WHERE upper(COALESCE(j.stage, '')) = 'BROKER_EXECUTION' AND datetime(j.observed_at) >= datetime(?) GROUP BY observed_at, environment, platform, account_state, reason_category ORDER BY observed_at DESC, account_outcomes DESC LIMIT 50",
            },
            {
              title: 'Broker action failures by safe reason category',
              sql: "SELECT COALESCE(j.observed_at, '') AS observed_at, CASE lower(COALESCE(a.environment, 'unknown')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END AS environment, CASE lower(COALESCE(a.platform, '')) WHEN 'deriv' THEN 'DERIV' WHEN 'ctrader' THEN 'CTRADER' WHEN 'mt5' THEN 'MT5' ELSE 'OTHER' END AS platform, CASE upper(COALESCE(json_extract(action.value, '$.status'), '')) WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'DUPLICATE' THEN 'DUPLICATE' WHEN 'FAILED' THEN 'FAILED' WHEN 'BLOCKED' THEN 'BLOCKED' ELSE 'OTHER' END AS action_state, CASE upper(COALESCE(json_extract(action.value, '$.reason'), '')) WHEN 'BROKER_RISK_CONTEXT_UNAVAILABLE' THEN 'BROKER_RISK_CONTEXT_UNAVAILABLE' WHEN 'INVALID_PROTECTION_GEOMETRY' THEN 'INVALID_PROTECTION_GEOMETRY' WHEN 'BROKER_DISPATCH_FAILED' THEN 'BROKER_DISPATCH_FAILED' WHEN 'STATE_BIND_FAILED' THEN 'STATE_BIND_FAILED' WHEN 'ACCOUNT_POLICY_BLOCKED' THEN 'ACCOUNT_POLICY_BLOCKED' WHEN 'EXECUTION_AUTHORITY_LOAD_FAILED' THEN 'EXECUTION_AUTHORITY_LOAD_FAILED' WHEN 'EXECUTION_AUTHORITY_REVOKED' THEN 'EXECUTION_AUTHORITY_REVOKED' ELSE CASE WHEN COALESCE(json_extract(action.value, '$.reason'), '') = '' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END AS reason_category, COUNT(*) AS action_outcomes FROM operation_journal j, json_each(COALESCE(json_extract(j.details, '$.accounts'), '[]')) AS account, json_each(COALESCE(json_extract(account.value, '$.actions'), '[]')) AS action LEFT JOIN trade_accounts a ON a.workspace_id = j.workspace_id AND a.id = json_extract(account.value, '$.accountId') WHERE upper(COALESCE(j.stage, '')) = 'BROKER_EXECUTION' AND datetime(j.observed_at) >= datetime(?) GROUP BY observed_at, environment, platform, action_state, reason_category ORDER BY observed_at DESC, action_outcomes DESC LIMIT 100",
            },
            {
              title: 'Accounts by safe execution flags',
