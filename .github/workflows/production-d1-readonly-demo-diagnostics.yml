          const missingApplicationTables = [...expectedApplicationTables].filter((name) => !actualApplicationTables.has(name));
          const unexpectedApplicationTables = [...actualApplicationTables].filter((name) => !expectedApplicationTables.has(name));
          if (missingApplicationTables.length || unexpectedApplicationTables.length) {
