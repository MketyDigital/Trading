name: Production D1 Read-only Demo Diagnostics

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Lookback window in hours (1-120); defaults to five days"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

jobs:
  d1-readonly-diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WINDOW_HOURS: ${{ inputs.window_hours }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Query production D1 without printing message contents
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';

          const hours = Number(process.env.WINDOW_HOURS);
          if (!Number.isInteger(hours) || hours < 1 || hours > 120) {
            throw new Error('WINDOW_HOURS must be an integer from 1 to 120');
          }
          if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) {
            throw new Error('Cloudflare credentials are not configured');
          }

          const config = fs.readFileSync('cloudflare-v2/wrangler.toml', 'utf8');
          const start = config.indexOf('[[d1_databases]]');
          if (start < 0) throw new Error('Production D1 binding was not found');
          const next = config.indexOf('\n[[', start + 1);
          const binding = config.slice(start, next < 0 ? config.length : next);
          const name = binding.match(/^database_name\s*=\s*"([^"]+)"/m)?.[1];
          const databaseId = binding.match(/^database_id\s*=\s*"([^"]+)"/m)?.[1];
          if (name !== 'trading-staging' || !/^[0-9a-f-]{36}$/i.test(databaseId || '')) {
            throw new Error('Expected existing production Trading D1 binding was not verified');
          }

          const cutoff = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
          const queries = [
            {
              title: 'Incoming events by processing state',
              sql: "SELECT CASE lower(COALESCE(processing_status, '')) WHEN 'ready' THEN 'READY' WHEN 'management' THEN 'MANAGEMENT' WHEN 'no_action' THEN 'NO_ACTION' WHEN 'needs_review' THEN 'NEEDS_REVIEW' WHEN 'received' THEN 'RECEIVED' WHEN 'interpreted' THEN 'LEGACY_INTERPRETED' WHEN 'processed' THEN 'PROCESSED' WHEN 'executed' THEN 'EXECUTED' WHEN 'failed' THEN 'FAILED' WHEN 'rejected' THEN 'REJECTED' WHEN 'ignored' THEN 'IGNORED' WHEN 'pending' THEN 'PENDING' WHEN 'processing' THEN 'PROCESSING' ELSE 'OTHER' END AS processing_state, CASE WHEN COALESCE(error_code, '') = '' THEN 0 ELSE 1 END AS has_error, COUNT(*) AS events FROM trading_events WHERE datetime(received_at) >= datetime(?) GROUP BY processing_state, has_error ORDER BY events DESC LIMIT 50",
            },
            {
              title: 'Accounts by safe execution flags',
              sql: "SELECT CASE lower(COALESCE(environment, 'unknown')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END AS environment, CASE lower(COALESCE(platform, '')) WHEN 'deriv' THEN 'DERIV' WHEN 'ctrader' THEN 'CTRADER' WHEN 'mt5' THEN 'MT5' ELSE 'OTHER' END AS platform, COALESCE(is_active, 0) AS is_active, COALESCE(execution_enabled, 0) AS execution_enabled, COALESCE(live_execution_enabled, 0) AS live_execution_enabled, COUNT(*) AS accounts FROM trade_accounts GROUP BY environment, platform, is_active, execution_enabled, live_execution_enabled ORDER BY environment, platform",
              params: [],
            },
            {
              title: 'Recent position and leg states',
              sql: "SELECT CASE lower(COALESCE(a.environment, 'unknown')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END AS environment, CASE lower(COALESCE(g.status, '')) WHEN 'open' THEN 'OPEN' WHEN 'planned' THEN 'PLANNED' WHEN 'pending' THEN 'PENDING' WHEN 'closed' THEN 'CLOSED' WHEN 'failed' THEN 'FAILED' WHEN 'cancelled' THEN 'CANCELLED' ELSE 'OTHER' END AS group_status, CASE lower(COALESCE(l.status, '')) WHEN 'open' THEN 'OPEN' WHEN 'planned' THEN 'PLANNED' WHEN 'pending' THEN 'PENDING' WHEN 'closed' THEN 'CLOSED' WHEN 'failed' THEN 'FAILED' WHEN 'cancelled' THEN 'CANCELLED' ELSE 'NO_LEG_OR_OTHER' END AS leg_status, CASE WHEN COALESCE(l.failure_code, '') = '' THEN 0 ELSE 1 END AS has_failure, COUNT(DISTINCT g.id) AS groups, COUNT(DISTINCT l.id) AS legs FROM position_groups g LEFT JOIN trade_accounts a ON a.workspace_id = g.workspace_id AND a.id = g.trade_account_id LEFT JOIN position_legs l ON l.workspace_id = g.workspace_id AND l.position_group_id = g.id WHERE datetime(g.updated_at) >= datetime(?) GROUP BY environment, group_status, leg_status, has_failure ORDER BY groups DESC LIMIT 100",
            },
            {
              title: 'Recent operation journal outcomes',
              sql: "SELECT CASE upper(COALESCE(stage, '')) WHEN 'INGRESS' THEN 'INGRESS' WHEN 'AUTHORIZATION' THEN 'AUTHORIZATION' WHEN 'INTERPRETATION' THEN 'INTERPRETATION' WHEN 'AI_PROVIDER' THEN 'AI_PROVIDER' WHEN 'CORRELATION' THEN 'CORRELATION' WHEN 'ROUTE' THEN 'ROUTE' WHEN 'DESTINATION' THEN 'DESTINATION' WHEN 'BROKER_PLANNING' THEN 'BROKER_PLANNING' WHEN 'BROKER_EXECUTION' THEN 'BROKER_EXECUTION' WHEN 'MANAGEMENT' THEN 'MANAGEMENT' WHEN 'REPLAY' THEN 'REPLAY' WHEN 'RECONCILIATION' THEN 'RECONCILIATION' WHEN 'CONNECTOR' THEN 'CONNECTOR' WHEN 'PERSISTENCE' THEN 'PERSISTENCE' ELSE 'OTHER_STAGE' END AS stage, CASE upper(COALESCE(status, '')) WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'FAILED' THEN 'FAILED' WHEN 'SKIPPED' THEN 'SKIPPED' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'RETRYABLE' THEN 'RETRYABLE' WHEN 'UNCERTAIN' THEN 'UNCERTAIN' WHEN 'INFO' THEN 'INFO' ELSE 'OTHER' END AS operation_state, CASE WHEN COALESCE(error_code, '') = '' THEN 0 ELSE 1 END AS has_error, CASE WHEN COALESCE(failure_class, '') = '' THEN 0 ELSE 1 END AS has_failure, COUNT(*) AS operations FROM operation_journal WHERE datetime(observed_at) >= datetime(?) GROUP BY stage, operation_state, has_error, has_failure ORDER BY operations DESC LIMIT 100",
            },
            {
              title: 'Recent events without a linked position group',
              sql: "SELECT CASE lower(COALESCE(processing_status, '')) WHEN 'ready' THEN 'READY' WHEN 'management' THEN 'MANAGEMENT' WHEN 'no_action' THEN 'NO_ACTION' WHEN 'needs_review' THEN 'NEEDS_REVIEW' WHEN 'received' THEN 'RECEIVED' WHEN 'interpreted' THEN 'LEGACY_INTERPRETED' WHEN 'processed' THEN 'PROCESSED' WHEN 'executed' THEN 'EXECUTED' WHEN 'failed' THEN 'FAILED' WHEN 'rejected' THEN 'REJECTED' WHEN 'ignored' THEN 'IGNORED' WHEN 'pending' THEN 'PENDING' WHEN 'processing' THEN 'PROCESSING' ELSE 'OTHER' END AS processing_state, CASE WHEN COALESCE(error_code, '') = '' THEN 0 ELSE 1 END AS has_error, COUNT(*) AS events FROM trading_events e WHERE datetime(e.received_at) >= datetime(?) AND NOT EXISTS (SELECT 1 FROM position_groups g WHERE g.workspace_id = e.workspace_id AND (g.source_event_id = e.id OR EXISTS (SELECT 1 FROM json_each(COALESCE(g.source_event_ids, '[]')) WHERE value = e.id))) GROUP BY processing_state, has_error ORDER BY events DESC LIMIT 50",
            },
            {
              title: 'Recent destination outcome categories',
              sql: "SELECT CASE upper(COALESCE(json_extract(outcome.value, '$.status'), '')) WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'FAILED' THEN 'FAILED' WHEN 'REJECTED' THEN 'REJECTED' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'ROUTED' THEN 'ROUTED' ELSE 'OTHER' END AS outcome_state, CASE upper(COALESCE(json_extract(outcome.value, '$.errorCode'), '')) WHEN 'DESTINATION_DISABLED' THEN 'DESTINATION_DISABLED' WHEN 'DESTINATION_WORKSPACE_MISMATCH' THEN 'DESTINATION_WORKSPACE_MISMATCH' WHEN 'DESTINATION_TYPE_UNSUPPORTED' THEN 'DESTINATION_TYPE_UNSUPPORTED' WHEN 'DESTINATION_CREDENTIALS_MISSING' THEN 'DESTINATION_CREDENTIALS_MISSING' WHEN 'DESTINATION_CREDENTIALS_INVALID' THEN 'DESTINATION_CREDENTIALS_INVALID' WHEN 'DESTINATION_REF_MISSING' THEN 'DESTINATION_REF_MISSING' WHEN 'TELEGRAM_BOT_TOKEN_MISSING' THEN 'TELEGRAM_BOT_TOKEN_MISSING' WHEN 'TELEGRAM_DELIVERY_FAILED' THEN 'TELEGRAM_DELIVERY_FAILED' WHEN 'TELEGRAM_EDIT_PARENT_UNRESOLVED' THEN 'TELEGRAM_EDIT_PARENT_UNRESOLVED' WHEN 'WEBHOOK_HTTPS_REQUIRED' THEN 'WEBHOOK_HTTPS_REQUIRED' WHEN 'WEBHOOK_SIGNING_SECRET_MISSING' THEN 'WEBHOOK_SIGNING_SECRET_MISSING' WHEN 'WEBHOOK_HTTP_ERROR' THEN 'WEBHOOK_HTTP_ERROR' WHEN 'WEBHOOK_TIMEOUT' THEN 'WEBHOOK_TIMEOUT' WHEN 'WEBHOOK_TRANSPORT_FAILED' THEN 'WEBHOOK_TRANSPORT_FAILED' WHEN 'DESTINATION_FORMAT_FAILED' THEN 'DESTINATION_FORMAT_FAILED' WHEN 'DESTINATION_DELIVERY_FAILED' THEN 'DESTINATION_DELIVERY_FAILED' ELSE CASE WHEN COALESCE(json_extract(outcome.value, '$.errorCode'), '') = '' THEN 'NO_ERROR_CODE' ELSE 'OTHER_ERROR_CODE' END END AS error_category, COUNT(*) AS outcomes FROM operation_journal j, json_each(COALESCE(json_extract(j.details, '$.outcomes'), '[]')) AS outcome WHERE upper(COALESCE(j.stage, '')) = 'DESTINATION' AND datetime(j.observed_at) >= datetime(?) GROUP BY outcome_state, error_category ORDER BY outcomes DESC LIMIT 50",
            },
            {
              title: 'Recent broker planning and execution result categories',
              sql: "SELECT CASE upper(COALESCE(stage, '')) WHEN 'BROKER_PLANNING' THEN 'BROKER_PLANNING' ELSE 'BROKER_EXECUTION' END AS stage, CASE upper(COALESCE(json_extract(details, '$.status'), '')) WHEN 'SIMULATED' THEN 'SIMULATED' WHEN 'NOT_EXECUTABLE' THEN 'NOT_EXECUTABLE' WHEN 'EXECUTED' THEN 'EXECUTED' WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'PARTIAL_SUCCESS' THEN 'PARTIAL_SUCCESS' WHEN 'PARTIAL_FAILURE' THEN 'PARTIAL_FAILURE' WHEN 'FAILED' THEN 'FAILED' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'TRADING_ACCESS_DISABLED' THEN 'TRADING_ACCESS_DISABLED' WHEN 'BROKER_OWNER_SWITCH_OFF' THEN 'BROKER_OWNER_SWITCH_OFF' WHEN 'TRADING_RUNTIME_CONTROL_UNAVAILABLE' THEN 'TRADING_RUNTIME_CONTROL_UNAVAILABLE' WHEN 'BROKER_RUNTIME_CONTROL_UNAVAILABLE' THEN 'BROKER_RUNTIME_CONTROL_UNAVAILABLE' WHEN 'LIVE_BROKER_RUNTIME_CONTROL_UNAVAILABLE' THEN 'LIVE_BROKER_RUNTIME_CONTROL_UNAVAILABLE' WHEN 'NEEDS_REVIEW' THEN 'NEEDS_REVIEW' WHEN 'READY' THEN 'READY' WHEN 'NO_ACTION' THEN 'NO_ACTION' WHEN 'OTHER' THEN 'OTHER' ELSE 'OTHER' END AS result_state, CASE upper(COALESCE(error_code, '')) WHEN 'NO_READY_PLAN' THEN 'NO_READY_PLAN' WHEN 'TRADING_RUNTIME_CONTROL_UNAVAILABLE' THEN 'TRADING_RUNTIME_CONTROL_UNAVAILABLE' WHEN 'RUNTIME_CONTROL_UNAVAILABLE' THEN 'RUNTIME_CONTROL_UNAVAILABLE' WHEN 'BROKER_OWNER_SWITCH_OFF' THEN 'BROKER_OWNER_SWITCH_OFF' WHEN 'TRADING_ACCESS_DISABLED' THEN 'TRADING_ACCESS_DISABLED' WHEN 'LIVE_BROKER_RUNTIME_CONTROL_UNAVAILABLE' THEN 'LIVE_BROKER_RUNTIME_CONTROL_UNAVAILABLE' ELSE CASE WHEN COALESCE(error_code, '') = '' THEN 'NO_ERROR_CODE' ELSE 'OTHER_ERROR_CODE' END END AS error_category, COUNT(*) AS operations FROM operation_journal WHERE upper(COALESCE(stage, '')) IN ('BROKER_PLANNING', 'BROKER_EXECUTION') AND datetime(observed_at) >= datetime(?) GROUP BY stage, result_state, error_category ORDER BY operations DESC LIMIT 50",
            },
            {
              title: 'Current destinations by safe configuration flags',
              sql: "SELECT CASE lower(COALESCE(destination_type, '')) WHEN 'telegram' THEN 'TELEGRAM' WHEN 'broker_account' THEN 'BROKER_ACCOUNT' WHEN 'internal_webhook' THEN 'INTERNAL_WEBHOOK' WHEN 'audit_only' THEN 'AUDIT_ONLY' ELSE 'OTHER' END AS destination_type, COALESCE(is_active, 0) AS is_active, CASE upper(COALESCE(health_status, '')) WHEN 'HEALTHY' THEN 'HEALTHY' WHEN 'READY' THEN 'READY' WHEN 'UNCONFIGURED' THEN 'UNCONFIGURED' WHEN 'DEGRADED' THEN 'DEGRADED' WHEN 'ERROR' THEN 'ERROR' ELSE 'OTHER' END AS health_state, CASE WHEN COALESCE(destination_ref, '') = '' THEN 0 ELSE 1 END AS has_destination_ref, CASE WHEN COALESCE(credential_ciphertext, '') = '' THEN 0 ELSE 1 END AS has_credential, COUNT(*) AS destinations FROM trading_destinations GROUP BY destination_type, is_active, health_state, has_destination_ref, has_credential ORDER BY destination_type, is_active",
              params: [],
            },
            {
              title: 'Current routes by safe activation flags',
              sql: "SELECT COALESCE(r.is_active, 0) AS route_is_active, COALESCE(d.is_active, 0) AS destination_is_active, COUNT(*) AS routes FROM source_destination_routes r JOIN trading_destinations d ON d.workspace_id = r.workspace_id AND d.id = r.destination_id GROUP BY route_is_active, destination_is_active ORDER BY route_is_active, destination_is_active",
              params: [],
            },
            {
              title: 'Broker plan account readiness summary',
              sql: "SELECT CASE upper(COALESCE(json_extract(j.details, '$.status'), '')) WHEN 'SIMULATED' THEN 'SIMULATED' WHEN 'NEEDS_REVIEW' THEN 'NEEDS_REVIEW' WHEN 'READY' THEN 'READY' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'NO_ACTION' THEN 'NO_ACTION' WHEN 'FAILED' THEN 'FAILED' ELSE 'OTHER' END AS plan_state, CASE WHEN COALESCE(json_extract(j.details, '$.executionEnabled'), 0) = 1 THEN 1 ELSE 0 END AS execution_enabled, CASE upper(COALESCE(json_extract(a.value, '$.status'), '')) WHEN 'READY' THEN 'READY' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'SKIPPED' THEN 'SKIPPED' WHEN 'FAILED' THEN 'FAILED' ELSE 'OTHER' END AS account_state, CASE WHEN COALESCE(json_extract(a.value, '$.actionCount'), 0) > 0 THEN 1 ELSE 0 END AS has_actions, CASE WHEN COALESCE(json_extract(a.value, '$.reason'), '') = '' THEN 0 ELSE 1 END AS has_reason, COUNT(*) AS account_plans FROM operation_journal j LEFT JOIN json_each(COALESCE(json_extract(j.details, '$.accounts'), '[]')) a WHERE upper(COALESCE(j.stage, '')) = 'BROKER_PLANNING' AND datetime(j.observed_at) >= datetime(?) GROUP BY plan_state, execution_enabled, account_state, has_actions, has_reason ORDER BY account_plans DESC LIMIT 50",
            },
            {
              title: 'Application D1 table inventory',
              sql: "SELECT name AS table_name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name <> 'd1_migrations' ORDER BY name",
              params: [],
            },
            {
              title: 'D1 quick integrity check',
              sql: "SELECT CASE WHEN COUNT(*) = 1 AND SUM(CASE WHEN quick_check = 'ok' THEN 1 ELSE 0 END) = 1 THEN 'OK' ELSE 'ISSUES' END AS integrity_status FROM pragma_quick_check",
              params: [],
            },
            {
              title: 'D1 foreign key violation count',
              sql: "SELECT COUNT(*) AS violations FROM pragma_foreign_key_check",
              params: [],
            },
          ];

          const url = 'https://api.cloudflare.com/client/v4/accounts/'
            + encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)
            + '/d1/database/' + encodeURIComponent(databaseId) + '/query';
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              batch: queries.map((query) => ({ sql: query.sql, params: query.params === undefined ? [cutoff] : query.params })),
            }),
          });
          if (!response.ok) throw new Error('Cloudflare D1 query failed with HTTP ' + response.status);
          const payload = await response.json();
          if (payload.success !== true || !Array.isArray(payload.result) || payload.result.length !== queries.length) {
            throw new Error('Cloudflare D1 returned an unsuccessful or incomplete read-only query result');
          }
          for (const result of payload.result) {
            if (result.success !== true || !Array.isArray(result.results)) {
              throw new Error('A bounded D1 diagnostics query did not complete successfully');
            }
          }

          const expectedApplicationTables = new Set([
            'trading_storage_control', 'trading_runtime_controls', 'trading_replication_counters',
            'trading_replication_journal', 'trading_replication_checkpoints', 'workspaces',
            'signal_routes', 'vip_members', 'bank_deposits', 'signal_logs', 'trading_workspace_access',
            'source_connections', 'trading_events', 'destination_deliveries', 'trading_workspace_memberships',
            'trading_workspace_hostnames', 'trading_access_codes', 'trading_access_code_redemptions',
            'trading_destination_templates', 'trading_ctrader_oauth_states', 'trading_ingress_collectors',
            'source_feeds', 'trading_destination_connections', 'trading_event_revisions',
            'orphan_signal_recovery_cursors', 'ai_providers', 'trade_accounts', 'position_groups',
            'position_legs', 'trading_destinations', 'source_destination_routes', 'operation_journal',
            'trading_replication_health', 'trading_replication_quarantine',
          ]);
          const actualApplicationTables = new Set(payload.result[9].results.map((row) => String(row.table_name)));
          const missingApplicationTables = [...expectedApplicationTables].filter((name) => !actualApplicationTables.has(name));
          const unexpectedApplicationTables = [...actualApplicationTables].filter((name) => !expectedApplicationTables.has(name));
          if (missingApplicationTables.length || unexpectedApplicationTables.length) {
            console.log('D1_SCHEMA_INVENTORY=DIFF missing=' + missingApplicationTables.join(',') + ' unexpected=' + unexpectedApplicationTables.join(','));
          } else {
            console.log('D1_SCHEMA_INVENTORY=PASS tables=' + actualApplicationTables.size);
          }
          console.log('D1_QUICK_INTEGRITY=' + String(payload.result[10].results[0]?.integrity_status || 'UNKNOWN'));
          console.log('D1_FOREIGN_KEY_VIOLATIONS=' + String(payload.result[11].results[0]?.violations ?? 'UNKNOWN'));

          const escapeCell = (value) => String(value ?? '').replaceAll('|', '\\|').replaceAll('\n', ' ');
          let report = '# Production D1 read-only diagnostics\n\n'
            + '- Window: last ' + hours + ' hours (through ' + new Date().toISOString() + ')\n'
            + '- Source: existing production D1 binding; SELECT-only queries\n'
            + '- Privacy: database text values are reduced to fixed categories or boolean indicators; raw message text, account IDs, workspace IDs, and credentials are omitted\n';
          for (let i = 0; i < queries.length; i++) {
            const rows = payload.result[i].results;
            report += '\n## ' + queries[i].title + '\n';
            if (!rows.length) {
              report += '\nNo rows.\n';
              continue;
            }
            const columns = Object.keys(rows[0]);
            report += '\n| ' + columns.map(escapeCell).join(' | ') + ' |\n'
              + '| ' + columns.map(() => '---').join(' | ') + ' |\n';
            for (const row of rows) {
              report += '| ' + columns.map((column) => escapeCell(row[column])).join(' | ') + ' |\n';
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
          console.log(report);
          console.log('Production D1 read-only diagnostics completed; only grouped status/error summaries were emitted.');
          NODE
