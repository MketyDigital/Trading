name: Production D1 Read-only Demo Diagnostics

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Lookback window in hours (1-120); defaults to 24 hours"
        required: true
        default: "24"
        type: string

permissions:
  contents: read

jobs:
  d1-readonly-diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WINDOW_HOURS: ${{ inputs.window_hours }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Query focused production D1 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';

          const hours = Number(process.env.WINDOW_HOURS);
          if (!Number.isInteger(hours) || hours < 1 || hours > 120) {
            throw new Error('WINDOW_HOURS must be an integer from 1 to 120');
          }
          if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) {
            throw new Error('Cloudflare credentials are not configured');
          }

          const config = fs.readFileSync('cloudflare-v2/wrangler.toml', 'utf8');
          const start = config.indexOf('[[d1_databases]]');
          if (start < 0) throw new Error('Production D1 binding was not found');
          const next = config.indexOf('\n[[', start + 1);
          const binding = config.slice(start, next < 0 ? config.length : next);
          const name = binding.match(/^database_name\s*=\s*"([^"]+)"/m)?.[1];
          const databaseId = binding.match(/^database_id\s*=\s*"([^"]+)"/m)?.[1];
          if (name !== 'trading-staging' || !/^[0-9a-f-]{36}$/i.test(databaseId || '')) {
            throw new Error('Expected existing production Trading D1 binding was not verified');
          }

          const cutoff = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
          const queries = [
            { title: 'Fast-entry to full-signal account trace (account IDs omitted)', sql: "WITH recent_events AS (\n  SELECT e.id, e.workspace_id, e.external_event_id, e.received_at, e.canonical_intent,\n    CASE WHEN json_extract(e.canonical_intent,'$.stopLoss') IS NOT NULL THEN 1 ELSE 0 END AS has_sl,\n    CASE WHEN json_type(e.canonical_intent,'$.takeProfits')='array' THEN json_array_length(e.canonical_intent,'$.takeProfits')\n         WHEN json_extract(e.canonical_intent,'$.takeProfit') IS NOT NULL THEN 1 ELSE 0 END AS tp_count\n  FROM trading_events e\n  WHERE datetime(e.received_at)>=datetime(?)\n    AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0\n  ORDER BY datetime(e.received_at) DESC LIMIT 40\n), planning AS (\n  SELECT e.id AS event_id,e.workspace_id,e.received_at,j.observed_at,j.details,\n    ROW_NUMBER() OVER(PARTITION BY e.id ORDER BY datetime(j.observed_at) DESC) AS decision_slot\n  FROM recent_events e JOIN operation_journal j\n    ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id\n  WHERE upper(COALESCE(j.stage,''))='BROKER_PLANNING'\n), workspace_slots AS (\n  SELECT id,ROW_NUMBER() OVER(ORDER BY id) AS workspace_slot FROM trading_workspace_access\n), account_slots AS (\n  SELECT a.workspace_id,a.id,a.platform,a.environment,\n    ROW_NUMBER() OVER(PARTITION BY a.workspace_id,lower(a.platform),lower(a.environment) ORDER BY a.id) AS account_slot\n  FROM trade_accounts a\n), execution_accounts AS (\n  SELECT e.id AS event_id,json_extract(account.value,'$.accountId') AS account_id,account.value AS account_json,\n    ROW_NUMBER() OVER(PARTITION BY e.id,json_extract(account.value,'$.accountId') ORDER BY datetime(j.observed_at) DESC) AS execution_slot\n  FROM recent_events e JOIN operation_journal j ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id\n  JOIN json_each(COALESCE(json_extract(j.details,'$.accounts'),'[]')) account\n  WHERE upper(COALESCE(j.stage,''))='BROKER_EXECUTION'\n), group_rollup AS (\n  SELECT re.id AS event_id,g.workspace_id,g.trade_account_id,\n    COUNT(DISTINCT g.id) AS groups,COUNT(DISTINCT l.id) AS legs,\n    SUM(CASE WHEN upper(COALESCE(l.status,'')) IN ('OPEN','PARTIALLY_OPEN','PENDING') THEN 1 ELSE 0 END) AS active_legs\n  FROM recent_events re JOIN position_groups g ON g.workspace_id=re.workspace_id\n    AND (g.source_event_id=re.id OR EXISTS(SELECT 1 FROM json_each(COALESCE(g.source_event_ids,'[]')) WHERE value=re.id OR value=re.external_event_id))\n  LEFT JOIN position_legs l ON l.workspace_id=g.workspace_id AND l.position_group_id=g.id\n  GROUP BY re.id,g.workspace_id,g.trade_account_id\n)\nSELECT p.received_at,\n  CASE WHEN re.has_sl=0 AND re.tp_count=0 THEN 'FAST_ENTRY' ELSE 'FULL_SIGNAL' END AS event_role,\n  CASE WHEN re.has_sl=1 THEN 1 ELSE 0 END AS signal_has_sl,\n  re.tp_count AS signal_tp_count,\n  p.decision_slot,\n  CASE upper(COALESCE(json_extract(p.details,'$.status'),'')) WHEN 'NEEDS_REVIEW' THEN 'NEEDS_REVIEW' WHEN 'SIMULATED' THEN 'SIMULATED' WHEN 'READY' THEN 'READY' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'FAILED' THEN 'FAILED' ELSE 'OTHER' END AS planning_state,\n  CASE upper(COALESCE(json_extract(p.details,'$.correlationReason'),'')) WHEN 'NEW_GROUP' THEN 'NEW_GROUP' WHEN 'FAST_ENTRY_COMPLETION' THEN 'FAST_ENTRY_COMPLETION' WHEN 'FAST_ENTRY_SUPERSESSION' THEN 'FAST_ENTRY_SUPERSESSION' WHEN 'EDIT_TARGET' THEN 'EDIT_TARGET' WHEN 'AMBIGUOUS_FAST_ENTRY_COMPLETION' THEN 'AMBIGUOUS_FAST_ENTRY_COMPLETION' WHEN 'AMBIGUOUS_FAST_ENTRY_SUPERSESSION' THEN 'AMBIGUOUS_FAST_ENTRY_SUPERSESSION' WHEN 'AMBIGUOUS_MANAGEMENT_TARGET' THEN 'AMBIGUOUS_MANAGEMENT_TARGET' WHEN 'NO_MANAGEMENT_TARGET' THEN 'NO_MANAGEMENT_TARGET' WHEN 'NO_REPLY_TARGET' THEN 'NO_REPLY_TARGET' WHEN 'NO_THREAD_TARGET' THEN 'NO_THREAD_TARGET' WHEN 'FAST_ENTRY_COMPLETION_MISMATCH' THEN 'FAST_ENTRY_COMPLETION_MISMATCH' ELSE CASE WHEN COALESCE(json_extract(p.details,'$.correlationReason'),'')='' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END AS correlation_reason,\n  CASE WHEN json_extract(account.value,'$.accountId') IS NULL THEN 'NO_ACCOUNT_RESULT'\n       ELSE 'W'||COALESCE(ws.workspace_slot,0)||'-'||CASE lower(COALESCE(a.platform,'')) WHEN 'mt5' THEN 'MT5' WHEN 'ctrader' THEN 'CTRADER' WHEN 'deriv' THEN 'DERIV' ELSE 'OTHER' END||'-'||CASE lower(COALESCE(a.environment,'')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END||'-A'||COALESCE(ast.account_slot,0) END AS account_slot,\n  CASE upper(COALESCE(json_extract(account.value,'$.status'),'')) WHEN 'READY' THEN 'READY' WHEN 'SKIPPED' THEN 'SKIPPED' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'FAILED' THEN 'FAILED' ELSE CASE WHEN json_extract(account.value,'$.accountId') IS NULL THEN 'NO_ACCOUNT_RESULT' ELSE 'OTHER' END END AS account_state,\n  CASE upper(COALESCE(json_extract(account.value,'$.reason'),'')) WHEN 'EXECUTION_DISABLED' THEN 'EXECUTION_DISABLED' WHEN 'ACCOUNT_EXECUTION_NOT_ENABLED' THEN 'ACCOUNT_EXECUTION_NOT_ENABLED' WHEN 'MARKET_CONTEXT_UNAVAILABLE' THEN 'MARKET_CONTEXT_UNAVAILABLE' WHEN 'SYMBOL_NOT_FOUND' THEN 'SYMBOL_NOT_FOUND' WHEN 'AMBIGUOUS_SYMBOL' THEN 'AMBIGUOUS_SYMBOL' WHEN 'INVALID_PROTECTION' THEN 'INVALID_PROTECTION' WHEN 'INVALID_PROTECTION_REQUIRED_FOR_RISK_SIZING' THEN 'INVALID_PROTECTION_REQUIRED_FOR_RISK_SIZING' WHEN 'ACCOUNT_ACTIONS_REQUIRED' THEN 'ACCOUNT_ACTIONS_REQUIRED' WHEN 'ACCOUNT_INACTIVE' THEN 'ACCOUNT_INACTIVE' WHEN 'ACCOUNT_NOT_FOUND' THEN 'ACCOUNT_NOT_FOUND' WHEN 'ACCOUNT_POLICY_BLOCKED' THEN 'ACCOUNT_POLICY_BLOCKED' ELSE CASE WHEN COALESCE(json_extract(account.value,'$.reason'),'')='' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END AS account_reason,\n  CASE upper(COALESCE(json_extract(exec.account_json,'$.status'),'')) WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'PARTIAL' THEN 'PARTIAL' WHEN 'FAILED' THEN 'FAILED' WHEN 'BLOCKED' THEN 'BLOCKED' ELSE CASE WHEN exec.account_id IS NULL THEN 'NO_EXECUTION_RESULT' ELSE 'OTHER' END END AS execution_state,\n  (SELECT COUNT(*) FROM json_each(COALESCE(json_extract(exec.account_json,'$.actions'),'[]')) act WHERE upper(COALESCE(json_extract(act.value,'$.type'),''))='OPEN_POSITION' AND upper(COALESCE(json_extract(act.value,'$.status'),''))='SUCCEEDED') AS successful_open_actions,\n  (SELECT COUNT(*) FROM json_each(COALESCE(json_extract(exec.account_json,'$.actions'),'[]')) act WHERE upper(COALESCE(json_extract(act.value,'$.type'),''))='OPEN_POSITION' AND upper(COALESCE(json_extract(act.value,'$.status'),'')) IN ('FAILED','BLOCKED')) AS failed_open_actions,\n  COALESCE(gr.groups,0) AS linked_groups,COALESCE(gr.legs,0) AS linked_legs,COALESCE(gr.active_legs,0) AS active_legs\nFROM planning p JOIN recent_events re ON re.id=p.event_id\nLEFT JOIN json_each(COALESCE(json_extract(p.details,'$.accounts'),'[]')) account\nLEFT JOIN trade_accounts a ON a.workspace_id=p.workspace_id AND a.id=json_extract(account.value,'$.accountId')\nLEFT JOIN account_slots ast ON ast.workspace_id=a.workspace_id AND ast.id=a.id\nLEFT JOIN workspace_slots ws ON ws.id=p.workspace_id\nLEFT JOIN execution_accounts exec ON exec.event_id=p.event_id AND exec.account_id=a.id AND exec.execution_slot=1\nLEFT JOIN group_rollup gr ON gr.event_id=p.event_id AND gr.workspace_id=p.workspace_id AND gr.trade_account_id=a.id\nORDER BY datetime(p.received_at),p.decision_slot,account_slot LIMIT 200", params: [cutoff] },
            { title: 'Broker market-context causes and allowlisted diagnostic detail (no raw messages)', sql: "WITH recent_events AS ( SELECT e.id,e.workspace_id,e.received_at, CASE WHEN instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'XAUUSD')>0 THEN 'XAUUSD' WHEN (instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0 AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'75')>0) OR instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'V75')>0 THEN 'VOLATILITY_75' WHEN (instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0 AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'25')>0) OR instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'V25')>0 THEN 'VOLATILITY_25' ELSE 'OTHER' END AS symbol_class FROM trading_events e WHERE datetime(e.received_at) >= datetime(?) ORDER BY datetime(e.received_at) DESC LIMIT 500 ) SELECT e.received_at,e.symbol_class, CASE lower(COALESCE(a.environment,'')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END AS environment, CASE lower(COALESCE(a.platform,'')) WHEN 'mt5' THEN 'MT5' WHEN 'ctrader' THEN 'CTRADER' WHEN 'deriv' THEN 'DERIV' ELSE 'OTHER' END AS platform, CASE upper(COALESCE(json_extract(account.value,'$.brokerContextCode'),'')) WHEN 'BROKER_MARKET_CONTEXT_UNAVAILABLE' THEN 'BROKER_MARKET_CONTEXT_UNAVAILABLE' WHEN 'MT5_SYMBOL_NOT_FOUND' THEN 'MT5_SYMBOL_NOT_FOUND' WHEN 'CTRADER_ACCESS_TOKEN_EXPIRED' THEN 'CTRADER_ACCESS_TOKEN_EXPIRED' WHEN 'UNCLASSIFIED_MARKET_CONTEXT' THEN 'UNCLASSIFIED_MARKET_CONTEXT' WHEN 'MT5_CONNECTOR_OFFLINE' THEN 'MT5_CONNECTOR_OFFLINE' WHEN 'MT5_CREDENTIALS_MISSING' THEN 'MT5_CREDENTIALS_MISSING' WHEN 'MT5_CREDENTIALS_INVALID' THEN 'MT5_CREDENTIALS_INVALID' WHEN 'MT5_GATEWAY_CONFIG_INVALID' THEN 'MT5_GATEWAY_CONFIG_INVALID' WHEN 'MT5_CONTROL_CREDENTIAL_MISSING' THEN 'MT5_CONTROL_CREDENTIAL_MISSING' WHEN 'MT5_IDENTITY_REQUEST_FAILED' THEN 'MT5_IDENTITY_REQUEST_FAILED' WHEN 'MT5_IDENTITY_RESPONSE_INVALID' THEN 'MT5_IDENTITY_RESPONSE_INVALID' WHEN 'MT5_ACCOUNT_ROW_MISMATCH' THEN 'MT5_ACCOUNT_ROW_MISMATCH' WHEN 'MT5_ACCOUNT_IDENTITY_MISMATCH' THEN 'MT5_ACCOUNT_IDENTITY_MISMATCH' WHEN 'MT5_SERVER_IDENTITY_MISMATCH' THEN 'MT5_SERVER_IDENTITY_MISMATCH' WHEN 'MT5_ENVIRONMENT_MISMATCH' THEN 'MT5_ENVIRONMENT_MISMATCH' WHEN 'MT5_SYMBOL_UNRESOLVED' THEN 'MT5_SYMBOL_UNRESOLVED' WHEN 'MT5_CONTEXT_REQUEST_FAILED' THEN 'MT5_CONTEXT_REQUEST_FAILED' WHEN 'MT5_CONTEXT_RESPONSE_INVALID' THEN 'MT5_CONTEXT_RESPONSE_INVALID' WHEN 'MT5_CONTEXT_ACCOUNT_MISMATCH' THEN 'MT5_CONTEXT_ACCOUNT_MISMATCH' WHEN 'MT5_TICK_UNAVAILABLE' THEN 'MT5_TICK_UNAVAILABLE' WHEN 'CTRADER_CREDENTIALS_UNAVAILABLE' THEN 'CTRADER_CREDENTIALS_UNAVAILABLE' WHEN 'CTRADER_CREDENTIALS_INVALID' THEN 'CTRADER_CREDENTIALS_INVALID' WHEN 'CTRADER_ACCOUNT_CANNOT_OPEN' THEN 'CTRADER_ACCOUNT_CANNOT_OPEN' WHEN 'CTRADER_SYMBOL_UNRESOLVED' THEN 'CTRADER_SYMBOL_UNRESOLVED' WHEN 'CTRADER_QUOTE_READER_CONFIG_INVALID' THEN 'CTRADER_QUOTE_READER_CONFIG_INVALID' WHEN 'CTRADER_QUOTE_WAIT_FAILED' THEN 'CTRADER_QUOTE_WAIT_FAILED' WHEN 'CTRADER_QUOTE_UNAVAILABLE' THEN 'CTRADER_QUOTE_UNAVAILABLE' ELSE CASE WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'ch_access_token_invalid')>0 AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'expired')>0 THEN 'CTRADER_ACCESS_TOKEN_EXPIRED' WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'destination symbol resolution failed for deriv:')>0 THEN 'MT5_SYMBOL_NOT_FOUND' ELSE CASE lower(COALESCE(json_extract(account.value,'$.error'),'')) WHEN 'mt5 planning credentials unavailable' THEN 'MT5_CREDENTIALS_MISSING' WHEN 'mt5 planning control credential unavailable' THEN 'MT5_CONTROL_CREDENTIAL_MISSING' WHEN 'mt5 connector is unavailable for broker-authoritative planning' THEN 'MT5_CONNECTOR_OFFLINE' WHEN 'mt5 broker account identity mismatch' THEN 'MT5_ACCOUNT_IDENTITY_MISMATCH' WHEN 'mt5 broker server identity mismatch' THEN 'MT5_SERVER_IDENTITY_MISMATCH' WHEN 'mt5 broker environment mismatch' THEN 'MT5_ENVIRONMENT_MISMATCH' WHEN 'mt5 planning symbol resolution failed' THEN 'MT5_SYMBOL_UNRESOLVED' WHEN 'mt5 broker market context unavailable' THEN 'MT5_CONTEXT_RESPONSE_INVALID' WHEN 'mt5 broker tick unavailable' THEN 'MT5_TICK_UNAVAILABLE' WHEN 'ctrader planning credentials unavailable' THEN 'CTRADER_CREDENTIALS_UNAVAILABLE' WHEN 'ctrader account cannot open trades' THEN 'CTRADER_ACCOUNT_CANNOT_OPEN' WHEN 'ctrader planning symbol resolution failed' THEN 'CTRADER_SYMBOL_UNRESOLVED' WHEN 'ctrader broker side quote unavailable' THEN 'CTRADER_QUOTE_UNAVAILABLE' WHEN 'ctrader quote reader configuration is invalid' THEN 'CTRADER_QUOTE_READER_CONFIG_INVALID' ELSE CASE WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'timeout')>0 THEN 'LEGACY_TIMEOUT' WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'network')>0 THEN 'LEGACY_NETWORK_FAILURE' WHEN COALESCE(json_extract(account.value,'$.error'),'') = '' THEN 'LEGACY_NO_ERROR_DETAIL' ELSE 'LEGACY_UNCLASSIFIED' END END END END AS broker_context_cause, CASE WHEN lower(COALESCE(a.platform,''))='ctrader' AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'ch_access_token_invalid')>0 AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'expired')>0 THEN 'CH_ACCESS_TOKEN_INVALID: ACCESS_TOKEN_EXPIRED' WHEN lower(COALESCE(a.platform,''))='mt5' AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'destination symbol resolution failed for deriv:volatility_25_1s')>0 AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'symbol_not_found')>0 THEN 'SYMBOL_NOT_FOUND: DERIV:VOLATILITY_25_1S (Volatility 25 (1s) Index)' WHEN lower(COALESCE(a.platform,''))='mt5' AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'destination symbol resolution failed for deriv:volatility_75')>0 AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'symbol_not_found')>0 THEN 'SYMBOL_NOT_FOUND: DERIV:VOLATILITY_75 (Volatility 75 Index)' WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'symbol_not_found')>0 THEN 'SYMBOL_NOT_FOUND (symbol suppressed)' ELSE 'NO_ALLOWLISTED_DETAIL' END AS broker_context_detail, COUNT(DISTINCT json_extract(account.value,'$.accountId')) AS blocked_accounts FROM recent_events e JOIN operation_journal j ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id JOIN json_each(COALESCE(json_extract(j.details,'$.accounts'),'[]')) AS account LEFT JOIN trade_accounts a ON a.workspace_id=j.workspace_id AND a.id=json_extract(account.value,'$.accountId') WHERE upper(COALESCE(j.stage,''))='BROKER_PLANNING' AND upper(COALESCE(json_extract(account.value,'$.status'),''))='BLOCKED' AND upper(COALESCE(json_extract(account.value,'$.reason'),''))='MARKET_CONTEXT_UNAVAILABLE' GROUP BY e.id,environment,platform,broker_context_cause,broker_context_detail ORDER BY datetime(e.received_at) DESC,environment,platform LIMIT 100", params: [cutoff] },
          ];

          const headers = {
            Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type': 'application/json',
          };
          const url = 'https://api.cloudflare.com/client/v4/accounts/'
            + encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)
            + '/d1/database/' + encodeURIComponent(databaseId) + '/query';
          const response = await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify({ batch: queries.map((query) => ({ sql: query.sql, params: query.params })) }),
          });
          if (!response.ok) {
            const errorPayload = await response.json().catch(() => null);
            const errors = Array.isArray(errorPayload?.errors) ? errorPayload.errors : [];
            const errorMessages = errors.map((item) => String(item?.message || item?.error || '')).filter(Boolean);
            const errorText = errorMessages.join(' ').toLowerCase();
            let errorClass = 'D1_QUERY_REJECTED';
            if (/syntax error|near .+:/.test(errorText)) errorClass = 'D1_SQL_SYNTAX_ERROR';
            else if (/no such column|unknown column/.test(errorText)) errorClass = 'D1_SCHEMA_COLUMN_ERROR';
            else if (/no such table|unknown table/.test(errorText)) errorClass = 'D1_SCHEMA_TABLE_ERROR';
            else if (/ambiguous column/.test(errorText)) errorClass = 'D1_AMBIGUOUS_COLUMN_ERROR';
            else if (/too many sql variables|too many parameters/.test(errorText)) errorClass = 'D1_PARAMETER_LIMIT_ERROR';
            else if (/malformed json/.test(errorText)) errorClass = 'D1_MALFORMED_JSON';
            const codes = errors.map((item) => Number(item?.code)).filter(Number.isInteger).join(',');
            const safeErrorDetail = errorMessages.join(' ')
              .replace(/\beyJ[A-Za-z0-9._-]+/g, '[TOKEN]')
              .replace(/\b[0-9a-f]{8}-[0-9a-f-]{27,}\b/gi, '[UUID]')
              .replace(/(?:access[_ -]?token|authorization|password|secret|credential)[=: ]+[^ ,;]+/gi, '[SENSITIVE_FIELD_REDACTED]')
              .replace(/https?:\/\/\S+/gi, '[URL]')
              .replace(/\b\d{6,}\b/g, '[NUMBER]')
              .replace(/[^A-Za-z0-9 _.,:;'()\-]/g, '?')
              .slice(0, 240);
            console.error('D1_QUERY_FAILURE class=' + errorClass + ' http=' + response.status + ' codes=' + (codes || 'none') + ' detail=' + (safeErrorDetail || 'NO_ERROR_MESSAGE'));
            throw new Error('Cloudflare D1 query failed; inspect the redacted D1_QUERY_FAILURE detail above');
          }
          const payload = await response.json();
          if (payload.success !== true || !Array.isArray(payload.result) || payload.result.length !== queries.length) {
            throw new Error('Cloudflare D1 returned an unsuccessful or incomplete read-only query result');
          }
          for (const result of payload.result) {
            if (result.success !== true || !Array.isArray(result.results)) {
              throw new Error('A bounded D1 diagnostics query did not complete successfully');
            }
          }

          const meta = payload.result.map((result) => result.meta || {});
          const rowsRead = meta.reduce((sum, item) => sum + (Number(item.rows_read) || 0), 0);
          const rowsWritten = meta.reduce((sum, item) => sum + (Number(item.rows_written) || 0), 0);
          console.log('D1_DIAGNOSTICS statement_count=' + queries.length + ' rows_read=' + rowsRead + ' rows_written=' + rowsWritten);

          let fileSize = 'UNAVAILABLE';
          let databaseInfoClass = 'UNAVAILABLE';
          try {
            const infoResponse = await fetch('https://api.cloudflare.com/client/v4/accounts/'
              + encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)
              + '/d1/database/' + encodeURIComponent(databaseId), { headers });
            const infoPayload = await infoResponse.json().catch(() => null);
            if (infoResponse.ok && infoPayload?.success === true && Number.isFinite(Number(infoPayload.result?.file_size))) {
              fileSize = String(Number(infoPayload.result.file_size));
              databaseInfoClass = 'AVAILABLE';
            } else {
              databaseInfoClass = 'API_UNAVAILABLE';
            }
          } catch {
            databaseInfoClass = 'API_UNAVAILABLE';
          }
          console.log('D1_DATABASE_SIZE class=' + databaseInfoClass + ' file_size_bytes=' + fileSize);

          const escapeCell = (value) => String(value ?? '').replaceAll('|', '\\|').replaceAll('\n', ' ');
          let report = '# Focused production D1 diagnostics\n\n'
            + '- Window: last ' + hours + ' hours (through ' + new Date().toISOString() + ')\n'
            + '- Source: existing production D1 binding; two SELECT-only diagnostic statements\n'
            + '- D1 reads/writes from this workflow: rows_read=' + rowsRead + ', rows_written=' + rowsWritten + ', statements=' + queries.length + '\n'
            + '- D1 database file size: ' + fileSize + ' bytes (' + databaseInfoClass + ')\n'
            + '- Privacy: no raw text, account IDs, workspace IDs, or credentials are emitted; account slots are stable pseudonymous ordinals\n';
          for (let i = 0; i < queries.length; i++) {
            const rows = payload.result[i].results;
            report += '\n## ' + queries[i].title + '\n';
            if (!rows.length) {
              report += '\nNo rows.\n';
              continue;
            }
            const columns = Object.keys(rows[0]);
            report += '\n| ' + columns.map(escapeCell).join(' | ') + ' |\n'
              + '| ' + columns.map(() => '---').join(' | ') + ' |\n';
            for (const row of rows) {
              report += '| ' + columns.map((column) => escapeCell(row[column])).join(' | ') + ' |\n';
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
          console.log(report);
          console.log('Focused production D1 diagnostics completed.');
          NODE
