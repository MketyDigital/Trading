name: Production D1 Read-only Demo Diagnostics

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Lookback window in hours (1-120); used when event timestamps are empty"
        required: true
        default: "1"
        type: string
      event_times_utc:
        description: "Optional comma-separated exact stored UTC timestamps (YYYY-MM-DD HH:MM:SS) for a focused incident trace"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  d1-readonly-diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WINDOW_HOURS: ${{ inputs.window_hours }}
      EVENT_TIMES_UTC: ${{ inputs.event_times_utc }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Query focused production D1 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';

          const hours = Number(process.env.WINDOW_HOURS);
          if (!Number.isInteger(hours) || hours < 1 || hours > 120) {
            throw new Error('WINDOW_HOURS must be an integer from 1 to 120');
          }
          if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) {
            throw new Error('Cloudflare credentials are not configured');
          }

          const config = fs.readFileSync('cloudflare-v2/wrangler.toml', 'utf8');
          const start = config.indexOf('[[d1_databases]]');
          if (start < 0) throw new Error('Production D1 binding was not found');
          const next = config.indexOf('\n[[', start + 1);
          const binding = config.slice(start, next < 0 ? config.length : next);
          const name = binding.match(/^database_name\s*=\s*"([^"]+)"/m)?.[1];
          const databaseId = binding.match(/^database_id\s*=\s*"([^"]+)"/m)?.[1];
          if (name !== 'trading-staging' || !/^[0-9a-f-]{36}$/i.test(databaseId || '')) {
            throw new Error('Expected existing production Trading D1 binding was not verified');
          }

          const cutoff = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString().slice(0, 19).replace('T', ' ');
          const eventTimes = String(process.env.EVENT_TIMES_UTC || '').split(',').map((value) => value.trim()).filter(Boolean);
          if (eventTimes.length > 20 || eventTimes.some((value) => !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(value))) {
            throw new Error('EVENT_TIMES_UTC must contain up to 20 comma-separated YYYY-MM-DD HH:MM:SS timestamps');
          }
          const queries = [
            { title: 'Fast-entry to full-signal account trace (account IDs omitted)', sql: "WITH recent_events AS (\n  SELECT e.id, e.workspace_id, e.external_event_id, e.received_at, e.canonical_intent,\n    CASE WHEN json_extract(e.canonical_intent,'$.stopLoss') IS NOT NULL THEN 1 ELSE 0 END AS has_sl,\n    CASE WHEN json_type(e.canonical_intent,'$.takeProfits')='array' THEN json_array_length(e.canonical_intent,'$.takeProfits')\n         WHEN json_extract(e.canonical_intent,'$.takeProfit') IS NOT NULL THEN 1 ELSE 0 END AS tp_count\n  FROM trading_workspace_access w CROSS JOIN trading_events e INDEXED BY idx_trading_events_workspace_received\n  WHERE e.workspace_id=w.id AND e.received_at>=?\n    AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0\n  ORDER BY e.received_at DESC LIMIT 40\n), planning AS (\n  SELECT e.id AS event_id,e.workspace_id,e.received_at,j.observed_at,j.details,\n    ROW_NUMBER() OVER(PARTITION BY e.id ORDER BY datetime(j.observed_at) DESC) AS decision_slot\n  FROM recent_events e JOIN operation_journal j\n    ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id\n  WHERE upper(COALESCE(j.stage,''))='BROKER_PLANNING'\n), workspace_slots AS (\n  SELECT id,ROW_NUMBER() OVER(ORDER BY id) AS workspace_slot FROM trading_workspace_access\n  WHERE id IN (SELECT workspace_id FROM recent_events)\n), account_slots AS (\n  SELECT a.workspace_id,a.id,a.platform,a.environment,\n    ROW_NUMBER() OVER(PARTITION BY a.workspace_id,lower(a.platform),lower(a.environment) ORDER BY a.id) AS account_slot\n  FROM trade_accounts a\n  WHERE a.workspace_id IN (SELECT workspace_id FROM planning)\n), execution_accounts AS (\n  SELECT e.id AS event_id,json_extract(account.value,'$.accountId') AS account_id,account.value AS account_json,\n    ROW_NUMBER() OVER(PARTITION BY e.id,json_extract(account.value,'$.accountId') ORDER BY datetime(j.observed_at) DESC) AS execution_slot\n  FROM recent_events e JOIN operation_journal j ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id\n  JOIN json_each(COALESCE(json_extract(j.details,'$.accounts'),'[]')) account\n  WHERE upper(COALESCE(j.stage,''))='BROKER_EXECUTION'\n), group_rollup AS (\n  SELECT re.id AS event_id,g.workspace_id,g.trade_account_id,\n    COUNT(DISTINCT g.id) AS groups,COUNT(DISTINCT l.id) AS legs,\n    SUM(CASE WHEN upper(COALESCE(l.status,'')) IN ('OPEN','PARTIALLY_OPEN','PENDING') THEN 1 ELSE 0 END) AS active_legs,\n    SUM(CASE WHEN l.target_index=1 THEN 1 ELSE 0 END) AS first_legs,\n    SUM(CASE WHEN l.target_index=1 AND l.stop_loss IS NOT NULL THEN 1 ELSE 0 END) AS first_legs_with_sl,\n    SUM(CASE WHEN l.target_index=1 AND l.take_profit IS NOT NULL THEN 1 ELSE 0 END) AS first_legs_with_tp,\n    SUM(CASE WHEN l.target_index>1 THEN 1 ELSE 0 END) AS later_legs,\n    SUM(CASE WHEN l.target_index>1 AND l.stop_loss IS NOT NULL THEN 1 ELSE 0 END) AS later_legs_with_sl,\n    SUM(CASE WHEN l.target_index>1 AND l.take_profit IS NOT NULL THEN 1 ELSE 0 END) AS later_legs_with_tp\n  FROM recent_events re JOIN position_groups g ON g.workspace_id=re.workspace_id\n    AND (g.source_event_id=re.id OR EXISTS(SELECT 1 FROM json_each(COALESCE(g.source_event_ids,'[]')) WHERE value=re.id OR value=re.external_event_id))\n  LEFT JOIN position_legs l ON l.workspace_id=g.workspace_id AND l.position_group_id=g.id\n  GROUP BY re.id,g.workspace_id,g.trade_account_id\n)\nSELECT p.received_at,\n  CASE WHEN re.has_sl=0 AND re.tp_count=0 THEN 'FAST_ENTRY' ELSE 'FULL_SIGNAL' END AS event_role,\n  CASE WHEN re.has_sl=1 THEN 1 ELSE 0 END AS signal_has_sl,\n  re.tp_count AS signal_tp_count,\n  p.decision_slot,\n  CASE upper(COALESCE(json_extract(p.details,'$.status'),'')) WHEN 'NEEDS_REVIEW' THEN 'NEEDS_REVIEW' WHEN 'SIMULATED' THEN 'SIMULATED' WHEN 'READY' THEN 'READY' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'FAILED' THEN 'FAILED' ELSE 'OTHER' END AS planning_state,\n  CASE upper(COALESCE(json_extract(p.details,'$.correlationReason'),'')) WHEN 'NEW_GROUP' THEN 'NEW_GROUP' WHEN 'FAST_ENTRY_COMPLETION' THEN 'FAST_ENTRY_COMPLETION' WHEN 'FAST_ENTRY_SUPERSESSION' THEN 'FAST_ENTRY_SUPERSESSION' WHEN 'EDIT_TARGET' THEN 'EDIT_TARGET' WHEN 'AMBIGUOUS_FAST_ENTRY_COMPLETION' THEN 'AMBIGUOUS_FAST_ENTRY_COMPLETION' WHEN 'AMBIGUOUS_FAST_ENTRY_SUPERSESSION' THEN 'AMBIGUOUS_FAST_ENTRY_SUPERSESSION' WHEN 'AMBIGUOUS_MANAGEMENT_TARGET' THEN 'AMBIGUOUS_MANAGEMENT_TARGET' WHEN 'NO_MANAGEMENT_TARGET' THEN 'NO_MANAGEMENT_TARGET' WHEN 'NO_REPLY_TARGET' THEN 'NO_REPLY_TARGET' WHEN 'NO_THREAD_TARGET' THEN 'NO_THREAD_TARGET' WHEN 'FAST_ENTRY_COMPLETION_MISMATCH' THEN 'FAST_ENTRY_COMPLETION_MISMATCH' ELSE CASE WHEN COALESCE(json_extract(p.details,'$.correlationReason'),'')='' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END AS correlation_reason,\n  CASE WHEN json_extract(account.value,'$.accountId') IS NULL THEN 'NO_ACCOUNT_RESULT'\n       ELSE 'W'||COALESCE(ws.workspace_slot,0)||'-'||CASE lower(COALESCE(a.platform,'')) WHEN 'mt5' THEN 'MT5' WHEN 'ctrader' THEN 'CTRADER' WHEN 'deriv' THEN 'DERIV' ELSE 'OTHER' END||'-'||CASE lower(COALESCE(a.environment,'')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END||'-A'||COALESCE(ast.account_slot,0) END AS account_slot,\n  CASE upper(COALESCE(json_extract(account.value,'$.status'),'')) WHEN 'READY' THEN 'READY' WHEN 'SKIPPED' THEN 'SKIPPED' WHEN 'BLOCKED' THEN 'BLOCKED' WHEN 'FAILED' THEN 'FAILED' ELSE CASE WHEN json_extract(account.value,'$.accountId') IS NULL THEN 'NO_ACCOUNT_RESULT' ELSE 'OTHER' END END AS account_state,\n  CASE upper(COALESCE(json_extract(account.value,'$.reason'),'')) WHEN 'EXECUTION_DISABLED' THEN 'EXECUTION_DISABLED' WHEN 'ACCOUNT_EXECUTION_NOT_ENABLED' THEN 'ACCOUNT_EXECUTION_NOT_ENABLED' WHEN 'MARKET_CONTEXT_UNAVAILABLE' THEN 'MARKET_CONTEXT_UNAVAILABLE' WHEN 'SYMBOL_NOT_FOUND' THEN 'SYMBOL_NOT_FOUND' WHEN 'AMBIGUOUS_SYMBOL' THEN 'AMBIGUOUS_SYMBOL' WHEN 'INVALID_PROTECTION' THEN 'INVALID_PROTECTION' WHEN 'INVALID_PROTECTION_REQUIRED_FOR_RISK_SIZING' THEN 'INVALID_PROTECTION_REQUIRED_FOR_RISK_SIZING' WHEN 'ACCOUNT_ACTIONS_REQUIRED' THEN 'ACCOUNT_ACTIONS_REQUIRED' WHEN 'ACCOUNT_INACTIVE' THEN 'ACCOUNT_INACTIVE' WHEN 'ACCOUNT_NOT_FOUND' THEN 'ACCOUNT_NOT_FOUND' WHEN 'ACCOUNT_POLICY_BLOCKED' THEN 'ACCOUNT_POLICY_BLOCKED' ELSE CASE WHEN COALESCE(json_extract(account.value,'$.reason'),'')='' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END AS account_reason,\n  COALESCE(json_extract(account.value,'$.actionCount'),0) AS planned_action_count,\n  CASE upper(COALESCE(json_extract(exec.account_json,'$.status'),'')) WHEN 'SUCCEEDED' THEN 'SUCCEEDED' WHEN 'PARTIAL' THEN 'PARTIAL' WHEN 'FAILED' THEN 'FAILED' WHEN 'BLOCKED' THEN 'BLOCKED' ELSE CASE WHEN exec.account_id IS NULL THEN 'NO_EXECUTION_RESULT' ELSE 'OTHER' END END AS execution_state,\n  json_array_length(COALESCE(json_extract(exec.account_json,'$.actions'),'[]')) AS recorded_action_count,\n  (SELECT COUNT(*) FROM json_each(COALESCE(json_extract(exec.account_json,'$.actions'),'[]')) act WHERE upper(COALESCE(json_extract(act.value,'$.type'),''))='OPEN_POSITION' AND upper(COALESCE(json_extract(act.value,'$.status'),''))='SUCCEEDED') AS successful_open_actions,\n  (SELECT COUNT(*) FROM json_each(COALESCE(json_extract(exec.account_json,'$.actions'),'[]')) act WHERE upper(COALESCE(json_extract(act.value,'$.type'),''))='OPEN_POSITION' AND upper(COALESCE(json_extract(act.value,'$.status'),'')) IN ('FAILED','BLOCKED')) AS failed_open_actions,\n  (SELECT group_concat(COALESCE(upper(json_extract(act.value,'$.type')),'UNKNOWN_ACTION')||':'||upper(COALESCE(json_extract(act.value,'$.status'),'UNKNOWN'))||':'||substr(COALESCE(json_extract(act.value,'$.reason'),'NO_REASON'),1,80)||':ERR='||substr(COALESCE(json_extract(act.value,'$.error'),json_extract(act.value,'$.brokerError'),json_extract(act.value,'$.message'),json_extract(act.value,'$.detail'),json_extract(act.value,'$.details'),json_extract(act.value,'$.code'),''),1,180),',') FROM json_each(COALESCE(json_extract(exec.account_json,'$.actions'),'[]')) act) AS action_summary,\n  COALESCE(gr.groups,0) AS linked_groups,COALESCE(gr.legs,0) AS linked_legs,COALESCE(gr.active_legs,0) AS active_legs,\n  COALESCE(gr.first_legs,0) AS first_legs,COALESCE(gr.first_legs_with_sl,0) AS first_legs_with_sl,COALESCE(gr.first_legs_with_tp,0) AS first_legs_with_tp,\n  COALESCE(gr.later_legs,0) AS later_legs,COALESCE(gr.later_legs_with_sl,0) AS later_legs_with_sl,COALESCE(gr.later_legs_with_tp,0) AS later_legs_with_tp\nFROM planning p JOIN recent_events re ON re.id=p.event_id\nLEFT JOIN json_each(COALESCE(json_extract(p.details,'$.accounts'),'[]')) account\nLEFT JOIN trade_accounts a ON a.workspace_id=p.workspace_id AND a.id=json_extract(account.value,'$.accountId')\nLEFT JOIN account_slots ast ON ast.workspace_id=a.workspace_id AND ast.id=a.id\nLEFT JOIN workspace_slots ws ON ws.id=p.workspace_id\nLEFT JOIN execution_accounts exec ON exec.event_id=p.event_id AND exec.account_id=a.id AND exec.execution_slot=1\nLEFT JOIN group_rollup gr ON gr.event_id=p.event_id AND gr.workspace_id=p.workspace_id AND gr.trade_account_id=a.id\nORDER BY datetime(p.received_at),p.decision_slot,account_slot LIMIT 200", params: [cutoff] },
            { title: 'Broker market-context causes and allowlisted diagnostic detail (no raw messages)', sql: "WITH recent_events AS ( SELECT e.id,e.workspace_id,e.received_at, CASE WHEN instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'XAUUSD')>0 THEN 'XAUUSD' WHEN (instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0 AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'75')>0) OR instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'V75')>0 THEN 'VOLATILITY_75' WHEN (instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0 AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'25')>0) OR instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'V25')>0 THEN 'VOLATILITY_25' ELSE 'OTHER' END AS symbol_class FROM trading_workspace_access w CROSS JOIN trading_events e INDEXED BY idx_trading_events_workspace_received WHERE e.workspace_id=w.id AND e.received_at >= ? ORDER BY e.received_at DESC LIMIT 500 ) SELECT e.received_at,e.symbol_class, CASE lower(COALESCE(a.environment,'')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END AS environment, CASE lower(COALESCE(a.platform,'')) WHEN 'mt5' THEN 'MT5' WHEN 'ctrader' THEN 'CTRADER' WHEN 'deriv' THEN 'DERIV' ELSE 'OTHER' END AS platform, CASE upper(COALESCE(json_extract(account.value,'$.brokerContextCode'),'')) WHEN 'BROKER_MARKET_CONTEXT_UNAVAILABLE' THEN 'BROKER_MARKET_CONTEXT_UNAVAILABLE' WHEN 'MT5_SYMBOL_NOT_FOUND' THEN 'MT5_SYMBOL_NOT_FOUND' WHEN 'CTRADER_ACCESS_TOKEN_EXPIRED' THEN 'CTRADER_ACCESS_TOKEN_EXPIRED' WHEN 'UNCLASSIFIED_MARKET_CONTEXT' THEN 'UNCLASSIFIED_MARKET_CONTEXT' WHEN 'MT5_CONNECTOR_OFFLINE' THEN 'MT5_CONNECTOR_OFFLINE' WHEN 'MT5_CREDENTIALS_MISSING' THEN 'MT5_CREDENTIALS_MISSING' WHEN 'MT5_CREDENTIALS_INVALID' THEN 'MT5_CREDENTIALS_INVALID' WHEN 'MT5_GATEWAY_CONFIG_INVALID' THEN 'MT5_GATEWAY_CONFIG_INVALID' WHEN 'MT5_CONTROL_CREDENTIAL_MISSING' THEN 'MT5_CONTROL_CREDENTIAL_MISSING' WHEN 'MT5_IDENTITY_REQUEST_FAILED' THEN 'MT5_IDENTITY_REQUEST_FAILED' WHEN 'MT5_IDENTITY_RESPONSE_INVALID' THEN 'MT5_IDENTITY_RESPONSE_INVALID' WHEN 'MT5_ACCOUNT_ROW_MISMATCH' THEN 'MT5_ACCOUNT_ROW_MISMATCH' WHEN 'MT5_ACCOUNT_IDENTITY_MISMATCH' THEN 'MT5_ACCOUNT_IDENTITY_MISMATCH' WHEN 'MT5_SERVER_IDENTITY_MISMATCH' THEN 'MT5_SERVER_IDENTITY_MISMATCH' WHEN 'MT5_ENVIRONMENT_MISMATCH' THEN 'MT5_ENVIRONMENT_MISMATCH' WHEN 'MT5_SYMBOL_UNRESOLVED' THEN 'MT5_SYMBOL_UNRESOLVED' WHEN 'MT5_CONTEXT_REQUEST_FAILED' THEN 'MT5_CONTEXT_REQUEST_FAILED' WHEN 'MT5_CONTEXT_RESPONSE_INVALID' THEN 'MT5_CONTEXT_RESPONSE_INVALID' WHEN 'MT5_CONTEXT_ACCOUNT_MISMATCH' THEN 'MT5_CONTEXT_ACCOUNT_MISMATCH' WHEN 'MT5_TICK_UNAVAILABLE' THEN 'MT5_TICK_UNAVAILABLE' WHEN 'CTRADER_CREDENTIALS_UNAVAILABLE' THEN 'CTRADER_CREDENTIALS_UNAVAILABLE' WHEN 'CTRADER_CREDENTIALS_INVALID' THEN 'CTRADER_CREDENTIALS_INVALID' WHEN 'CTRADER_ACCOUNT_CANNOT_OPEN' THEN 'CTRADER_ACCOUNT_CANNOT_OPEN' WHEN 'CTRADER_SYMBOL_UNRESOLVED' THEN 'CTRADER_SYMBOL_UNRESOLVED' WHEN 'CTRADER_QUOTE_READER_CONFIG_INVALID' THEN 'CTRADER_QUOTE_READER_CONFIG_INVALID' WHEN 'CTRADER_QUOTE_WAIT_FAILED' THEN 'CTRADER_QUOTE_WAIT_FAILED' WHEN 'CTRADER_QUOTE_UNAVAILABLE' THEN 'CTRADER_QUOTE_UNAVAILABLE' ELSE CASE WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'ch_access_token_invalid')>0 AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'expired')>0 THEN 'CTRADER_ACCESS_TOKEN_EXPIRED' WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'destination symbol resolution failed for deriv:')>0 THEN 'MT5_SYMBOL_NOT_FOUND' ELSE CASE lower(COALESCE(json_extract(account.value,'$.error'),'')) WHEN 'mt5 planning credentials unavailable' THEN 'MT5_CREDENTIALS_MISSING' WHEN 'mt5 planning control credential unavailable' THEN 'MT5_CONTROL_CREDENTIAL_MISSING' WHEN 'mt5 connector is unavailable for broker-authoritative planning' THEN 'MT5_CONNECTOR_OFFLINE' WHEN 'mt5 broker account identity mismatch' THEN 'MT5_ACCOUNT_IDENTITY_MISMATCH' WHEN 'mt5 broker server identity mismatch' THEN 'MT5_SERVER_IDENTITY_MISMATCH' WHEN 'mt5 broker environment mismatch' THEN 'MT5_ENVIRONMENT_MISMATCH' WHEN 'mt5 planning symbol resolution failed' THEN 'MT5_SYMBOL_UNRESOLVED' WHEN 'mt5 broker market context unavailable' THEN 'MT5_CONTEXT_RESPONSE_INVALID' WHEN 'mt5 broker tick unavailable' THEN 'MT5_TICK_UNAVAILABLE' WHEN 'ctrader planning credentials unavailable' THEN 'CTRADER_CREDENTIALS_UNAVAILABLE' WHEN 'ctrader account cannot open trades' THEN 'CTRADER_ACCOUNT_CANNOT_OPEN' WHEN 'ctrader planning symbol resolution failed' THEN 'CTRADER_SYMBOL_UNRESOLVED' WHEN 'ctrader broker side quote unavailable' THEN 'CTRADER_QUOTE_UNAVAILABLE' WHEN 'ctrader quote reader configuration is invalid' THEN 'CTRADER_QUOTE_READER_CONFIG_INVALID' ELSE CASE WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'timeout')>0 THEN 'LEGACY_TIMEOUT' WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'network')>0 THEN 'LEGACY_NETWORK_FAILURE' WHEN COALESCE(json_extract(account.value,'$.error'),'') = '' THEN 'LEGACY_NO_ERROR_DETAIL' ELSE 'LEGACY_UNCLASSIFIED' END END END END AS broker_context_cause, CASE WHEN lower(COALESCE(a.platform,''))='ctrader' AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'ch_access_token_invalid')>0 AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'expired')>0 THEN 'CH_ACCESS_TOKEN_INVALID: ACCESS_TOKEN_EXPIRED' WHEN lower(COALESCE(a.platform,''))='mt5' AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'destination symbol resolution failed for deriv:volatility_25_1s')>0 AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'symbol_not_found')>0 THEN 'SYMBOL_NOT_FOUND: DERIV:VOLATILITY_25_1S (Volatility 25 (1s) Index)' WHEN lower(COALESCE(a.platform,''))='mt5' AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'destination symbol resolution failed for deriv:volatility_75')>0 AND instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'symbol_not_found')>0 THEN 'SYMBOL_NOT_FOUND: DERIV:VOLATILITY_75 (Volatility 75 Index)' WHEN instr(lower(COALESCE(json_extract(account.value,'$.error'),'')),'symbol_not_found')>0 THEN 'SYMBOL_NOT_FOUND (symbol suppressed)' ELSE 'NO_ALLOWLISTED_DETAIL' END AS broker_context_detail, COUNT(DISTINCT json_extract(account.value,'$.accountId')) AS blocked_accounts FROM recent_events e JOIN operation_journal j ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id JOIN json_each(COALESCE(json_extract(j.details,'$.accounts'),'[]')) AS account LEFT JOIN trade_accounts a ON a.workspace_id=j.workspace_id AND a.id=json_extract(account.value,'$.accountId') WHERE upper(COALESCE(j.stage,''))='BROKER_PLANNING' AND upper(COALESCE(json_extract(account.value,'$.status'),''))='BLOCKED' AND upper(COALESCE(json_extract(account.value,'$.reason'),''))='MARKET_CONTEXT_UNAVAILABLE' GROUP BY e.id,environment,platform,broker_context_cause,broker_context_detail ORDER BY datetime(e.received_at) DESC,environment,platform LIMIT 100", params: [cutoff] },

                      { title: 'Source to configured route, destination, account, and follower map (IDs pseudonymized)', sql: String.raw`
          WITH recent_events AS (
            SELECT e.id,e.workspace_id,e.source_connection_id,e.source_type,e.received_at,e.processing_status,e.error_code,
          ROW_NUMBER() OVER(PARTITION BY e.workspace_id ORDER BY datetime(e.received_at),e.id) AS event_slot,
              e.canonical_intent,e.metadata,
              COALESCE(json_extract(e.metadata,'$.native_identity.chat_id'),json_extract(e.metadata,'$.nativeIdentity.chatId'),
                json_extract(e.metadata,'$.telegram_chat_id'),json_extract(e.metadata,'$.telegramChatId'),
                json_extract(e.metadata,'$.chat_id'),json_extract(e.metadata,'$.chatId')) AS provider_feed_id,
              upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),
                json_extract(e.canonical_intent,'$.symbol.canonicalSymbol'),
                json_extract(e.canonical_intent,'$.canonicalSymbol'),json_extract(e.canonical_intent,'$.symbol'),'')) AS canonical_symbol,
              CASE WHEN json_extract(e.canonical_intent,'$.stopLoss') IS NULL
              AND COALESCE(json_array_length(e.canonical_intent,'$.takeProfits'),
                CASE WHEN json_extract(e.canonical_intent,'$.takeProfit') IS NULL THEN 0 ELSE 1 END)=0
            THEN 'FAST_ENTRY' ELSE 'FULL_SIGNAL' END AS event_role
            FROM trading_workspace_access w JOIN trading_events e INDEXED BY idx_trading_events_workspace_received
              ON e.workspace_id=w.id
            WHERE e.received_at>=? AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),
              json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0
            ORDER BY e.received_at DESC LIMIT 40
          ), workspace_slots AS (
            SELECT id,ROW_NUMBER() OVER(ORDER BY id) AS workspace_slot
            FROM trading_workspace_access WHERE id IN (SELECT workspace_id FROM recent_events)
          ), source_slots AS (
            SELECT sc.workspace_id,sc.id,sc.source_type,sc.display_name,sc.health_status,sc.is_active,sc.last_error_code,sc.updated_at,
              ROW_NUMBER() OVER(PARTITION BY sc.workspace_id ORDER BY sc.id) AS source_slot
            FROM source_connections sc WHERE sc.workspace_id IN (SELECT workspace_id FROM recent_events)
          ), feed_slots AS (
            SELECT sf.workspace_id,sf.source_connection_id,sf.id,sf.feed_type,sf.display_name,sf.is_active,
              ROW_NUMBER() OVER(PARTITION BY sf.workspace_id,sf.source_connection_id ORDER BY sf.id) AS feed_slot
            FROM source_feeds sf WHERE sf.workspace_id IN (SELECT workspace_id FROM recent_events)
          ), route_slots AS (
            SELECT r.workspace_id,r.id,ROW_NUMBER() OVER(PARTITION BY r.workspace_id ORDER BY r.id) AS route_slot
            FROM source_destination_routes r WHERE r.workspace_id IN (SELECT workspace_id FROM recent_events)
          ), destination_slots AS (
            SELECT d.workspace_id,d.id,ROW_NUMBER() OVER(PARTITION BY d.workspace_id ORDER BY d.id) AS destination_slot
            FROM trading_destinations d WHERE d.workspace_id IN (SELECT workspace_id FROM recent_events)
          ), account_slots AS (
            SELECT a.workspace_id,a.id,a.platform,a.environment,
              ROW_NUMBER() OVER(PARTITION BY a.workspace_id,lower(a.platform),lower(COALESCE(a.environment,'')) ORDER BY a.id) AS account_slot
            FROM trade_accounts a WHERE a.workspace_id IN (SELECT workspace_id FROM recent_events)
          ), follower_slots AS (
            SELECT f.workspace_id,f.parent_account_id,f.follower_account_id,
              ROW_NUMBER() OVER(PARTITION BY f.workspace_id,f.parent_account_id ORDER BY f.follower_account_id) AS follower_slot
            FROM trading_account_followers f WHERE f.workspace_id IN (SELECT workspace_id FROM recent_events) AND f.enabled=1
          ), event_feed AS (
            SELECT e.*,sf.id AS source_feed_id,ws.workspace_slot,ss.source_slot,ss.display_name AS source_label,ss.health_status AS source_health,
              ss.last_error_code AS source_last_error,ss.updated_at AS source_updated_at,
              fs.feed_slot,fs.feed_type,fs.display_name AS feed_label
            FROM recent_events e LEFT JOIN source_feeds sf ON sf.workspace_id=e.workspace_id
              AND sf.source_connection_id=e.source_connection_id AND sf.provider_feed_id=e.provider_feed_id AND sf.is_active=1
            LEFT JOIN workspace_slots ws ON ws.id=e.workspace_id
            LEFT JOIN source_slots ss ON ss.workspace_id=e.workspace_id AND ss.id=e.source_connection_id
            LEFT JOIN feed_slots fs ON fs.workspace_id=sf.workspace_id AND fs.source_connection_id=sf.source_connection_id AND fs.id=sf.id
          )
          SELECT 'W'||COALESCE(e.workspace_slot,0)||'-E'||e.event_slot AS event_slot,
            e.received_at,e.event_role,e.canonical_symbol,e.processing_status AS event_status,e.error_code AS event_error,
            'S'||COALESCE(e.source_slot,0) AS source_slot,e.source_type,e.source_label,e.source_health,e.source_last_error,
          CASE WHEN e.source_updated_at IS NOT NULL AND datetime(e.source_updated_at)>datetime(e.received_at) THEN 'SOURCE_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_SOURCE_UPDATE' END AS source_config_timing,
            CASE WHEN e.source_feed_id IS NULL THEN 'NO_ACTIVE_FEED_MATCH' ELSE 'F'||COALESCE(e.feed_slot,0)||':'||COALESCE(e.feed_type,'UNKNOWN') END AS source_feed,
            COALESCE(e.feed_label,'UNNAMED_FEED') AS feed_label,
            CASE WHEN r.id IS NULL THEN 'NO_ROUTE_CONFIG' ELSE 'R'||COALESCE(rs.route_slot,0) END AS route_slot,
            COALESCE(r.route_name,'UNNAMED_ROUTE') AS route_label,
            CASE WHEN r.id IS NULL THEN 'NO_ROUTE_CONFIG'
                 WHEN COALESCE(r.is_active,0)<>1 THEN 'INACTIVE_ROUTE'
                 WHEN EXISTS(SELECT 1 FROM source_destination_routes selective
                   WHERE selective.workspace_id=r.workspace_id AND selective.destination_id=r.destination_id
                     AND selective.source_connection_id=r.source_connection_id AND selective.is_active=1
                     AND selective.source_feed_id IS NOT NULL)
                   THEN CASE WHEN r.source_feed_id=e.source_feed_id AND e.source_feed_id IS NOT NULL
                             THEN 'SELECTED_FEED_ROUTE' ELSE 'NOT_SELECTED_FEED_SCOPE' END
                 WHEN r.source_feed_id IS NULL THEN 'SELECTED_DEFAULT_ROUTE'
                 ELSE 'NOT_SELECTED_FEED_SCOPE' END AS route_scope,
            CASE WHEN r.id IS NULL THEN 'NO_ROUTE'
                 WHEN d.id IS NULL THEN 'DESTINATION_MISSING'
                 WHEN COALESCE(d.is_active,0)<>1 THEN 'DESTINATION_INACTIVE'
                 WHEN json_type(r.filters,'$.allowedCanonicalSymbols') NOT IN ('array','null')
                   AND json_type(r.filters,'$.allowed_canonical_symbols') NOT IN ('array','null') THEN 'ROUTE_FILTERS_INVALID'
                 WHEN json_type(r.filters,'$.blockedCanonicalSymbols') NOT IN ('array','null')
                   AND json_type(r.filters,'$.blocked_canonical_symbols') NOT IN ('array','null') THEN 'ROUTE_FILTERS_INVALID'
                 WHEN COALESCE(json_array_length(r.filters,'$.allowedCanonicalSymbols'),json_array_length(r.filters,'$.allowed_canonical_symbols'),0)=0
                   AND COALESCE(json_array_length(r.filters,'$.blockedCanonicalSymbols'),json_array_length(r.filters,'$.blocked_canonical_symbols'),0)=0
                   THEN 'FILTER_ALLOWED'
                 WHEN e.canonical_symbol='' THEN 'ROUTE_FILTER_SYMBOL_UNAVAILABLE'
                 WHEN EXISTS(SELECT 1 FROM json_each(COALESCE(json_extract(r.filters,'$.blockedCanonicalSymbols'),
                   json_extract(r.filters,'$.blocked_canonical_symbols'),'[]')) f WHERE upper(trim(f.value))=e.canonical_symbol)
                   THEN 'ROUTE_FILTER_SYMBOL_BLOCKED'
                 WHEN COALESCE(json_array_length(r.filters,'$.allowedCanonicalSymbols'),json_array_length(r.filters,'$.allowed_canonical_symbols'),0)>0
                   AND NOT EXISTS(SELECT 1 FROM json_each(COALESCE(json_extract(r.filters,'$.allowedCanonicalSymbols'),
                     json_extract(r.filters,'$.allowed_canonical_symbols'),'[]')) f WHERE upper(trim(f.value))=e.canonical_symbol)
                   THEN 'ROUTE_FILTER_SYMBOL_NOT_ALLOWED'
                 ELSE 'FILTER_ALLOWED' END AS route_filter_result,
            CASE WHEN d.id IS NULL THEN 'NO_DESTINATION'
                 ELSE 'D'||COALESCE(ds.destination_slot,0)||':'||lower(d.destination_type)||':'||upper(COALESCE(d.health_status,'UNKNOWN')) END AS destination_slot,
            COALESCE(d.display_name,'UNNAMED_DESTINATION') AS destination_label,
            CASE WHEN d.id IS NULL THEN 'NO_ACCOUNT_MAPPING'
                 WHEN lower(d.destination_type)<>'broker_account' THEN 'NON_BROKER_DESTINATION'
                 WHEN a.id IS NULL THEN 'ACCOUNT_MAPPING_MISSING'
                 ELSE 'A'||COALESCE(asl.account_slot,0)||'-'||upper(a.platform)||'-'||upper(COALESCE(a.environment,'UNKNOWN')) END AS parent_account,
            COALESCE(a.account_label,'UNLABELLED_ACCOUNT') AS parent_account_label,
            CASE WHEN a.id IS NULL THEN 'UNKNOWN'
                 WHEN COALESCE(a.is_active,0)<>1 THEN 'INACTIVE'
                 WHEN COALESCE(a.execution_enabled,0)<>1 THEN 'EXECUTION_DISABLED'
                 ELSE 'ACTIVE_EXECUTION_ENABLED' END AS parent_account_state,
            CASE WHEN f.follower_account_id IS NULL THEN 'NO_ENABLED_FOLLOWER'
                 ELSE 'F'||COALESCE(fsl.follower_slot,0)||'-'||upper(fa.platform)||'-'||upper(COALESCE(fa.environment,'UNKNOWN')) END AS enabled_follower,
            COALESCE(fa.account_label,'UNLABELLED_ACCOUNT') AS follower_account_label,
            CASE WHEN f.follower_account_id IS NULL THEN 'N/A'
                 WHEN COALESCE(fa.is_active,0)<>1 THEN 'INACTIVE'
                 WHEN COALESCE(fa.execution_enabled,0)<>1 THEN 'EXECUTION_DISABLED'
                 ELSE 'ACTIVE_EXECUTION_ENABLED' END AS follower_state,
            CASE WHEN r.id IS NULL THEN 'NO_EVIDENCE'
                 ELSE COALESCE((SELECT upper(j.status) FROM operation_journal j WHERE j.trading_event_id=e.id
                   AND j.route_id=r.id AND upper(j.stage)='ROUTE' ORDER BY datetime(j.observed_at) DESC LIMIT 1),'NO_ROUTE_STAGE_ROW') END AS route_stage_result,
            CASE WHEN d.id IS NULL THEN 'NO_EVIDENCE'
                 ELSE COALESCE((SELECT upper(j.status) FROM operation_journal j WHERE j.trading_event_id=e.id
                   AND j.destination_id=d.id AND upper(j.stage)='DESTINATION' ORDER BY datetime(j.observed_at) DESC LIMIT 1),'NO_DESTINATION_STAGE_ROW') END AS destination_stage_result,
            CASE WHEN r.id IS NOT NULL AND datetime(r.updated_at)>datetime(e.received_at) THEN 'ROUTE_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_ROUTE_UPDATE' END AS route_config_timing,
          CASE WHEN d.id IS NOT NULL AND datetime(d.updated_at)>datetime(e.received_at) THEN 'DESTINATION_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_DESTINATION_UPDATE' END AS destination_config_timing,
          CASE WHEN a.id IS NOT NULL AND datetime(a.updated_at)>datetime(e.received_at) THEN 'ACCOUNT_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_ACCOUNT_UPDATE' END AS account_config_timing,
          CASE WHEN f.follower_account_id IS NOT NULL AND datetime(f.updated_at)>datetime(e.received_at) THEN 'FOLLOWER_LINK_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_FOLLOWER_UPDATE' END AS follower_config_timing
          FROM event_feed e
          LEFT JOIN source_destination_routes r ON r.workspace_id=e.workspace_id AND r.source_connection_id=e.source_connection_id
          LEFT JOIN route_slots rs ON rs.workspace_id=r.workspace_id AND rs.id=r.id
          LEFT JOIN trading_destinations d ON d.workspace_id=r.workspace_id AND d.id=r.destination_id
          LEFT JOIN destination_slots ds ON ds.workspace_id=d.workspace_id AND ds.id=d.id
          LEFT JOIN trade_accounts a ON a.workspace_id=d.workspace_id
            AND replace(COALESCE(d.destination_ref,''),'trade-account:','')=a.id
          LEFT JOIN account_slots asl ON asl.workspace_id=a.workspace_id AND asl.id=a.id
          LEFT JOIN trading_account_followers f ON f.workspace_id=a.workspace_id AND f.parent_account_id=a.id AND f.enabled=1
          LEFT JOIN trade_accounts fa ON fa.workspace_id=f.workspace_id AND fa.id=f.follower_account_id
          LEFT JOIN follower_slots fsl ON fsl.workspace_id=f.workspace_id AND fsl.parent_account_id=f.parent_account_id AND fsl.follower_account_id=f.follower_account_id
          ORDER BY datetime(e.received_at),route_slot,destination_slot,parent_account,enabled_follower LIMIT 400
          `, params: [cutoff] },
                      { title: 'Complete event-linked operation journal timeline (no raw payloads)', sql: String.raw`
          WITH recent_events AS (
            SELECT e.id,e.workspace_id,e.source_connection_id,e.source_type,e.received_at,e.canonical_intent,
          CASE WHEN json_extract(e.canonical_intent,'$.stopLoss') IS NULL
            AND COALESCE(json_array_length(e.canonical_intent,'$.takeProfits'),
              CASE WHEN json_extract(e.canonical_intent,'$.takeProfit') IS NULL THEN 0 ELSE 1 END)=0
          THEN 'FAST_ENTRY' ELSE 'FULL_SIGNAL' END AS event_role,
          ROW_NUMBER() OVER(PARTITION BY e.workspace_id ORDER BY datetime(e.received_at),e.id) AS event_slot
            FROM trading_workspace_access w JOIN trading_events e INDEXED BY idx_trading_events_workspace_received
              ON e.workspace_id=w.id
            WHERE e.received_at>=? AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),
              json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0
            ORDER BY e.received_at DESC LIMIT 40
          ), workspace_slots AS (
            SELECT id,ROW_NUMBER() OVER(ORDER BY id) AS workspace_slot
            FROM trading_workspace_access WHERE id IN (SELECT workspace_id FROM recent_events)
          ), source_slots AS (
            SELECT workspace_id,id,ROW_NUMBER() OVER(PARTITION BY workspace_id ORDER BY id) AS source_slot
            FROM source_connections WHERE workspace_id IN (SELECT workspace_id FROM recent_events)
          ), route_slots AS (
            SELECT workspace_id,id,ROW_NUMBER() OVER(PARTITION BY workspace_id ORDER BY id) AS route_slot
            FROM source_destination_routes WHERE workspace_id IN (SELECT workspace_id FROM recent_events)
          ), destination_slots AS (
            SELECT workspace_id,id,ROW_NUMBER() OVER(PARTITION BY workspace_id ORDER BY id) AS destination_slot
            FROM trading_destinations WHERE workspace_id IN (SELECT workspace_id FROM recent_events)
          ), account_slots AS (
            SELECT workspace_id,id,platform,environment,
              ROW_NUMBER() OVER(PARTITION BY workspace_id,lower(platform),lower(COALESCE(environment,'')) ORDER BY id) AS account_slot
            FROM trade_accounts WHERE workspace_id IN (SELECT workspace_id FROM recent_events)
          )
          SELECT 'W'||COALESCE(ws.workspace_slot,0)||'-E'||e.event_slot AS event_slot,
            e.received_at AS event_received_at,e.event_role,e.source_type,'S'||COALESCE(ss.source_slot,0) AS source_slot,
            COALESCE(datetime(j.observed_at),e.received_at) AS observed_at,
            COALESCE(upper(j.stage),'NO_JOURNAL_EVIDENCE') AS stage,
            CASE WHEN j.operation IS NULL THEN 'NO_OPERATION_RECORDED' ELSE substr(j.operation,1,120) END AS operation,
            COALESCE(upper(j.status),'NO_JOURNAL_EVIDENCE') AS status,
            COALESCE(j.error_code,'') AS error_code,COALESCE(j.failure_class,'') AS failure_class,
            CASE WHEN j.retryable IS NULL THEN 'UNKNOWN' WHEN j.retryable=1 THEN 'YES' ELSE 'NO' END AS retryable,
            CASE WHEN j.route_id IS NULL THEN '' ELSE 'R'||COALESCE(rs.route_slot,0) END AS route_slot,
            CASE WHEN j.destination_id IS NULL THEN '' ELSE 'D'||COALESCE(ds.destination_slot,0) END AS destination_slot,
            CASE WHEN j.trade_account_id IS NULL THEN '' ELSE 'A'||COALESCE(asl.account_slot,0)||'-'||upper(asl.platform)||'-'||upper(COALESCE(asl.environment,'UNKNOWN')) END AS account_slot,
            CASE WHEN j.connector_id IS NULL OR trim(j.connector_id)='' THEN 'NO_CONNECTOR_ID' ELSE 'CONNECTOR_PRESENT' END AS connector_reference
          FROM recent_events e
          LEFT JOIN operation_journal j ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id
          LEFT JOIN workspace_slots ws ON ws.id=e.workspace_id
          LEFT JOIN source_slots ss ON ss.workspace_id=e.workspace_id AND ss.id=e.source_connection_id
          LEFT JOIN route_slots rs ON rs.workspace_id=e.workspace_id AND rs.id=j.route_id
          LEFT JOIN destination_slots ds ON ds.workspace_id=e.workspace_id AND ds.id=j.destination_id
          LEFT JOIN account_slots asl ON asl.workspace_id=e.workspace_id AND asl.id=j.trade_account_id
          ORDER BY datetime(e.received_at),datetime(j.observed_at),stage LIMIT 800
          `, params: [cutoff] },
                      { title: 'Destination delivery attempts (payloads omitted)', sql: String.raw`
          WITH recent_events AS (
            SELECT e.id,e.workspace_id,e.received_at,e.canonical_intent,
          CASE WHEN json_extract(e.canonical_intent,'$.stopLoss') IS NULL
            AND COALESCE(json_array_length(e.canonical_intent,'$.takeProfits'),
              CASE WHEN json_extract(e.canonical_intent,'$.takeProfit') IS NULL THEN 0 ELSE 1 END)=0
          THEN 'FAST_ENTRY' ELSE 'FULL_SIGNAL' END AS event_role,
          ROW_NUMBER() OVER(PARTITION BY e.workspace_id ORDER BY datetime(e.received_at),e.id) AS event_slot
            FROM trading_workspace_access w JOIN trading_events e INDEXED BY idx_trading_events_workspace_received
              ON e.workspace_id=w.id
            WHERE e.received_at>=? AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),
              json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0
            ORDER BY e.received_at DESC LIMIT 40
          ), workspace_slots AS (
            SELECT id,ROW_NUMBER() OVER(ORDER BY id) AS workspace_slot
            FROM trading_workspace_access WHERE id IN (SELECT workspace_id FROM recent_events)
          ), destination_slots AS (
            SELECT workspace_id,id,destination_ref,ROW_NUMBER() OVER(PARTITION BY workspace_id ORDER BY id) AS destination_slot
            FROM trading_destinations WHERE workspace_id IN (SELECT workspace_id FROM recent_events)
          )
          SELECT 'W'||COALESCE(ws.workspace_slot,0)||'-E'||ROW_NUMBER() OVER(PARTITION BY e.workspace_id ORDER BY datetime(e.received_at),e.id) AS event_slot,
            e.received_at,e.event_role,d.destination_type,CASE WHEN ds.id IS NULL THEN 'UNMAPPED_DESTINATION' ELSE 'D'||ds.destination_slot END AS destination_slot,
            upper(d.status) AS delivery_status,COALESCE(d.error_code,'') AS error_code,
            COALESCE(d.failure_class,'') AS failure_class,d.attempt_count,d.created_at,d.last_attempt_at,d.updated_at,d.next_attempt_at
          FROM recent_events e JOIN destination_deliveries d ON d.workspace_id=e.workspace_id AND d.trading_event_id=e.id
          LEFT JOIN workspace_slots ws ON ws.id=e.workspace_id
          LEFT JOIN destination_slots ds ON ds.workspace_id=d.workspace_id AND ds.destination_ref=d.destination_ref
          ORDER BY datetime(e.received_at),datetime(d.created_at),destination_slot LIMIT 400
          `, params: [cutoff] },
                      { title: 'Unlinked source-stage failures in the selected lookback window (not attributable to a signal)', sql: String.raw`
          WITH volatility_workspaces AS (
            SELECT DISTINCT e.workspace_id
            FROM trading_workspace_access w JOIN trading_events e INDEXED BY idx_trading_events_workspace_received
              ON e.workspace_id=w.id
            WHERE e.received_at>=? AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),
              json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0
          ), source_scope AS (
            SELECT sc.workspace_id,sc.id AS source_connection_id
            FROM source_connections sc WHERE sc.workspace_id IN (SELECT workspace_id FROM volatility_workspaces)
          ), source_slots AS (
            SELECT sc.workspace_id,sc.id,sc.source_type,
              ROW_NUMBER() OVER(PARTITION BY sc.workspace_id ORDER BY sc.id) AS source_slot
            FROM source_connections sc WHERE sc.workspace_id IN (SELECT workspace_id FROM source_scope)
          )
          SELECT 'UNLINKED_TO_EVENT' AS attribution,datetime(j.observed_at) AS observed_at,
            'S'||COALESCE(ss.source_slot,0) AS source_slot,ss.source_type,
            upper(j.stage) AS stage,substr(j.operation,1,120) AS operation,upper(j.status) AS status,
            COALESCE(j.error_code,'') AS error_code,COALESCE(j.failure_class,'') AS failure_class,
            CASE WHEN j.retryable IS NULL THEN 'UNKNOWN' WHEN j.retryable=1 THEN 'YES' ELSE 'NO' END AS retryable
          FROM operation_journal j JOIN source_scope s ON s.workspace_id=j.workspace_id AND s.source_connection_id=j.source_connection_id
          LEFT JOIN source_slots ss ON ss.workspace_id=j.workspace_id AND ss.id=j.source_connection_id
          WHERE j.trading_event_id IS NULL AND upper(j.stage) IN ('INGRESS','AUTHORIZATION','INTERPRETATION','CORRELATION','ROUTE','DESTINATION')
            AND upper(j.status) IN ('FAILED','BLOCKED','RETRYABLE','UNCERTAIN') AND datetime(j.observed_at)>=datetime(?)
          ORDER BY datetime(j.observed_at) DESC LIMIT 300
          `, params: [cutoff,cutoff] },
          
            { title: 'Broker action outcomes linked to stored position legs (IDs omitted)', sql: "WITH recent_events AS (\n  SELECT e.id,e.workspace_id,e.external_event_id,e.received_at,e.canonical_intent\n  FROM trading_workspace_access w\n  CROSS JOIN trading_events e INDEXED BY idx_trading_events_workspace_received\n  WHERE e.workspace_id=w.id AND e.received_at>=?\n    AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0\n  ORDER BY e.received_at DESC LIMIT 40\n), workspace_slots AS (\n  SELECT id,ROW_NUMBER() OVER(ORDER BY id) AS workspace_slot\n  FROM trading_workspace_access WHERE id IN (SELECT workspace_id FROM recent_events)\n), account_slots AS (\n  SELECT a.workspace_id,a.id,a.platform,a.environment,\n    ROW_NUMBER() OVER(PARTITION BY a.workspace_id,lower(a.platform),lower(a.environment) ORDER BY a.id) AS account_slot\n  FROM trade_accounts a WHERE a.workspace_id IN (SELECT workspace_id FROM recent_events)\n), planning_accounts AS (\n  SELECT e.id AS event_id,e.workspace_id,j.observed_at,\n    json_extract(account.value,'$.accountId') AS account_id,account.value AS account_json,\n    ROW_NUMBER() OVER(PARTITION BY e.id,json_extract(account.value,'$.accountId') ORDER BY datetime(j.observed_at) DESC) AS slot\n  FROM recent_events e\n  JOIN operation_journal j ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id\n  JOIN json_each(COALESCE(json_extract(j.details,'$.accounts'),'[]')) account\n  WHERE upper(COALESCE(j.stage,''))='BROKER_PLANNING'\n), latest_plans AS (\n  SELECT * FROM planning_accounts WHERE slot=1\n), plan_actions AS (\n  SELECT p.event_id,p.workspace_id,p.account_id,\n    json_extract(action.value,'$.legId') AS leg_id,\n    json_extract(action.value,'$.type') AS planned_action_type,\n    json_extract(action.value,'$.targetIndex') AS target_index\n  FROM latest_plans p\n  JOIN json_each(COALESCE(json_extract(p.account_json,'$.actions'),'[]')) action\n), execution_actions AS (\n  SELECT e.id AS event_id,e.workspace_id,e.external_event_id,e.received_at,e.canonical_intent,\n    j.observed_at AS execution_observed_at,\n    json_extract(account.value,'$.accountId') AS account_id,\n    json_extract(account.value,'$.status') AS account_execution_status,\n    json_extract(action.value,'$.legId') AS leg_id,\n    action.key AS action_index,action.value AS action_json\n  FROM recent_events e\n  JOIN operation_journal j ON j.workspace_id=e.workspace_id AND j.trading_event_id=e.id\n  JOIN json_each(COALESCE(json_extract(j.details,'$.accounts'),'[]')) account\n  JOIN json_each(COALESCE(json_extract(account.value,'$.actions'),'[]')) action\n  WHERE upper(COALESCE(j.stage,''))='BROKER_EXECUTION'\n), source_groups AS (\n  SELECT e.id AS event_id,e.workspace_id,g.id AS group_id,g.trade_account_id\n  FROM recent_events e JOIN position_groups g ON g.workspace_id=e.workspace_id\n    AND (g.source_event_id=e.id OR EXISTS(\n      SELECT 1 FROM json_each(COALESCE(g.source_event_ids,'[]'))\n      WHERE value=e.id OR value=e.external_event_id\n    ))\n)\nSELECT ea.received_at,\n  CASE WHEN json_extract(ea.canonical_intent,'$.stopLoss') IS NULL\n    AND COALESCE(json_array_length(json_extract(ea.canonical_intent,'$.takeProfits')),0)=0\n    AND json_extract(ea.canonical_intent,'$.takeProfit') IS NULL\n    THEN 'FAST_ENTRY' ELSE 'FULL_SIGNAL' END AS event_role,\n  COALESCE(json_extract(ea.canonical_intent,'$.symbol.canonical'),json_extract(ea.canonical_intent,'$.symbol'),'UNKNOWN') AS canonical_symbol,\n  'W'||COALESCE(ws.workspace_slot,0)||'-'||\n    CASE lower(COALESCE(a.platform,'')) WHEN 'mt5' THEN 'MT5' WHEN 'ctrader' THEN 'CTRADER' WHEN 'deriv' THEN 'DERIV' ELSE 'OTHER' END||'-'||\n    CASE lower(COALESCE(a.environment,'')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END||'-A'||COALESCE(ast.account_slot,0) AS account_slot,\n  ea.execution_observed_at,\n  CASE upper(COALESCE(pa.planned_action_type,'')) WHEN 'OPEN_POSITION' THEN 'OPEN_POSITION' WHEN 'MODIFY_POSITION' THEN 'MODIFY_POSITION'\n    WHEN 'CLOSE_PARTIAL' THEN 'CLOSE_PARTIAL' WHEN 'CLOSE_POSITION' THEN 'CLOSE_POSITION' WHEN 'CANCEL_PENDING' THEN 'CANCEL_PENDING' ELSE 'UNKNOWN_PLANNED_ACTION' END AS planned_action_type,\n  COALESCE(json_extract(ea.action_json,'$.status'),'UNKNOWN') AS outcome_status,\n  CASE upper(COALESCE(json_extract(ea.action_json,'$.reason'),'')) WHEN 'CH_ACCESS_TOKEN_INVALID' THEN 'CH_ACCESS_TOKEN_INVALID'\n    WHEN 'INVALID_STOPS' THEN 'INVALID_STOPS' WHEN 'SYMBOL_NOT_FOUND' THEN 'SYMBOL_NOT_FOUND'\n    WHEN 'MT5_SYMBOL_NOT_FOUND' THEN 'MT5_SYMBOL_NOT_FOUND' WHEN 'BROKER_DISPATCH_FAILED' THEN 'BROKER_DISPATCH_FAILED'\n    WHEN 'STATE_BIND_FAILED' THEN 'STATE_BIND_FAILED' WHEN 'BROKER_ACTION_BLOCKED' THEN 'BROKER_ACTION_BLOCKED'\n    WHEN 'ACCOUNT_ACTION_PARTIALLY_BLOCKED' THEN 'ACCOUNT_ACTION_PARTIALLY_BLOCKED'\n    ELSE CASE WHEN COALESCE(json_extract(ea.action_json,'$.reason'),'')='' THEN 'NO_REASON' ELSE 'OTHER_REASON' END END AS outcome_reason,\n  CASE WHEN json_extract(ea.action_json,'$.brokerPositionId') IS NOT NULL THEN 1 ELSE 0 END AS result_has_position_id,\n  CASE WHEN json_extract(ea.action_json,'$.brokerOrderId') IS NOT NULL THEN 1 ELSE 0 END AS result_has_order_id,\n  CASE WHEN json_extract(ea.action_json,'$.brokerDealId') IS NOT NULL THEN 1 ELSE 0 END AS result_has_deal_id,\n  CASE WHEN json_extract(ea.action_json,'$.fillPrice') IS NOT NULL THEN 1 ELSE 0 END AS result_has_fill_price,\n  CASE WHEN COALESCE(json_extract(ea.action_json,'$.duplicate'),0)=1 THEN 1 ELSE 0 END AS duplicate_outcome,\n  CASE WHEN l.runtime_leg_id IS NOT NULL THEN 1 ELSE 0 END AS matched_position_leg,\n  CASE upper(COALESCE(l.action_type,'')) WHEN 'OPEN_POSITION' THEN 'OPEN_POSITION' WHEN 'MODIFY_POSITION' THEN 'MODIFY_POSITION'\n    WHEN 'CLOSE_PARTIAL' THEN 'CLOSE_PARTIAL' WHEN 'CLOSE_POSITION' THEN 'CLOSE_POSITION' WHEN 'CANCEL_PENDING' THEN 'CANCEL_PENDING' ELSE 'UNKNOWN_LEG_ACTION' END AS stored_leg_action_type,\n  upper(COALESCE(l.status,'NO_LEG_ROW')) AS stored_leg_status,\n  CASE WHEN l.broker_position_id IS NOT NULL THEN 1 ELSE 0 END AS leg_has_position_id,\n  CASE WHEN l.broker_order_id IS NOT NULL THEN 1 ELSE 0 END AS leg_has_order_id,\n  CASE WHEN l.broker_deal_id IS NOT NULL THEN 1 ELSE 0 END AS leg_has_deal_id,\n  CASE WHEN l.fill_price IS NOT NULL THEN 1 ELSE 0 END AS leg_has_fill_price,\n  CASE upper(COALESCE(l.failure_code,'')) WHEN 'INVALID_STOPS' THEN 'INVALID_STOPS'\n    WHEN 'CH_ACCESS_TOKEN_INVALID' THEN 'CH_ACCESS_TOKEN_INVALID' WHEN 'SYMBOL_NOT_FOUND' THEN 'SYMBOL_NOT_FOUND'\n    WHEN 'BROKER_DISPATCH_FAILED' THEN 'BROKER_DISPATCH_FAILED' WHEN 'STATE_BIND_FAILED' THEN 'STATE_BIND_FAILED'\n    ELSE CASE WHEN COALESCE(l.failure_code,'')='' THEN 'NO_FAILURE_CODE' ELSE 'OTHER_FAILURE_CODE' END END AS stored_failure_code\nFROM execution_actions ea\nLEFT JOIN trade_accounts a ON a.workspace_id=ea.workspace_id AND a.id=ea.account_id\nLEFT JOIN account_slots ast ON ast.workspace_id=a.workspace_id AND ast.id=a.id\nLEFT JOIN workspace_slots ws ON ws.id=ea.workspace_id\nLEFT JOIN plan_actions pa ON pa.event_id=ea.event_id AND pa.workspace_id=ea.workspace_id\n  AND pa.account_id=ea.account_id AND (pa.leg_id=ea.leg_id OR pa.leg_id IS NULL)\nLEFT JOIN source_groups sg ON sg.event_id=ea.event_id AND sg.workspace_id=ea.workspace_id AND sg.trade_account_id=ea.account_id\nLEFT JOIN position_legs l ON l.workspace_id=ea.workspace_id AND l.position_group_id=sg.group_id\n  AND ((ea.leg_id IS NOT NULL AND l.runtime_leg_id=ea.leg_id)\n    OR (ea.leg_id IS NULL AND pa.target_index IS NOT NULL AND l.target_index=pa.target_index))\nORDER BY datetime(ea.received_at),datetime(ea.execution_observed_at),account_slot,CAST(ea.action_index AS INTEGER)\nLIMIT 300", params: [cutoff] },
          ];

          if (eventTimes.length) {
            const exactFilter = `e.received_at IN (${eventTimes.map(() => '?').join(',')})`;
            for (const query of queries) {
              const hasEventCutoff = query.sql.includes('e.received_at>=?') || query.sql.includes('e.received_at >= ?');
              if (!hasEventCutoff) continue;
              query.sql = query.sql.replaceAll('e.received_at>=?', exactFilter).replaceAll('e.received_at >= ?', exactFilter);
              query.params = [...eventTimes, ...query.params.slice(1)];
            }
          }

          if (eventTimes.length) {
            queries.push({ title: 'D1 query plan for timestamp selection', sql: 'EXPLAIN QUERY PLAN SELECT e.id, e.workspace_id, e.received_at FROM trading_workspace_access w CROSS JOIN trading_events e INDEXED BY idx_trading_events_workspace_received WHERE e.workspace_id=w.id AND e.received_at IN (?,?)', params: eventTimes.slice(0,2) });
          }
          if (eventTimes.length) {
            const placeholders = eventTimes.map(() => '?').join(',');
            queries.push({
              title: 'Per-target protection skips (allowlisted categories)',
              sql: `WITH selected_events AS (
                SELECT e.id, e.workspace_id, e.received_at
                FROM trading_workspace_access w
                CROSS JOIN trading_events e INDEXED BY idx_trading_events_workspace_received
                WHERE e.workspace_id=w.id
                  AND e.received_at IN (${placeholders})
                  AND instr(upper(COALESCE(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),'')),'VOLATILITY')>0
              ), workspace_slots AS (
                SELECT id,ROW_NUMBER() OVER(ORDER BY id) AS workspace_slot
                FROM trading_workspace_access
                WHERE id IN (SELECT workspace_id FROM selected_events)
              ), account_slots AS (
                SELECT a.workspace_id,a.id,a.platform,a.environment,
                  ROW_NUMBER() OVER(PARTITION BY a.workspace_id,lower(a.platform),lower(a.environment) ORDER BY a.id) AS account_slot
                FROM trade_accounts a
                WHERE EXISTS (
                  SELECT 1 FROM selected_events e
                  JOIN operation_journal p ON p.workspace_id=e.workspace_id AND p.trading_event_id=e.id
                  JOIN json_each(COALESCE(json_extract(p.details,'$.accounts'),'[]')) planned_account
                    ON json_extract(planned_account.value,'$.accountId')=a.id
                  WHERE upper(COALESCE(p.stage,''))='BROKER_PLANNING'
                )
              )
              SELECT e.received_at,
                'W'||COALESCE(ws.workspace_slot,0)||'-'||
                  CASE lower(COALESCE(a.platform,'')) WHEN 'mt5' THEN 'MT5' WHEN 'ctrader' THEN 'CTRADER' WHEN 'deriv' THEN 'DERIV' ELSE 'OTHER' END||'-'||
                  CASE lower(COALESCE(a.environment,'')) WHEN 'demo' THEN 'DEMO' WHEN 'live' THEN 'LIVE' ELSE 'UNKNOWN' END||'-A'||COALESCE(ast.account_slot,0) AS account_slot,
                CASE lower(COALESCE(json_extract(s.details,'$.field'),'')) WHEN 'stoploss' THEN 'STOP_LOSS' WHEN 'takeprofits' THEN 'TAKE_PROFITS' ELSE 'OTHER_FIELD' END AS field,
                CASE
                  WHEN upper(COALESCE(s.error_code,''))='SL_SKIPPED_INVALID_GEOMETRY' THEN 'SL_INVALID_GEOMETRY'
                  WHEN upper(COALESCE(s.error_code,''))='SL_SKIPPED_INVALID_PRICE' THEN 'SL_INVALID_PRICE'
                  WHEN upper(COALESCE(s.error_code,''))='SL_SKIPPED_INVALID_COMPLETION_GEOMETRY' THEN 'SL_INVALID_COMPLETION_GEOMETRY'
                  WHEN upper(COALESCE(s.error_code,'')) LIKE 'TP%_SKIPPED_PASSED_MARKET' THEN 'TP_PASSED_MARKET'
                  WHEN upper(COALESCE(s.error_code,'')) LIKE 'TP%_SKIPPED_INVALID_COMPLETION_GEOMETRY' THEN 'TP_INVALID_COMPLETION_GEOMETRY'
                  WHEN upper(COALESCE(s.error_code,'')) LIKE 'TP%_SKIPPED_INVALID_GEOMETRY' THEN 'TP_INVALID_GEOMETRY'
                  WHEN upper(COALESCE(s.error_code,'')) LIKE 'TP%_SKIPPED_INVALID_PRICE' THEN 'TP_INVALID_PRICE'
                  ELSE 'OTHER_SKIP'
                END AS skip_cause,
                CASE WHEN CAST(json_extract(s.details,'$.targetIndex') AS INTEGER) BETWEEN 1 AND 20
                  THEN CAST(json_extract(s.details,'$.targetIndex') AS INTEGER) ELSE NULL END AS target_index
              FROM selected_events e
              JOIN operation_journal s ON s.workspace_id=e.workspace_id AND s.trading_event_id=e.id
              LEFT JOIN trade_accounts a ON a.workspace_id=s.workspace_id AND a.id=s.trade_account_id
              LEFT JOIN account_slots ast ON ast.workspace_id=a.workspace_id AND ast.id=a.id
              LEFT JOIN workspace_slots ws ON ws.id=e.workspace_id
              WHERE upper(COALESCE(s.stage,''))='BROKER_PLANNING'
                AND lower(COALESCE(s.operation,''))='skip_invalid_protection'
              ORDER BY datetime(e.received_at),account_slot,field,target_index
              LIMIT 200`,
              params: eventTimes,
            });
          }

          const headers = {
            Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type': 'application/json',
          };
          const url = 'https://api.cloudflare.com/client/v4/accounts/'
            + encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)
            + '/d1/database/' + encodeURIComponent(databaseId) + '/query';
          const schemaTables = ['source_connections','source_destination_routes','trading_destinations','trade_accounts'];
          const schemaResponse = await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify({ batch: [
              { sql: "SELECT name FROM sqlite_master WHERE type='table' AND name=?", params: ['trading_account_followers'] },
              ...schemaTables.map((table) => ({ sql: 'PRAGMA table_info(' + table + ')', params: [] })),
            ] }),
          });
          const schemaPayload = await schemaResponse.json().catch(() => null);
          const schemaResults = schemaPayload?.result;
          if (!schemaResponse.ok || schemaPayload?.success !== true || !Array.isArray(schemaResults)
            || schemaResults.length !== schemaTables.length + 1
            || schemaResults.some((result) => result?.success !== true || !Array.isArray(result.results))) {
            throw new Error('Could not verify optional D1 schema in read-only preflight');
          }
          const followerTableAvailable = schemaResults[0].results.some((row) => row.name === 'trading_account_followers');
          const columnsByTable = Object.fromEntries(schemaTables.map((table, index) => [
            table,
            new Set(schemaResults[index + 1].results.map((row) => String(row.name))),
          ]));
          const hasColumn = (table, column) => columnsByTable[table]?.has(column) === true;
          const schemaReadRows = schemaResults.reduce((sum, result) => sum + (Number(result.meta?.rows_read) || 0), 0);
          const schemaWrittenRows = schemaResults.reduce((sum, result) => sum + (Number(result.meta?.rows_written) || 0), 0);
          if (schemaWrittenRows !== 0) throw new Error('Read-only schema preflight reported a write');
          const routeQuery = queries.find((query) => query.title.startsWith('Source to configured route, destination, account, and follower map'));
          if (!routeQuery) throw new Error('Route and account diagnostic query was not found');
          const routeUnavailable = [];
          if (!followerTableAvailable) {
            routeQuery.sql = routeQuery.sql
              .replace(
                "FROM trading_account_followers f WHERE f.workspace_id IN (SELECT workspace_id FROM recent_events) AND f.enabled=1",
                "FROM (SELECT NULL AS workspace_id,NULL AS parent_account_id,NULL AS follower_account_id,0 AS enabled WHERE 0) f WHERE f.workspace_id IN (SELECT workspace_id FROM recent_events) AND f.enabled=1",
              )
              .replace(
                "LEFT JOIN trading_account_followers f ON f.workspace_id=a.workspace_id AND f.parent_account_id=a.id AND f.enabled=1",
                "LEFT JOIN (SELECT NULL AS workspace_id,NULL AS parent_account_id,NULL AS follower_account_id,NULL AS enabled,NULL AS updated_at WHERE 0) f ON f.workspace_id=a.workspace_id AND f.parent_account_id=a.id AND f.enabled=1",
              );
            routeUnavailable.push('trading_account_followers table');
          }
          if (!hasColumn('source_connections','updated_at')) {
            routeQuery.sql = routeQuery.sql
              .replace('sc.last_error_code,sc.updated_at,','sc.last_error_code,NULL AS updated_at,')
              .replace(
                "CASE WHEN e.source_updated_at IS NOT NULL AND datetime(e.source_updated_at)>datetime(e.received_at) THEN 'SOURCE_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_SOURCE_UPDATE' END AS source_config_timing",
                "'SOURCE_UPDATE_TIME_UNAVAILABLE' AS source_config_timing",
              );
            routeUnavailable.push('source_connections.updated_at');
          }
          if (!hasColumn('source_destination_routes','updated_at')) {
            routeQuery.sql = routeQuery.sql.replace(
              "CASE WHEN r.id IS NOT NULL AND datetime(r.updated_at)>datetime(e.received_at) THEN 'ROUTE_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_ROUTE_UPDATE' END AS route_config_timing",
              "'ROUTE_UPDATE_TIME_UNAVAILABLE' AS route_config_timing",
            );
            routeUnavailable.push('source_destination_routes.updated_at');
          }
          if (!hasColumn('trading_destinations','updated_at')) {
            routeQuery.sql = routeQuery.sql.replace(
              "CASE WHEN d.id IS NOT NULL AND datetime(d.updated_at)>datetime(e.received_at) THEN 'DESTINATION_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_DESTINATION_UPDATE' END AS destination_config_timing",
              "'DESTINATION_UPDATE_TIME_UNAVAILABLE' AS destination_config_timing",
            );
            routeUnavailable.push('trading_destinations.updated_at');
          }
          if (!hasColumn('trade_accounts','updated_at')) {
            routeQuery.sql = routeQuery.sql.replace(
              "CASE WHEN a.id IS NOT NULL AND datetime(a.updated_at)>datetime(e.received_at) THEN 'ACCOUNT_CHANGED_AFTER_EVENT' ELSE 'NO_POST_EVENT_ACCOUNT_UPDATE' END AS account_config_timing",
              "'ACCOUNT_UPDATE_TIME_UNAVAILABLE' AS account_config_timing",
            );
            routeUnavailable.push('trade_accounts.updated_at');
          }
          if (routeUnavailable.length) routeQuery.title += ' (schema fields unavailable: ' + routeUnavailable.join(', ') + ')';
          console.log('D1_OPTIONAL_SCHEMA trading_account_followers=' + (followerTableAvailable ? 'AVAILABLE' : 'ABSENT')
            + ' route_schema_unavailable=' + (routeUnavailable.join(',') || 'NONE'));

          const response = await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify({ batch: queries.map((query) => ({ sql: query.sql, params: query.params })) }),
          });
          if (!response.ok) {
            const errorPayload = await response.json().catch(() => null);
            const errors = Array.isArray(errorPayload?.errors) ? errorPayload.errors : [];
            const errorMessages = errors.map((item) => String(item?.message || item?.error || '')).filter(Boolean);
            const errorText = errorMessages.join(' ').toLowerCase();
            let errorClass = 'D1_QUERY_REJECTED';
            if (/syntax error|near .+:/.test(errorText)) errorClass = 'D1_SQL_SYNTAX_ERROR';
            else if (/no such column|unknown column/.test(errorText)) errorClass = 'D1_SCHEMA_COLUMN_ERROR';
            else if (/no such table|unknown table/.test(errorText)) errorClass = 'D1_SCHEMA_TABLE_ERROR';
            else if (/ambiguous column/.test(errorText)) errorClass = 'D1_AMBIGUOUS_COLUMN_ERROR';
            else if (/too many sql variables|too many parameters/.test(errorText)) errorClass = 'D1_PARAMETER_LIMIT_ERROR';
            else if (/malformed json/.test(errorText)) errorClass = 'D1_MALFORMED_JSON';
            const codes = errors.map((item) => Number(item?.code)).filter(Number.isInteger).join(',');
            const safeErrorDetail = errorMessages.join(' ')
              .replace(/\beyJ[A-Za-z0-9._-]+/g, '[TOKEN]')
              .replace(/\b[0-9a-f]{8}-[0-9a-f-]{27,}\b/gi, '[UUID]')
              .replace(/(?:access[_ -]?token|authorization|password|secret|credential)[=: ]+[^ ,;]+/gi, '[SENSITIVE_FIELD_REDACTED]')
              .replace(/https?:\/\/\S+/gi, '[URL]')
              .replace(/\b\d{6,}\b/g, '[NUMBER]')
              .replace(/[^A-Za-z0-9 _.,:;'()\-]/g, '?')
              .slice(0, 240);
            console.error('D1_QUERY_FAILURE class=' + errorClass + ' http=' + response.status + ' codes=' + (codes || 'none') + ' detail=' + (safeErrorDetail || 'NO_ERROR_MESSAGE'));
            throw new Error('Cloudflare D1 query failed; inspect the redacted D1_QUERY_FAILURE detail above');
          }
          const payload = await response.json();
          if (payload.success !== true || !Array.isArray(payload.result) || payload.result.length !== queries.length) {
            throw new Error('Cloudflare D1 returned an unsuccessful or incomplete read-only query result');
          }
          for (const result of payload.result) {
            if (result.success !== true || !Array.isArray(result.results)) {
              throw new Error('A bounded D1 diagnostics query did not complete successfully');
            }
          }

          const meta = payload.result.map((result) => result.meta || {});
          const rowsRead = schemaReadRows + meta.reduce((sum, item) => sum + (Number(item.rows_read) || 0), 0);
          const rowsWritten = schemaWrittenRows + meta.reduce((sum, item) => sum + (Number(item.rows_written) || 0), 0);
          meta.forEach((item, index) => console.log('D1_DIAGNOSTIC_STATEMENT index=' + (index + 1) + ' rows_read=' + (Number(item.rows_read) || 0) + ' rows_written=' + (Number(item.rows_written) || 0)));
          console.log('D1_DIAGNOSTICS statement_count=' + queries.length + ' rows_read=' + rowsRead + ' rows_written=' + rowsWritten);

          let fileSize = 'UNAVAILABLE';
          let databaseInfoClass = 'UNAVAILABLE';
          try {
            const infoResponse = await fetch('https://api.cloudflare.com/client/v4/accounts/'
              + encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)
              + '/d1/database/' + encodeURIComponent(databaseId), { headers });
            const infoPayload = await infoResponse.json().catch(() => null);
            if (infoResponse.ok && infoPayload?.success === true && Number.isFinite(Number(infoPayload.result?.file_size))) {
              fileSize = String(Number(infoPayload.result.file_size));
              databaseInfoClass = 'AVAILABLE';
            } else {
              databaseInfoClass = 'API_UNAVAILABLE';
            }
          } catch {
            databaseInfoClass = 'API_UNAVAILABLE';
          }
          console.log('D1_DATABASE_SIZE class=' + databaseInfoClass + ' file_size_bytes=' + fileSize);

          const redactCell = (value) => String(value ?? '')
            .replace(/\beyJ[A-Za-z0-9._-]+/g, '[TOKEN]')
            .replace(/\b[0-9a-f]{8}-[0-9a-f-]{27,}\b/gi, '[ID]')
            .replace(/(?:access[_ -]?token|authorization|password|secret|credential)[=: ]+[^ ,;]+/gi, '[SENSITIVE_FIELD_REDACTED]')
            .replace(/https?:\/\/\S+/gi, '[URL]')
            .replace(/\b\d{6,}\b/g, '[NUMBER]')
            .slice(0, 220);
          const escapeCell = (value) => redactCell(value).replaceAll('|', '\\|').replaceAll('\n', ' ');
          const windowLabel = eventTimes.length
            ? 'exact received_at values: ' + eventTimes.join(', ')
            : 'last ' + hours + ' hours (through ' + new Date().toISOString() + ')';
          let report = '# Focused production D1 diagnostics\n\n'
            + '- Window: ' + windowLabel + '\n'
            + '- Source: existing production D1 binding; ' + queries.length + ' SELECT-only diagnostic statements plus a schema availability preflight\n'
            + '- D1 reads/writes from this workflow: rows_read=' + rowsRead + ', rows_written=' + rowsWritten + ', statements=' + queries.length + '\n'
            + '- D1 database file size: ' + fileSize + ' bytes (' + databaseInfoClass + ')\n'
            + '- Privacy: no raw text, account IDs, workspace IDs, or credentials are emitted; account slots are stable pseudonymous ordinals\n';
          for (let i = 0; i < queries.length; i++) {
            const rows = payload.result[i].results;
            report += '\n## ' + queries[i].title + '\n';
            if (!rows.length) {
              report += '\nNo rows.\n';
              continue;
            }
            const columns = Object.keys(rows[0]);
            report += '\n| ' + columns.map(escapeCell).join(' | ') + ' |\n'
              + '| ' + columns.map(() => '---').join(' | ') + ' |\n';
            for (const row of rows) {
              report += '| ' + columns.map((column) => escapeCell(row[column])).join(' | ') + ' |\n';
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
          console.log(report);
          console.log('Focused production D1 diagnostics completed.');
          NODE
