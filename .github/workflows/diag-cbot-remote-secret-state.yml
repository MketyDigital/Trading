name: Diagnose cBot Worker Remote Secret State

on:
  push:
    branches:
      - 'diag/coolify-cbot-runtime'
    paths:
      - '.github/workflows/diag-cbot-remote-secret-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Report cBot secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.toml > /tmp/secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8'));
          const names=new Set(rows.map(x=>String(x.name||'')));
          for (const name of ['CBOT_TOKEN_SIGNING_KEY','CBOT_CONTROL_SECRET']) {
            console.log(`${name}: ${names.has(name)?'PRESENT':'MISSING'}`);
          }
          if (!names.has('CBOT_TOKEN_SIGNING_KEY') || !names.has('CBOT_CONTROL_SECRET')) process.exit(2);
          NODE
