name: Dispatch Production PR26

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-production-pr26.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-cloudflare-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=deploy-paid-access-code-dashboard
