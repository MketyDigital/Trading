name: Production Frontend E2E
# Release gate: exercise the deployed customer portal in a real browser after production deploys.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Production Cloudflare Deploy']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-frontend-e2e.yml'

permissions:
  contents: read

env:
  E2E_BASE_URL: https://trade.mkety.com

jobs:
  browser-e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      MKETY_TRADING_ADMIN_SECRET: ${{ secrets.MKETY_TRADING_ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create disposable production access code
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MKETY_TRADING_ADMIN_SECRET"
          email="frontend-e2e-${GITHUB_RUN_ID}@example.test"
          body="$(E2E_EMAIL="$email" node - <<'NODE'
          process.stdout.write(JSON.stringify({
            ownerEmail: process.env.E2E_EMAIL,
            ownerName: 'Frontend E2E',
            workspaceName: 'Frontend E2E Workspace',
            maxRedemptions: 1,
            entitlements: {
              customSubdomain: false,
              customHostname: false,
              tradingExecutionDestination: true,
              telegramDestination: true,
              sourceTypes: ['tradingview_webhook','custom_signed_api','external_mtproto'],
              destinations: ['audit_only','telegram','internal_webhook','broker_account']
            },
            metadata: { purpose: 'production-frontend-e2e', githubRunId: process.env.GITHUB_RUN_ID }
          }))
          NODE
          )"
          response="$(curl -fsS -X POST "$E2E_BASE_URL/api/v1/mkety-admin/access-codes" \
            -H "X-Mkety-Admin-Secret: $MKETY_TRADING_ADMIN_SECRET" \
            -H 'Content-Type: application/json' \
            --data "$body")"
          E2E_RESPONSE="$response" node - <<'NODE' >> "$GITHUB_ENV"
          const b = JSON.parse(process.env.E2E_RESPONSE || '{}');
          if (!b.ok || !b.accessCode?.plainCode || !b.accessCode?.workspaceId) throw new Error('fixture creation failed');
          console.log(`E2E_ACCESS_CODE=${b.accessCode.plainCode}`);
          console.log(`E2E_WORKSPACE_ID=${b.accessCode.workspaceId}`);
          NODE
          echo "E2E_EMAIL=$email" >> "$GITHUB_ENV"
          code="$(E2E_RESPONSE="$response" node -e "const b=JSON.parse(process.env.E2E_RESPONSE);process.stdout.write(b.accessCode.plainCode)")"
          echo "::add-mask::$code"
      - name: Exercise real customer frontend in Chromium
        shell: bash
        run: |
          mkdir -p frontend-e2e-artifacts
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
            const page = await context.newPage();
            const consoleErrors = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => consoleErrors.push(String(e)));

            await page.goto(process.env.E2E_BASE_URL + '/', { waitUntil: 'domcontentloaded' });
            assert.match(await page.title(), /Trading/i);
            await page.locator('#accessCode').waitFor({ state: 'visible' });
            assert.equal(await page.locator('#workspaceShell').isVisible(), false);
            assert.equal(await page.locator('#redeemBtn').isEnabled(), true);

            await page.locator('#accessCode').fill(process.env.E2E_ACCESS_CODE);
            await page.locator('#ownerEmail').fill(process.env.E2E_EMAIL);
            await page.locator('#ownerName').fill('Frontend E2E');
            await page.locator('#workspaceName').fill('Frontend E2E Workspace');
            await page.locator('#redeemBtn').click();
            await page.locator('#workspaceShell').waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('Workspace loaded successfully.').waitFor({ state: 'visible', timeout: 15000 });
            assert.equal(await page.locator('#authCard').isVisible(), false);
            assert.match(await page.locator('#workspaceTitle').innerText(), /Frontend E2E Workspace/);

            const runtimeSummary = await page.locator('#runtimeSummary').innerText();
            const launchStatus = await page.locator('#launchStatus').innerText();
            console.log('CUSTOMER_RUNTIME_SUMMARY=' + JSON.stringify(runtimeSummary));
            console.log('CUSTOMER_LAUNCH_STATUS=' + JSON.stringify(launchStatus));

            const visibleTabs = [
              ['Overview', '#view-overview'],
              ['Connections', '#view-connections'],
              ['Routing', '#view-routing'],
              ['AI', '#view-ai'],
              ['Branding', '#view-branding'],
              ['Operations', '#view-operations'],
              ['Team', '#view-team'],
            ];
            for (const [label, selector] of visibleTabs) {
              await page.getByRole('button', { name: label, exact: true }).click();
              assert.equal(await page.locator(selector).isVisible(), true, `${label} view must be visible`);
            }

            await page.getByRole('button', { name: 'Connections', exact: true }).click();
            await page.getByText('Signal sources', { exact: true }).waitFor({ state: 'visible' });
            await page.getByText('Broker connection', { exact: true }).waitFor({ state: 'visible' });
            assert.equal(await page.locator('#createSourceBtn').isVisible(), true);
            assert.equal(await page.locator('#createAccountBtn').isVisible(), true);

            await page.getByRole('button', { name: 'Routing', exact: true }).click();
            assert.equal(await page.locator('#destinationType option[value="telegram"]').isHidden(), false);
            assert.equal(await page.locator('#destinationType option[value="broker_account"]').isHidden(), false);
            await page.locator('#destinationType').selectOption('audit_only');
            await page.locator('#destinationName').fill('E2E Audit Destination');
            await page.locator('#createDestinationBtn').click();
            await page.getByText('E2E Audit Destination').waitFor({ state: 'visible', timeout: 15000 });

            await page.locator('#templateName').fill('E2E Clean Template');
            await page.locator('#formattingMode').selectOption('clean');
            await page.locator('#templateBrand').fill('E2E');
            await page.locator('#createTemplateBtn').click();
            await page.getByText('E2E Clean Template').waitFor({ state: 'visible', timeout: 15000 });

            await page.getByRole('button', { name: 'Branding', exact: true }).click();
            assert.equal(await page.locator('[data-entitlement="customHostname"]').isVisible(), false);
            assert.equal(await page.locator('#saveBrandingBtn').isVisible(), true);

            await page.getByRole('button', { name: 'Overview', exact: true }).click();
            await page.screenshot({ path: 'frontend-e2e-artifacts/customer-workspace-desktop.png', fullPage: true });

            await page.setViewportSize({ width: 390, height: 844 });
            await page.getByRole('button', { name: 'Connections', exact: true }).click();
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert.ok(overflow <= 1, `mobile page must not horizontally overflow; overflow=${overflow}`);
            await page.screenshot({ path: 'frontend-e2e-artifacts/customer-workspace-mobile.png', fullPage: true });

            await page.setViewportSize({ width: 1440, height: 1100 });
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.locator('#workspaceShell').waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('Workspace loaded successfully.').waitFor({ state: 'visible', timeout: 15000 });
            assert.equal(await page.locator('#authCard').isVisible(), false);
            console.log('RETURNING_SESSION_RESTORED=true');

            await page.locator('#logoutBtn').click();
            await page.locator('#accessCode').waitFor({ state: 'visible', timeout: 15000 });
            assert.equal(await page.locator('#workspaceShell').isVisible(), false);
            console.log('LOGOUT_CLEARED_SESSION=true');

            assert.deepEqual(consoleErrors, [], 'browser console/page errors: ' + consoleErrors.join(' | '));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload frontend display evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-frontend-display-${{ github.run_id }}
          path: frontend-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify staff API is not public
        run: |
          status="$(curl -sS -o /tmp/staff.json -w '%{http_code}' "$E2E_BASE_URL/api/v1/mkety-admin/access-codes")"
          test "$status" = "401"
      - name: Revoke disposable access code
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${E2E_ACCESS_CODE:-}" ] && [ -n "${E2E_WORKSPACE_ID:-}" ]; then
            list="$(curl -fsS "$E2E_BASE_URL/api/v1/mkety-admin/access-codes" -H "X-Mkety-Admin-Secret: $MKETY_TRADING_ADMIN_SECRET")" || exit 0
            id="$(E2E_LIST="$list" node -e "const b=JSON.parse(process.env.E2E_LIST); const x=(b.accessCodes||[]).find(x=>x.workspaceId===process.env.E2E_WORKSPACE_ID); if(x) process.stdout.write(x.id)")"
            if [ -n "$id" ]; then curl -fsS -X POST "$E2E_BASE_URL/api/v1/mkety-admin/access-codes/$id/revoke" -H "X-Mkety-Admin-Secret: $MKETY_TRADING_ADMIN_SECRET" >/dev/null; fi
          fi