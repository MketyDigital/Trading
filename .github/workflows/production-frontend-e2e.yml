name: Production Frontend E2E
# Release gate: read-only browser smoke against the deployed production portal.
# This workflow must never create, redeem, rotate, revoke, or purge production fixtures.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Production Cloudflare Deploy']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-frontend-e2e.yml'

permissions:
  contents: read

env:
  E2E_BASE_URL: https://trade.mkety.com

jobs:
  browser-e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise public production frontend read-only
        shell: bash
        run: |
          mkdir -p frontend-e2e-artifacts
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
            const page = await context.newPage();
            const consoleErrors = [];
            const httpErrors = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => consoleErrors.push(String(e)));
            page.on('response', response => {
              if (response.status() >= 400) httpErrors.push({ status: response.status(), url: response.url() });
            });

            await page.goto(process.env.E2E_BASE_URL + '/', { waitUntil: 'domcontentloaded' });
            assert.match(await page.title(), /Trading/i);
            await page.locator('#accessCode').waitFor({ state: 'visible' });
            assert.equal(await page.locator('#workspaceShell').isVisible(), false);
            assert.equal(await page.locator('#redeemBtn').isEnabled(), true);
            await page.screenshot({ path: 'frontend-e2e-artifacts/public-login-desktop.png', fullPage: true });

            await page.setViewportSize({ width: 390, height: 844 });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert.ok(overflow <= 1, `mobile page must not horizontally overflow; overflow=${overflow}`);
            await page.screenshot({ path: 'frontend-e2e-artifacts/public-login-mobile.png', fullPage: true });

            await page.setViewportSize({ width: 1440, height: 1100 });
            await page.goto(process.env.E2E_BASE_URL + '/mkety-admin/access-codes', { waitUntil: 'domcontentloaded' });
            assert.match(await page.title(), /Mkety Staff Trading Admin/i);
            await page.locator('#staffSecret').waitFor({ state: 'visible' });
            assert.equal(await page.locator('#createBtn').isVisible(), true);
            assert.match(await page.locator('body').innerText(), /Reissue\s*\/\s*Rotate access/i);
            await page.screenshot({ path: 'frontend-e2e-artifacts/staff-admin-readonly.png', fullPage: true });

            const unexpectedHttpErrors = httpErrors.filter(({ status, url }) =>
              !((status === 401 || status === 403) && url.includes('/api/'))
            );
            assert.deepEqual(unexpectedHttpErrors, [], 'unexpected HTTP errors: ' + JSON.stringify(unexpectedHttpErrors));
            const expectedAuthConsole = /Failed to load resource: the server responded with a status of (401|403)/;
            const unexpectedConsoleErrors = consoleErrors.filter(message => !expectedAuthConsole.test(message));
            assert.deepEqual(unexpectedConsoleErrors, [], 'browser console/page errors: ' + unexpectedConsoleErrors.join(' | '));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Verify production health read-only
        shell: bash
        run: |
          status="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$E2E_BASE_URL/api/v1/health")"
          test "$status" = "200"
          cat /tmp/health.json

      - name: Verify staff API is not public
        shell: bash
        run: |
          status="$(curl -sS -o /tmp/staff.json -w '%{http_code}' "$E2E_BASE_URL/api/v1/mkety-admin/access-codes")"
          test "$status" = "401"

      - name: Verify production E2E remains read-only
        shell: bash
        run: |
          if grep -Eq 'Create disposable production access code|/purge|curl .* -X POST|method:.*POST' .github/workflows/production-frontend-e2e.yml; then
            echo "Production frontend E2E contains a mutating production action."
            exit 1
          fi
          echo "Production frontend E2E is read-only."

      - name: Upload frontend display evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-frontend-display-${{ github.run_id }}
          path: frontend-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
