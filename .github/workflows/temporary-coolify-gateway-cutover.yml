name: Temporary Coolify Gateway Cutover

on:
  push:
    paths:
      - '.github/workflows/temporary-coolify-gateway-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PUBLIC_GATEWAY: cbot.mkety.com
    steps:
      - name: Require Coolify API credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COOLIFY_URL"
          test -n "$COOLIFY_TOKEN"
          echo "::add-mask::$COOLIFY_TOKEN"
          echo 'COOLIFY_API_CREDENTIALS=READY'

      - name: Discover exact gateway resource using safe metadata
        id: resource
        shell: bash
        run: |
          set -euo pipefail
          root="${COOLIFY_URL%/}"
          if [[ "$root" == */api/v1 ]]; then api="$root"; else api="$root/api/v1"; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"

          curl -fsS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$api/applications" > "$RUNNER_TEMP/apps.json"
          curl -fsS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$api/services" > "$RUNNER_TEMP/services.json"

          APPS="$RUNNER_TEMP/apps.json" SERVICES="$RUNNER_TEMP/services.json" node <<'NODE' > "$RUNNER_TEMP/candidate.env"
          const fs = require('fs');
          const apps = JSON.parse(fs.readFileSync(process.env.APPS, 'utf8') || '[]');
          const services = JSON.parse(fs.readFileSync(process.env.SERVICES, 'utf8') || '[]');
          const safe = [];
          const match = (parts) => {
            const s = parts.filter(Boolean).join(' ').toLowerCase();
            return s.includes('cbot.mkety.com') ||
              (s.includes('mkety') && (s.includes('cbot') || s.includes('gateway'))) ||
              (s.includes('mketydigital/trading') && s.includes('ctrader-cbot-gateway'));
          };
          for (const a of Array.isArray(apps) ? apps : []) {
            const parts = [a.name, a.description, a.fqdn, a.git_repository, a.git_full_url, a.base_directory, a.docker_compose_location];
            if (match(parts)) safe.push({ type: 'application', uuid: a.uuid, name: a.name || '', status: a.status || '', repo: a.git_repository || '', branch: a.git_branch || '', fqdn: a.fqdn || '', base: a.base_directory || '', compose: a.docker_compose_location || '' });
          }
          for (const s of Array.isArray(services) ? services : []) {
            const parts = [s.name, s.description, s.service_type];
            if (match(parts)) safe.push({ type: 'service', uuid: s.uuid, name: s.name || '', status: s.status || '', serviceType: s.service_type || '' });
          }
          console.error('SAFE_GATEWAY_CANDIDATES=' + JSON.stringify(safe));
          if (safe.length !== 1) {
            console.error(`Expected exactly one gateway resource, found ${safe.length}`);
            process.exit(2);
          }
          const c = safe[0];
          process.stdout.write(`resource_type=${c.type}\nresource_uuid=${c.uuid}\nresource_name=${String(c.name).replace(/\n/g,' ')}\n`);
          NODE

          cat "$RUNNER_TEMP/candidate.env" >> "$GITHUB_OUTPUT"
          sed -E 's/(resource_uuid=).+$/\1[resolved]/' "$RUNNER_TEMP/candidate.env"

      - name: Force deploy current main through Coolify API
        id: deploy
        shell: bash
        env:
          API: ${{ steps.resource.outputs.api }}
          RESOURCE_UUID: ${{ steps.resource.outputs.resource_uuid }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/deploy.json"
          code="$(curl -sS -o "$response" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$API/deploy?uuid=$RESOURCE_UUID&force=true")"
          test "$code" = "200"
          DEPLOY_RESPONSE="$response" node <<'NODE' > "$RUNNER_TEMP/deploy.env"
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.env.DEPLOY_RESPONSE,'utf8')||'{}');
          const d=Array.isArray(body.deployments) ? body.deployments[0] : body;
          if(!d?.deployment_uuid) throw new Error('Coolify did not return deployment_uuid');
          console.error(`COOLIFY_DEPLOY_QUEUED resource=${d.resource_uuid || 'unknown'} deployment=${d.deployment_uuid}`);
          process.stdout.write(`deployment_uuid=${d.deployment_uuid}\n`);
          NODE
          cat "$RUNNER_TEMP/deploy.env" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify deployment completion
        shell: bash
        env:
          API: ${{ steps.resource.outputs.api }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            curl -fsS --retry 2 --retry-all-errors \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H 'Accept: application/json' \
              "$API/deployments/$DEPLOYMENT_UUID" > "$RUNNER_TEMP/deployment.json"
            status="$(node -e "const b=require(process.argv[1]);process.stdout.write(String(b.status||''))" "$RUNNER_TEMP/deployment.json")"
            commit="$(node -e "const b=require(process.argv[1]);process.stdout.write(String(b.commit||''))" "$RUNNER_TEMP/deployment.json")"
            echo "COOLIFY_DEPLOY_STATUS attempt=$attempt status=${status:-unknown} commit=${commit:-unknown}"
            case "${status,,}" in
              finished|success|successful|completed)
                echo 'COOLIFY_DEPLOYMENT=SUCCESS'
                exit 0
                ;;
              failed|error|cancelled|canceled)
                echo 'COOLIFY_DEPLOYMENT=FAILED'
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'COOLIFY_DEPLOYMENT=TIMEOUT'
          exit 1

      - name: Verify public health is continuously reachable
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do
            body="$(curl -fsS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 20 "https://$PUBLIC_GATEWAY:25345/health")"
            BODY="$body" node -e "const b=JSON.parse(process.env.BODY); if(!b.ok) process.exit(1); console.log('HEALTH_OK service='+(b.service||'unknown'))"
            sleep 2
          done
          echo 'PUBLIC_GATEWAY_CONTINUOUS_HEALTH=PASS'

      - name: Verify cTrader and MT5 WebSocket routes reach their backends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wsprobe"
          cd "$RUNNER_TEMP/wsprobe"
          npm init -y >/dev/null 2>&1
          npm install --silent ws@8
          PUBLIC_GATEWAY="$PUBLIC_GATEWAY" node <<'NODE'
          const WebSocket = require('ws');
          const host = process.env.PUBLIC_GATEWAY;
          async function probe(path) {
            return await new Promise((resolve, reject) => {
              const ws = new WebSocket(`wss://${host}:25345${path}`);
              let opened = false;
              const timer = setTimeout(() => reject(new Error(`${path} timeout`)), 12000);
              ws.on('open', () => { opened = true; });
              ws.on('error', reject);
              ws.on('close', (code, reason) => {
                clearTimeout(timer);
                const why = String(reason || '');
                if (!opened) return reject(new Error(`${path} never upgraded; close=${code} ${why}`));
                if (code !== 1008 || why !== 'AUTH_REQUIRED') return reject(new Error(`${path} unexpected close=${code} ${why}`));
                console.log(`${path}=PASS close=${code} ${why}`);
                resolve();
              });
            });
          }
          (async()=>{ await probe('/v1/cbot'); await probe('/v1/mt5'); })().catch(e=>{ console.error(e); process.exit(1); });
          NODE

      - name: Verify deployed resource still targets Trading main
        shell: bash
        env:
          API: ${{ steps.resource.outputs.api }}
          RESOURCE_TYPE: ${{ steps.resource.outputs.resource_type }}
          RESOURCE_UUID: ${{ steps.resource.outputs.resource_uuid }}
        run: |
          set -euo pipefail
          if [[ "$RESOURCE_TYPE" = "application" ]]; then endpoint="$API/applications/$RESOURCE_UUID"; else endpoint="$API/services/$RESOURCE_UUID"; fi
          curl -fsS --retry 2 --retry-all-errors \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$endpoint" > "$RUNNER_TEMP/resource.json"
          RESOURCE_TYPE="$RESOURCE_TYPE" node <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/resource.json','utf8'));
          const safe={type:process.env.RESOURCE_TYPE,uuid:b.uuid,name:b.name,status:b.status,git_repository:b.git_repository,git_branch:b.git_branch,git_commit_sha:b.git_commit_sha,base_directory:b.base_directory,docker_compose_location:b.docker_compose_location};
          console.log('DEPLOYED_RESOURCE_SAFE_METADATA='+JSON.stringify(safe));
          if(process.env.RESOURCE_TYPE==='application') {
            const repo=String(b.git_repository||b.git_full_url||'').toLowerCase();
            if(repo && !repo.includes('mketydigital/trading')) throw new Error('gateway application points at unexpected repository');
            if(b.git_branch && b.git_branch!=='main') throw new Error('gateway application is not on main');
          }
          NODE
