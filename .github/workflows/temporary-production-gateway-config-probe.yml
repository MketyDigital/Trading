name: Temporary Production Gateway Config Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-production-gateway-config-probe.yml'

permissions:
  contents: read

env:
  BASE_URL: https://trade.mkety.com

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    env:
      MKETY_TRADING_ADMIN_SECRET: ${{ secrets.MKETY_TRADING_ADMIN_SECRET }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebSocket client
        run: npm install --no-save ws@8
      - name: Create disposable owner access code
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MKETY_TRADING_ADMIN_SECRET"
          email="gateway-config-probe-${GITHUB_RUN_ID}@example.test"
          payload="$(EMAIL="$email" node -e "process.stdout.write(JSON.stringify({ownerEmail:process.env.EMAIL,ownerName:'Gateway Config Probe',workspaceName:'Gateway Config Probe',maxRedemptions:1,entitlements:{tradingExecutionDestination:true,telegramDestination:true,sourceTypes:['external_mtproto'],destinations:['audit_only','broker_account']},metadata:{purpose:'gateway-config-probe',githubRunId:process.env.GITHUB_RUN_ID}}))")"
          response="$(curl -fsS -X POST "$BASE_URL/api/v1/mkety-admin/access-codes" -H "X-Mkety-Admin-Secret: $MKETY_TRADING_ADMIN_SECRET" -H 'Content-Type: application/json' --data "$payload")"
          RESPONSE="$response" EMAIL="$email" node <<'NODE' >> "$GITHUB_ENV"
          const b=JSON.parse(process.env.RESPONSE||'{}');
          if(!b.ok||!b.accessCode?.plainCode||!b.accessCode?.workspaceId) throw new Error('fixture creation failed');
          console.log(`PROBE_CODE=${b.accessCode.plainCode}`);
          console.log(`PROBE_WORKSPACE=${b.accessCode.workspaceId}`);
          console.log(`PROBE_EMAIL=${process.env.EMAIL}`);
          NODE
          code="$(RESPONSE="$response" node -e "const b=JSON.parse(process.env.RESPONSE);process.stdout.write(b.accessCode.plainCode)")"
          echo "::add-mask::$code"

      - name: Redeem disposable owner session
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e "process.stdout.write(JSON.stringify({code:process.env.PROBE_CODE,ownerEmail:process.env.PROBE_EMAIL,ownerName:'Gateway Config Probe',workspaceName:'Gateway Config Probe'}))")"
          response="$(curl -fsS -X POST "$BASE_URL/api/v1/access/redeem" -H 'Content-Type: application/json' --data "$payload")"
          RESPONSE="$response" node <<'NODE' >> "$GITHUB_ENV"
          const b=JSON.parse(process.env.RESPONSE||'{}');
          if(!b.ok||!b.bearer) throw new Error('redeem failed');
          console.log(`PROBE_BEARER=${b.bearer}`);
          NODE
          bearer="$(RESPONSE="$response" node -e "const b=JSON.parse(process.env.RESPONSE);process.stdout.write(b.bearer)")"
          echo "::add-mask::$bearer"

      - name: Prove Worker gateway secrets match live cTrader gateway
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const WebSocket = require('ws');
          const base = process.env.BASE_URL;
          const headers = {
            'Authorization': `Bearer ${process.env.PROBE_BEARER}`,
            'X-Mkety-Workspace-Id': process.env.PROBE_WORKSPACE,
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          };
          (async () => {
            const create = await fetch(`${base}/api/v1/admin/connections/ctrader/cbot`, {
              method: 'POST', headers,
              body: JSON.stringify({ label: 'Gateway Config Probe cTrader', environment: 'demo', roles: ['execution'] }),
            });
            const created = await create.json();
            if (create.status !== 201 || !created.ok || !created.account?.id || !created.oneTimeConnectionToken || !created.gatewayWebSocketUrl) {
              throw new Error(`cTrader pairing creation failed status=${create.status} reason=${created.reason || 'unknown'}`);
            }
            console.log(`::add-mask::${created.oneTimeConnectionToken}`);
            process.stdout.write(`PROBE_ACCOUNT=${created.account.id}\n`);

            const ws = new WebSocket(created.gatewayWebSocketUrl);
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error('cTrader gateway auth timeout')), 12000);
              ws.on('open', () => ws.send(JSON.stringify({
                type: 'auth',
                connectionToken: created.oneTimeConnectionToken,
                accountNumber: '99000001',
                brokerName: 'Mkety Gateway Probe',
                isLive: false,
                instanceId: `probe-${process.env.GITHUB_RUN_ID}`,
                symbols: [{ platformSymbol: 'XAUUSD', description: 'Probe Gold', minVolume: 0.01, maxVolume: 100, stepVolume: 0.01, tickSize: 0.01, digits: 2 }],
              })));
              ws.on('message', data => {
                const m = JSON.parse(String(data));
                if (m.type === 'auth_ok') { clearTimeout(timer); resolve(); }
              });
              ws.on('error', reject);
              ws.on('close', (code, reason) => {
                if (code !== 1000 && code !== 1005) reject(new Error(`cTrader gateway closed ${code} ${String(reason)}`));
              });
            });

            const sync = await fetch(`${base}/api/v1/admin/connections/ctrader/cbot/${encodeURIComponent(created.account.id)}/sync`, { method: 'POST', headers });
            const synced = await sync.json();
            if (!sync.ok || !synced.ok || synced.account?.accountId !== '99000001' || synced.account?.environment !== 'demo') {
              throw new Error(`cTrader sync failed status=${sync.status} reason=${synced.reason || 'unknown'}`);
            }
            if (synced.account.active !== false || synced.account.executionEnabled !== false || synced.account.killSwitch !== true) {
              throw new Error('cTrader probe account safety state changed unexpectedly');
            }
            console.log('CTRADER_GATEWAY_AUTH_AND_CONTROL_MATCH=true');

            ws.close(1000, 'PROBE_COMPLETE');
            const del = await fetch(`${base}/api/v1/admin/connections/accounts/${encodeURIComponent(created.account.id)}`, { method: 'DELETE', headers });
            const deleted = await del.json();
            if (!del.ok || !deleted.ok) throw new Error(`account cleanup failed status=${del.status} reason=${deleted.reason || 'unknown'}`);
            console.log('PROBE_ACCOUNT_CLEANED=true');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Revoke disposable access code
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          [ -n "${PROBE_WORKSPACE:-}" ] || exit 0
          list="$(curl -fsS "$BASE_URL/api/v1/mkety-admin/access-codes" -H "X-Mkety-Admin-Secret: $MKETY_TRADING_ADMIN_SECRET")" || exit 0
          id="$(LIST="$list" node -e "const b=JSON.parse(process.env.LIST||'{}');const x=(b.accessCodes||[]).find(x=>x.workspaceId===process.env.PROBE_WORKSPACE);if(x)process.stdout.write(x.id)")"
          [ -n "$id" ] && curl -fsS -X POST "$BASE_URL/api/v1/mkety-admin/access-codes/$id/revoke" -H "X-Mkety-Admin-Secret: $MKETY_TRADING_ADMIN_SECRET" >/dev/null
