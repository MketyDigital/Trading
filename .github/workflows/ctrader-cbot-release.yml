name: cTrader cBot Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ctrader-cbot-release.yml'
      - 'ctrader-cbot/**'
    tags:
      - 'ctrader-cbot-v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore cTrader Automate SDK
        run: dotnet restore ctrader-cbot/MketyCloudAutoTrader/MketyCloudAutoTrader.csproj
      - name: Build distributable cBot
        run: dotnet build ctrader-cbot/MketyCloudAutoTrader/MketyCloudAutoTrader.csproj --configuration Release --no-restore -p:AlgoPublish=false -p:IncludeSource=false -p:IncludeSymbols=false
      - name: Collect package and checksum
        shell: bash
        run: |
          set -euo pipefail
          algo="$(find ctrader-cbot/MketyCloudAutoTrader -type f -name '*.algo' -print -quit)"
          test -n "$algo" || { echo 'cTrader build did not produce an .algo package'; exit 1; }
          mkdir -p dist
          cp "$algo" dist/MketyCloudAutoTrader.algo
          sha256sum dist/MketyCloudAutoTrader.algo > dist/MketyCloudAutoTrader.algo.sha256
          test -s dist/MketyCloudAutoTrader.algo
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MketyCloudAutoTrader
          path: |
            dist/MketyCloudAutoTrader.algo
            dist/MketyCloudAutoTrader.algo.sha256
          if-no-files-found: error
      - name: Publish stable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/ctrader-cbot-v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="ctrader-cbot-v1.0.0"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/MketyCloudAutoTrader.algo dist/MketyCloudAutoTrader.algo.sha256 --clobber
          else
            gh release create "$tag" \
              dist/MketyCloudAutoTrader.algo \
              dist/MketyCloudAutoTrader.algo.sha256 \
              --target main \
              --title "Mkety Cloud Auto Trader ${tag#ctrader-cbot-v}" \
              --generate-notes
          fi
