name: Verify Production Custom Hostname Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-custom-hostname-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify copier.starpipsforex.com reaches Mkety hostname resolver
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/custom-host-response.json"
          status="$(curl -sS -o "$body" -w '%{http_code}' \
            -H 'X-Mkety-Workspace-Id: 5f63234c-20e9-426c-995f-56d129f51ece' \
            https://copier.starpipsforex.com/api/v1/admin/workspace)"
          echo "CUSTOM_HOST_HTTP_STATUS=$status"
          cat "$body"
          test "$status" = "401"
