name: Diagnose cBot Host Port

on:
  push:
    branches: ['diag/coolify-cbot-runtime']
    paths: ['.github/workflows/diag-cbot-host-port.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Discover application and inspect runtime
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}"; case "$base" in */api/v1) api="$base";; *) api="$base/api/v1";; esac
          echo "COOLIFY_API=$api" >> "$GITHUB_ENV"
          curl -fsS "$api/applications" -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json' > /tmp/apps.json
          python - <<'PY'
          import json, os
          apps=json.load(open('/tmp/apps.json'))
          m=[a for a in apps if str(a.get('git_repository') or '').lower()=='mketydigital/trading' and ('ctrader-cbot-gateway/deploy/coolify/docker-compose.yml' in str(a.get('docker_compose_location') or '').lower() or ('cbot' in str(a.get('name') or '').lower() and 'gateway' in str(a.get('name') or '').lower()))]
          if len(m)!=1: raise SystemExit(f'expected 1 cBot app, found {len(m)}')
          a=m[0]
          print('app', a.get('name'), 'uuid', a.get('uuid'), 'status', a.get('status'))
          print('compose_location', a.get('docker_compose_location'))
          print('ports_exposes', a.get('ports_exposes'))
          print('ports_mappings', a.get('ports_mappings'))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('COOLIFY_APP_UUID='+a['uuid']+'\n')
          PY
          curl -fsS "$api/applications/$COOLIFY_APP_UUID" -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json' > /tmp/app.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/app.json'))
          for k in ['status','docker_compose_location','docker_compose_raw','docker_compose','ports_exposes','ports_mappings','fqdn']:
              v=a.get(k)
              if v is not None:
                  s=str(v)
                  print(k, s[:8000])
          PY

      - name: Inspect service logs and external port
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/coollabsio/coolify-cli/coolify@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          coolify context add -d diag "$COOLIFY_URL" "$COOLIFY_TOKEN" >/dev/null
          echo '===== CADDY ====='
          coolify app logs "$COOLIFY_APP_UUID" --service caddy -n 160 --show-timestamps 2>&1 | sed -E 's/(token|secret|password|api[_-]?key)([=:][^ ,;]+)/\1=[REDACTED]/Ig' | tail -160 || true
          echo '===== GATEWAY ====='
          coolify app logs "$COOLIFY_APP_UUID" --service gateway -n 120 --show-timestamps 2>&1 | sed -E 's/(token|secret|password|api[_-]?key)([=:][^ ,;]+)/\1=[REDACTED]/Ig' | tail -120 || true
          echo '===== EXTERNAL ====='
          getent ahostsv4 cbot.mkety.com | head || true
          timeout 5 bash -c '</dev/tcp/20.57.161.98/25345' && echo 'TCP_25345=OPEN' || echo 'TCP_25345=NOT_OPEN'
          curl -vk --connect-timeout 5 --resolve cbot.mkety.com:25345:20.57.161.98 https://cbot.mkety.com:25345/health -o /tmp/body 2>/tmp/curl.err || true
          tail -60 /tmp/curl.err | sed -E 's/(token|secret|password|api[_-]?key)([=:][^ ,;]+)/\1=[REDACTED]/Ig'
          test -f /tmp/body && cat /tmp/body || true
