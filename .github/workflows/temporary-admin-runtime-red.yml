name: Temporary Admin Runtime Red

on:
  push:
    branches:
      - fix/admin-runtime-authority

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare-v2
        run: npm install --no-audit --no-fund
      - name: Run DB-backed runtime authority tests
        run: node --test cloudflare-v2/tests/admin_runtime_authority.test.mjs
