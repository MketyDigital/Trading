name: Ops Production MT5 Sync

on:
  push:
    branches:
      - ops/production-mt5-sync-20260913
    paths:
      - '.github/workflows/ops-production-mt5-sync.yml'

permissions:
  contents: read

env:
  BASE_URL: https://trade.mkety.com
  WORKSPACE_ID: 5f63234c-20e9-426c-995f-56d129f51ece
  MT5_ACCOUNT_IDS: b72f931c-9387-4976-bfa2-d56c26c3ce1b 9091be87-b1e2-4d1a-bb7f-d2669679b184

jobs:
  sync-existing-mt5-connectors:
    runs-on: ubuntu-latest
    environment: staging
    env:
      TRADING_ACCESS_CODE_SESSION_SECRET: ${{ secrets.TRADING_ACCESS_CODE_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require production session signing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TRADING_ACCESS_CODE_SESSION_SECRET:-}" || { echo 'TRADING_ACCESS_CODE_SESSION_SECRET is not configured'; exit 1; }

      - name: Mint temporary owner bearer for existing Trading workspace
        shell: bash
        run: |
          set -euo pipefail
          bearer="$(cd cloudflare-v2 && node --input-type=module <<'NODE'
          import { createLocalTradingBearer } from './src/access/trading_access_codes.js';
          const token = await createLocalTradingBearer({
            workspaceId: process.env.WORKSPACE_ID,
            subject: 'ops:production-mt5-sync',
            role: 'owner',
          }, process.env.TRADING_ACCESS_CODE_SESSION_SECRET);
          process.stdout.write(token);
          NODE
          )"
          test -n "$bearer"
          echo "::add-mask::$bearer"
          echo "OPS_BEARER=$bearer" >> "$GITHUB_ENV"

      - name: Sync both existing pending MT5 connector rows
        shell: bash
        run: |
          set -euo pipefail
          successes=0
          for id in $MT5_ACCOUNT_IDS; do
            response_file="$(mktemp)"
            status="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST \
              "$BASE_URL/api/v1/admin/connections/mt5/connector/$id/sync" \
              -H "Authorization: Bearer $OPS_BEARER" \
              -H "X-Mkety-Workspace-Id: $WORKSPACE_ID" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data '{}')"
            ID="$id" STATUS="$status" RESPONSE_FILE="$response_file" node <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE, 'utf8') || '{}');
          const account = body.account || {};
          console.log(JSON.stringify({
            id: process.env.ID,
            httpStatus: Number(process.env.STATUS),
            ok: body.ok === true,
            reason: body.reason || null,
            accountId: account.accountId || null,
            serverName: account.serverName || null,
            environment: account.environment || null,
            providerMode: account.providerMode || null,
          }));
          NODE
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then successes=$((successes+1)); fi
            rm -f "$response_file"
          done
          test "$successes" -ge 1 || { echo 'No pending MT5 connector is online/syncable yet.'; exit 2; }

      - name: Verify connected account appears through production API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/api/v1/admin/connections/accounts" \
            -H "Authorization: Bearer $OPS_BEARER" \
            -H "X-Mkety-Workspace-Id: $WORKSPACE_ID" \
            -H 'Accept: application/json' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s);const xs=(b.accounts||[]).filter(x=>x.providerMode==='mt5_connector');console.log(JSON.stringify(xs.map(x=>({id:x.id,accountId:x.accountId,serverName:x.serverName,environment:x.environment,active:x.active,executionEnabled:x.executionEnabled,providerMode:x.providerMode})),null,2));if(!xs.some(x=>x.accountId&&!String(x.accountId).startsWith('pending:')))process.exit(3)})"
