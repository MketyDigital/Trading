name: Ops Production MT5 Sync

on:
  push:
    branches:
      - ops/production-mt5-sync-20260913
    paths:
      - '.github/workflows/ops-production-mt5-sync.yml'

permissions:
  contents: read

env:
  WORKSPACE_ID: 5f63234c-20e9-426c-995f-56d129f51ece
  MT5_ACCOUNT_IDS: b72f931c-9387-4976-bfa2-d56c26c3ce1b 9091be87-b1e2-4d1a-bb7f-d2669679b184

jobs:
  sync-existing-mt5-connectors:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TRADING_MASTER_KEY: ${{ secrets.TRADING_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: cloudflare-v2
        run: npm install --no-audit --no-fund

      - name: Require protected backend credentials by name only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo 'SUPABASE_URL is not configured'; exit 1; }
          service_role="${SUPABASE_SERVICE_ROLE:-${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_KEY:-}}}"
          test -n "$service_role" || { echo 'Supabase service role is not configured'; exit 1; }
          test -n "${TRADING_MASTER_KEY:-}" || { echo 'TRADING_MASTER_KEY is not configured'; exit 1; }
          echo "::add-mask::$service_role"
          echo "SUPABASE_SERVICE_ROLE=$service_role" >> "$GITHUB_ENV"

      - name: Run the production MT5 sync handler for both existing pending rows
        working-directory: cloudflare-v2
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { handleV1AdminMt5ConnectorRequest } from './src/http/v1_admin_mt5_connector.js';

          const workspaceId = process.env.WORKSPACE_ID;
          const ids = String(process.env.MT5_ACCOUNT_IDS || '').split(/\s+/).filter(Boolean);
          let success = 0;
          const results = [];
          const authorizeFn = async () => ({
            ok: true,
            workspace: { id: workspaceId },
            membership: { role: 'owner' },
          });

          for (const id of ids) {
            const request = new Request(`https://trade.mkety.com/api/v1/admin/connections/mt5/connector/${encodeURIComponent(id)}/sync`, {
              method: 'POST',
              headers: { 'X-Mkety-Workspace-Id': workspaceId },
            });
            const response = await handleV1AdminMt5ConnectorRequest(request, process.env, { authorizeFn });
            const body = await response.json().catch(() => ({}));
            const account = body.account || {};
            results.push({
              id,
              status: response.status,
              ok: body.ok === true,
              reason: body.reason || null,
              accountId: account.accountId || null,
              serverName: account.serverName || null,
              environment: account.environment || null,
              providerMode: account.providerMode || null,
            });
            if (response.ok && body.ok === true) success += 1;
          }
          console.log(JSON.stringify(results, null, 2));
          if (success < 1) {
            console.error('No pending MT5 connector is online/syncable yet.');
            process.exit(2);
          }
          NODE
