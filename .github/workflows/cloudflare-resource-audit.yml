name: Trading Cloudflare Resource Audit

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: Usage window for Cloudflare analytics
        required: true
        default: "7"
        type: choice
        options:
          - "7"
          - "31"

permissions:
  contents: read

concurrency:
  group: trading-cloudflare-resource-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUDIT_WINDOW_DAYS: ${{ inputs.window_days }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Run read-only Cloudflare resource and usage audit
        env:
          REPORT_DIR: ${{ runner.temp }}/cloudflare-resource-audit
        run: node cloudflare-v2/scripts/cloudflare_resource_audit.mjs

      - name: Add run summary
        if: always()
        run: |
          {
            echo '## Trading Cloudflare Resource Audit'
            echo
            echo "Window: ${AUDIT_WINDOW_DAYS} days"
            echo 'Scope: read-only Cloudflare resource inventory and aggregate usage metrics.'
            echo 'The JSON artifact contains D1, Worker, Queue, Durable Object, and Container results, including per-endpoint availability status.'
            echo 'No D1 SQL statements were executed. D1 query signatures in analytics output have literals redacted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-cloudflare-resource-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-resource-audit/cloudflare-resource-audit.json
          if-no-files-found: ignore
          retention-days: 14
