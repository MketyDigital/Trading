name: Temporary Gateway Bootstrap Red

on:
  push:
    branches:
      - fix/gateway-bootstrap-mt5

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gateway deployment contract
        run: node --test cloudflare-v2/tests/ctrader_cbot_deployment_workflow.test.mjs
