name: Production Cloudflare Deploy
# Production deployment: unified enterprise Trading + safe Cloudflare for SaaS white-label.
# Broker execution uses two gates: deployment capability + persisted Mkety owner switch.
# Release trigger: PR #24 full production reliability audit.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Production action to run
        required: true
        type: choice
        default: deploy-paid-access-code-dashboard
        options:
          - deploy-paid-access-code-dashboard
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-trading-production
  cancel-in-progress: false

jobs:
  deploy-paid-access-code-dashboard:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.event.head_commit.message == 'cloudflare: deploy production access-code dashboard'
        )
      }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
      PRODUCTION_SUPABASE_URL_VAR: ${{ vars.SUPABASE_URL }}
      PRODUCTION_SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PRODUCTION_TRADING_MASTER_KEY: ${{ secrets.TRADING_MASTER_KEY }}
      PRODUCTION_TRADING_ACCESS_CODE_SESSION_SECRET: ${{ secrets.TRADING_ACCESS_CODE_SESSION_SECRET }}
      PRODUCTION_MKETY_TRADING_ADMIN_SECRET: ${{ secrets.MKETY_TRADING_ADMIN_SECRET }}
      PRODUCTION_HEALTH_URL: ${{ vars.TRADING_PRODUCTION_HEALTH_URL }}
      TRADING_SAAS_ZONE: mkety.com
      TRADING_SAAS_FALLBACK_ORIGIN: saas-origin.mkety.com
      TRADING_CUSTOM_HOSTNAME_CNAME_TARGET: trading-customers.mkety.com
      TRADING_WORKER_SCRIPT_NAME: mkety-copier-engine

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refuse non-main production deploy
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "main" || {
            echo "Production deploy may run only from main."
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Require production credentials by name only
        shell: bash
        run: |
          missing=0
          require_any() {
            local label="$1"
            shift
            local present=0
            for value in "$@"; do
              if [ -n "$value" ]; then present=1; fi
            done
            if [ "$present" -ne 1 ]; then
              echo "Missing production configuration: $label"
              missing=1
            fi
          }
          require_any CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          require_any CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          require_any SUPABASE_URL "$PRODUCTION_SUPABASE_URL_SECRET" "$PRODUCTION_SUPABASE_URL_VAR"
          require_any SUPABASE_SERVICE_ROLE "$PRODUCTION_SUPABASE_SERVICE_ROLE" "$PRODUCTION_SUPABASE_SERVICE_ROLE_KEY" "$PRODUCTION_SUPABASE_SERVICE_KEY"
          require_any TRADING_MASTER_KEY "$PRODUCTION_TRADING_MASTER_KEY"
          require_any MKETY_TRADING_ADMIN_SECRET "$PRODUCTION_MKETY_TRADING_ADMIN_SECRET"
          if [ -z "${PRODUCTION_TRADING_ACCESS_CODE_SESSION_SECRET:-}" ]; then
            derived_session_secret="$(node <<'NODE'
          const crypto = require('node:crypto');
          const master = process.env.PRODUCTION_TRADING_MASTER_KEY;
          if (!master) process.exit(1);
          process.stdout.write(crypto.createHmac('sha256', master).update('mkety-trading-access-code-session-v1').digest('base64url'));
          NODE
          )"
            echo "::add-mask::$derived_session_secret"
            echo "PRODUCTION_TRADING_ACCESS_CODE_SESSION_SECRET=$derived_session_secret" >> "$GITHUB_ENV"
            echo "TRADING_ACCESS_CODE_SESSION_SECRET was not configured; using deterministic key-separated session signing derived from TRADING_MASTER_KEY."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Configure Cloudflare for SaaS white-label foundation
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_response="$(curl -fsS "${auth[@]}" "$api/zones?name=$TRADING_SAAS_ZONE&status=active")"
          zone_id="$(ZONE_RESPONSE="$zone_response" node <<'NODE'
          const body = JSON.parse(process.env.ZONE_RESPONSE || '{}');
          const row = Array.isArray(body.result) ? body.result.find(x => x && x.name === process.env.TRADING_SAAS_ZONE) : null;
          if (!body.success || !row?.id) process.exit(1);
          process.stdout.write(String(row.id));
          NODE
          )"
          echo "CLOUDFLARE_ZONE_ID=$zone_id" >> "$GITHUB_ENV"

          ensure_dns() {
            local type="$1" name="$2" content="$3"
            local response count existing_content existing_proxied payload
            response="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?type=$type&name=$name")"
            count="$(DNS_RESPONSE="$response" node -e "const b=JSON.parse(process.env.DNS_RESPONSE);process.stdout.write(String((b.result||[]).length))")"
            if [ "$count" = "0" ]; then
              payload="$(TYPE="$type" NAME="$name" CONTENT="$content" node -e "process.stdout.write(JSON.stringify({type:process.env.TYPE,name:process.env.NAME,content:process.env.CONTENT,proxied:true,ttl:1}))")"
              curl -fsS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$payload" >/dev/null
              echo "Created managed DNS record: $name"
              return
            fi
            existing_content="$(DNS_RESPONSE="$response" node -e "const r=JSON.parse(process.env.DNS_RESPONSE).result[0];process.stdout.write(String(r.content||''))")"
            existing_proxied="$(DNS_RESPONSE="$response" node -e "const r=JSON.parse(process.env.DNS_RESPONSE).result[0];process.stdout.write(String(Boolean(r.proxied)))")"
            if [ "${existing_content,,}" != "${content,,}" ] || [ "$existing_proxied" != "true" ]; then
              echo "Refusing to overwrite conflicting Cloudflare DNS record $name (expected $type -> $content, proxied)." >&2
              exit 1
            fi
            echo "Managed DNS record already correct: $name"
          }

          ensure_dns AAAA "$TRADING_SAAS_FALLBACK_ORIGIN" "100::"
          ensure_dns CNAME "$TRADING_CUSTOM_HOSTNAME_CNAME_TARGET" "$TRADING_SAAS_FALLBACK_ORIGIN"

          fallback_payload="$(node -e "process.stdout.write(JSON.stringify({origin:process.env.TRADING_SAAS_FALLBACK_ORIGIN}))")"
          curl -fsS "${auth[@]}" -X PUT "$api/zones/$zone_id/custom_hostnames/fallback_origin" --data "$fallback_payload" >/dev/null

          fallback_status=""
          for attempt in $(seq 1 15); do
            response="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/custom_hostnames/fallback_origin")"
            fallback_status="$(CF_RESPONSE="$response" node -e "const b=JSON.parse(process.env.CF_RESPONSE);process.stdout.write(String(b.result?.status||''))")"
            [ "$fallback_status" = "active" ] && break
            sleep 2
          done
          if [ "$fallback_status" != "active" ]; then
            echo "Cloudflare for SaaS fallback origin did not become active (status=$fallback_status). Ensure token has Zone Read, DNS Edit, SSL and Certificates Edit, and Workers Routes Edit permissions." >&2
            exit 1
          fi
          echo "Cloudflare for SaaS fallback is active."

      - name: Build temporary production Wrangler config with dual-gate broker safety
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('wrangler.toml', 'utf8');
          const replacements = {
            TRADINGVIEW_DIRECT_INGRESS_ENABLED: 'false',
            TRADINGVIEW_CERT_PROBE_ENABLED: 'false',
            TRADING_ACCESS_ENABLED: 'true',
            BROKER_EXECUTION_ENABLED: 'true',
            TRADING_CUSTOM_HOSTNAMES_ENABLED: 'true',
          };
          let output = source;
          for (const [key, value] of Object.entries(replacements)) {
            const pattern = new RegExp(`^${key} = ".*"$`, 'm');
            if (!pattern.test(output)) throw new Error(`Missing expected Wrangler var: ${key}`);
            output = output.replace(pattern, `${key} = "${value}"`);
          }
          const extra = {
            TRADING_ACCESS_CODE_REDEMPTION_ENABLED: 'true',
            TRADING_ACCESS_CODE_SESSION_ENABLED: 'true',
            CLOUDFLARE_ZONE_ID: process.env.CLOUDFLARE_ZONE_ID,
            TRADING_CUSTOM_HOSTNAME_CNAME_TARGET: process.env.TRADING_CUSTOM_HOSTNAME_CNAME_TARGET,
            TRADING_WORKER_SCRIPT_NAME: process.env.TRADING_WORKER_SCRIPT_NAME,
            TRADING_CANONICAL_HOSTS: 'trade.mkety.com',
          };
          for (const [key, value] of Object.entries(extra)) {
            const line = `${key} = ${JSON.stringify(String(value))}`;
            const pattern = new RegExp(`^${key} = ".*"$`, 'm');
            output = pattern.test(output) ? output.replace(pattern, line) : output.replace('[vars]\n', `[vars]\n${line}\n`);
          }
          fs.writeFileSync('wrangler.production.generated.toml', output, { mode: 0o600 });
          NODE
          grep -Eq '^TRADING_ACCESS_ENABLED = "true"$' wrangler.production.generated.toml
          grep -Eq '^TRADING_ACCESS_CODE_REDEMPTION_ENABLED = "true"$' wrangler.production.generated.toml
          grep -Eq '^TRADING_ACCESS_CODE_SESSION_ENABLED = "true"$' wrangler.production.generated.toml
          grep -Eq '^BROKER_EXECUTION_ENABLED = "true"$' wrangler.production.generated.toml
          grep -Eq '^TRADING_CUSTOM_HOSTNAMES_ENABLED = "true"$' wrangler.production.generated.toml

      - name: Build temporary production secrets file
        shell: bash
        run: |
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const supabaseUrl = process.env.PRODUCTION_SUPABASE_URL_SECRET || process.env.PRODUCTION_SUPABASE_URL_VAR;
          const serviceRole = process.env.PRODUCTION_SUPABASE_SERVICE_ROLE || process.env.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY || process.env.PRODUCTION_SUPABASE_SERVICE_KEY;
          const payload = {
            SUPABASE_URL: supabaseUrl,
            SUPABASE_SERVICE_ROLE: serviceRole,
            TRADING_MASTER_KEY: process.env.PRODUCTION_TRADING_MASTER_KEY,
            TRADING_ACCESS_CODE_SESSION_SECRET: process.env.PRODUCTION_TRADING_ACCESS_CODE_SESSION_SECRET,
            MKETY_TRADING_ADMIN_SECRET: process.env.PRODUCTION_MKETY_TRADING_ADMIN_SECRET,
            CLOUDFLARE_API_TOKEN: process.env.CLOUDFLARE_API_TOKEN,
          };
          for (const [key, value] of Object.entries(payload)) if (!value) throw new Error(`Missing required secret payload value: ${key}`);
          const target = path.join(process.env.RUNNER_TEMP, 'mkety-trading-production-secrets.json');
          fs.writeFileSync(target, JSON.stringify(payload), { mode: 0o600 });
          NODE

      - name: Final production dry-run
        run: npx wrangler deploy --dry-run --config wrangler.production.generated.toml

      - name: Deploy production Trading Worker with persisted owner broker switch
        run: npx wrangler deploy --config wrangler.production.generated.toml --secrets-file "$RUNNER_TEMP/mkety-trading-production-secrets.json"

      - name: Probe production health
        shell: bash
        run: |
          health_url="${PRODUCTION_HEALTH_URL:-https://trade.mkety.com/api/v1/health}"
          body_file="$RUNNER_TEMP/production-health-body.json"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' "$health_url")"
          if [ "$status" != "200" ]; then cat "$body_file" >&2; exit 1; fi
          cat "$body_file"

      - name: Verify persisted owner broker switch remains OFF for acceptance
        shell: bash
        run: |
          body_file="$RUNNER_TEMP/runtime-control-body.json"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' -H "X-Mkety-Admin-Secret: $PRODUCTION_MKETY_TRADING_ADMIN_SECRET" https://trade.mkety.com/api/v1/mkety-admin/runtime-controls)"
          if [ "$status" != "200" ]; then cat "$body_file" >&2; exit 1; fi
          RUNTIME_BODY="$(cat "$body_file")" node <<'NODE'
          const body = JSON.parse(process.env.RUNTIME_BODY || '{}');
          if (!body.ok) throw new Error('runtime controls unavailable');
          if (body.brokerExecutionCapabilityEnabled !== true) throw new Error('deployment broker capability not enabled');
          if (body.brokerExecutionEnabled !== false) throw new Error('owner broker switch must remain OFF during acceptance');
          if (body.effectiveBrokerExecutionEnabled !== false) throw new Error('effective broker execution must remain blocked during acceptance');
          NODE
          cat "$body_file"

      - name: Remove temporary production secrets file
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/mkety-trading-production-secrets.json"

      - name: Record production safety posture
        shell: bash
        run: |
          echo "Production deploy completed from main."
          echo "Trading access: enabled"
          echo "Access-code redemption/session: enabled"
          echo "Mkety Trading admin secret: configured"
          echo "Cloudflare for SaaS custom hostnames: enabled"
          echo "White-label CNAME target: $TRADING_CUSTOM_HOSTNAME_CNAME_TARGET"
          echo "TradingView direct ingress: disabled"
          echo "Broker deployment capability: enabled"
          echo "Broker owner master switch: OFF"
          echo "Effective broker execution: blocked"
