name: Production Cloudflare Deploy
# Production deployment: unified enterprise Trading + safe Cloudflare for SaaS white-label.
# Broker execution uses two gates: deployment capability + persisted Mkety owner switch.
# Deployment reads and verifies the persisted owner choice but never changes it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Production action to run
        required: true
        type: choice
        default: deploy-paid-access-code-dashboard
        options:
          - deploy-paid-access-code-dashboard
  push:
    branches:
      - main
    paths:
      - 'cloudflare-v2/**'
      - 'ctrader-cbot-gateway/**'
      - 'ctrader-cbot/**'
      - '.github/workflows/production-cloudflare-deploy.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-trading-production
  cancel-in-progress: false

jobs:
  deploy-paid-access-code-dashboard:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_TRADING_MASTER_KEY: ${{ secrets.TRADING_MASTER_KEY }}
      PRODUCTION_TRADING_ACCESS_CODE_SESSION_SECRET: ${{ secrets.TRADING_ACCESS_CODE_SESSION_SECRET }}
      PRODUCTION_MKETY_TRADING_ADMIN_SECRET: ${{ secrets.MKETY_TRADING_ADMIN_SECRET }}
      PRODUCTION_CTRADER_CBOT_GATEWAY_URL: ${{ vars.CTRADER_CBOT_GATEWAY_URL }}
      PRODUCTION_CTRADER_CBOT_WS_URL: ${{ vars.CTRADER_CBOT_WS_URL }}
      PRODUCTION_CBOT_TOKEN_SIGNING_KEY: ${{ secrets.CBOT_TOKEN_SIGNING_KEY }}
      PRODUCTION_CBOT_CONTROL_SECRET: ${{ secrets.CBOT_CONTROL_SECRET }}
      PRODUCTION_HEALTH_URL: ${{ vars.TRADING_PRODUCTION_HEALTH_URL }}
      TRADING_SAAS_ZONE: mkety.com
      TRADING_SAAS_FALLBACK_ORIGIN: saas-origin.mkety.com
      TRADING_CUSTOM_HOSTNAME_CNAME_TARGET: trading-customers.mkety.com
      TRADING_WORKER_SCRIPT_NAME: mkety-copier-engine

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refuse non-main production deploy
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "main" || {
            echo "Production deploy may run only from main."
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Require production credentials by name only
        shell: bash
        run: |
          missing=0
          require_any() {
            local label="$1"
            shift
            local present=0
            for value in "$@"; do
              if [ -n "$value" ]; then present=1; fi
            done
            if [ "$present" -ne 1 ]; then
              echo "Missing production configuration: $label"
              missing=1
            fi
          }
          require_any CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          require_any CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          require_any TRADING_MASTER_KEY "$PRODUCTION_TRADING_MASTER_KEY"
          require_any MKETY_TRADING_ADMIN_SECRET "$PRODUCTION_MKETY_TRADING_ADMIN_SECRET"

          cbot_present=0
          for value in "$PRODUCTION_CTRADER_CBOT_GATEWAY_URL" "$PRODUCTION_CTRADER_CBOT_WS_URL" "$PRODUCTION_CBOT_TOKEN_SIGNING_KEY" "$PRODUCTION_CBOT_CONTROL_SECRET"; do
            if [ -n "$value" ]; then cbot_present=$((cbot_present + 1)); fi
          done
          if [ "$cbot_present" -ne 0 ] && [ "$cbot_present" -ne 4 ]; then
            echo "Shared trading gateway production configuration is partial; configure both URLs and both secrets together."
            missing=1
          fi
          if [ "$cbot_present" -eq 4 ]; then
            CBOT_GATEWAY_URL="$PRODUCTION_CTRADER_CBOT_GATEWAY_URL" CBOT_WS_URL="$PRODUCTION_CTRADER_CBOT_WS_URL" node <<'NODE'
          const gateway = new URL(process.env.CBOT_GATEWAY_URL);
          const ws = new URL(process.env.CBOT_WS_URL);
          if (gateway.protocol !== 'https:' || gateway.username || gateway.password || gateway.search || gateway.hash) {
            throw new Error('CTRADER_CBOT_GATEWAY_URL must be a clean https URL');
          }
          if (ws.protocol !== 'wss:' || ws.port !== '25345' || ws.username || ws.password || ws.search || ws.hash || ws.pathname !== '/v1/cbot') {
            throw new Error('CTRADER_CBOT_WS_URL must be wss://<host>:25345/v1/cbot');
          }
          NODE
            echo "Shared cTrader/MT5 gateway production configuration is complete."
          else
            echo "Shared trading gateway is not configured; cBot/MT5 connector onboarding remains fail-closed."
          fi

          if [ -z "${PRODUCTION_TRADING_ACCESS_CODE_SESSION_SECRET:-}" ]; then
            derived_session_secret="$(node <<'NODE'
          const crypto = require('node:crypto');
          const master = process.env.PRODUCTION_TRADING_MASTER_KEY;
          if (!master) process.exit(1);
          process.stdout.write(crypto.createHmac('sha256', master).update('mkety-trading-access-code-session-v1').digest('base64url'));
          NODE
          )"
            echo "::add-mask::$derived_session_secret"
            echo "PRODUCTION_TRADING_ACCESS_CODE_SESSION_SECRET=$derived_session_secret" >> "$GITHUB_ENV"
            echo "TRADING_ACCESS_CODE_SESSION_SECRET was not configured; using deterministic key-separated session signing derived from TRADING_MASTER_KEY."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Require production Trading storage bindings and fail-closed execution
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'CHECK_PRODUCTION_STORAGE_CONFIG'
          import { readFile } from 'node:fs/promises';

          const config = await readFile('wrangler.toml', 'utf8');
          const getSection = (header) => {
            const lines = config.split(/\r?\n/);
            const start = lines.indexOf(header);
            if (start < 0) return [];
            const body = [];
            for (const line of lines.slice(start + 1)) {
              if (/^\s*\[/.test(line)) break;
              body.push(line);
            }
            return body;
          };
          const value = (lines, key) => {
            const line = lines.find((entry) => new RegExp(`^\\s*${key}\\s*=`).test(entry));
            return line?.match(/^\s*[A-Za-z0-9_-]+\s*=\s*"([^"]*)"\s*$/)?.[1];
          };
          const varsSection = getSection('[vars]').join('\n');
          const requireVar = (name, expected) => {
            const match = varsSection.match(new RegExp(`^${name}\\s*=\\s*"([^"]*)"\\s*$`, 'm'));
            if (!match || match[1] !== expected) throw new Error(`Production Wrangler setting ${name} must be ${expected}`);
          };
          const d1 = getSection('[[d1_databases]]');
          const hyperdrive = getSection('[[hyperdrive]]');
          const d1Name = value(d1, 'database_name');
          const d1Id = value(d1, 'database_id');
          if (value(d1, 'binding') !== 'DB') throw new Error('Production D1 binding DB is missing');
          if (d1Name !== 'trading-staging' || !/^[0-9a-f-]{36}$/i.test(d1Id || '')) {
            throw new Error('Production must bind the verified existing Trading D1 resource');
          }
          if (value(hyperdrive, 'binding') !== 'TRADING_PG') throw new Error('Production Hyperdrive binding TRADING_PG is missing');
          const hyperdriveId = value(hyperdrive, 'id');
          if (!/^[0-9a-f]{32}$/i.test(hyperdriveId || '')) throw new Error('Production Hyperdrive resource id is invalid');
          requireVar('TRADING_STORAGE_RUNTIME_ENABLED', 'true');
          requireVar('TRADING_STORAGE_AUTHORITY', 'd1');
          requireVar('TRADING_STORAGE_AUTHORITY_EPOCH', '1');
          requireVar('LIVE_BROKER_EXECUTION_ENABLED', 'false');
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
            throw new Error('Cloudflare read-only storage verification credentials are missing');
          }
          const getResource = async (path) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/${path}`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, Accept: 'application/json' },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Cloudflare read-only resource verification failed (${response.status})`);
            const body = await response.json();
            if (body.success !== true) throw new Error('Cloudflare read-only resource verification returned an unsuccessful response');
            return body.result;
          };
          const [d1Resource, hyperdriveResource] = await Promise.all([
            getResource(`d1/database/${d1Id}`),
            getResource(`hyperdrive/configs/${hyperdriveId}`),
          ]);
          if (d1Resource?.name !== 'trading-staging') throw new Error('Production D1 binding does not resolve to the existing Trading D1');
          if (hyperdriveResource?.name !== 'mkety-production-db' || hyperdriveResource?.origin?.database !== 'mkety'
            || typeof hyperdriveResource?.origin?.access_client_id !== 'string' || !hyperdriveResource.origin.access_client_id) {
            throw new Error('Production Hyperdrive binding does not resolve to the verified private mkety route');
          }
          console.log('Production storage bindings resolve to the existing Trading D1 and private mkety Hyperdrive resources; IDs and credentials withheld.');
          CHECK_PRODUCTION_STORAGE_CONFIG

      - name: Configure Cloudflare for SaaS white-label foundation
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_response="$(curl -fsS "${auth[@]}" "$api/zones?name=$TRADING_SAAS_ZONE&status=active")"
          zone_id="$(ZONE_RESPONSE="$zone_response" node <<'NODE'
          const body = JSON.parse(process.env.ZONE_RESPONSE || '{}');
          const row = Array.isArray(body.result) ? body.result.find(x => x && x.name === process.env.TRADING_SAAS_ZONE) : null;
          if (!body.success || !row?.id) process.exit(1);
          process.stdout.write(String(row.id));
          NODE
          )"
          echo "CLOUDFLARE_ZONE_ID=$zone_id" >> "$GITHUB_ENV"

          ensure_dns() {
            local type="$1" name="$2" content="$3"
            local response count existing_content existing_proxied payload
            response="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?type=$type&name=$name")"
            count="$(DNS_RESPONSE="$response" node -e "const b=JSON.parse(process.env.DNS_RESPONSE);process.stdout.write(String((b.result||[]).length))")"
            if [ "$count" = "0" ]; then
              payload="$(TYPE="$type" NAME="$name" CONTENT="$content" node -e "process.stdout.write(JSON.stringify({type:process.env.TYPE,name:process.env.NAME,content:process.env.CONTENT,proxied:true,ttl:1}))")"
              curl -fsS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$payload" >/dev/null
              echo "Created managed DNS record: $name"
              return
            fi
            existing_content="$(DNS_RESPONSE="$response" node -e "const r=JSON.parse(process.env.DNS_RESPONSE).result[0];process.stdout.write(String(r.content||''))")"
            existing_proxied="$(DNS_RESPONSE="$response" node -e "const r=JSON.parse(process.env.DNS_RESPONSE).result[0];process.stdout.write(String(Boolean(r.proxied)))")"
            if [ "${existing_content,,}" != "${content,,}" ] || [ "$existing_proxied" != "true" ]; then
              echo "Refusing to overwrite conflicting Cloudflare DNS record $name (expected $type -> $content, proxied)." >&2
              exit 1
            fi
            echo "Managed DNS record already correct: $name"
          }

          ensure_dns AAAA "$TRADING_SAAS_FALLBACK_ORIGIN" "100::"
          ensure_dns CNAME "$TRADING_CUSTOM_HOSTNAME_CNAME_TARGET" "$TRADING_SAAS_FALLBACK_ORIGIN"

          fallback_payload="$(node -e "process.stdout.write(JSON.stringify({origin:process.env.TRADING_SAAS_FALLBACK_ORIGIN}))")"
          curl -fsS "${auth[@]}" -X PUT "$api/zones/$zone_id/custom_hostnames/fallback_origin" --data "$fallback_payload" >/dev/null

          fallback_status=""
          for attempt in $(seq 1 15); do
            response="$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/custom_hostnames/fallback_origin")"
            fallback_status="$(CF_RESPONSE="$response" node -e "const b=JSON.parse(process.env.CF_RESPONSE);process.stdout.write(String(b.result?.status||''))")"
            [ "$fallback_status" = "active" ] && break
            sleep 2
          done
          if [ "$fallback_status" != "active" ]; then
            echo "Cloudflare for SaaS fallback origin did not become active (status=$fallback_status). Ensure token has Zone Read, DNS Edit, SSL and Certificates Edit, and Workers Routes Edit permissions." >&2
            exit 1
          fi
          echo "Cloudflare for SaaS fallback is active."

      - name: Build temporary production Wrangler config with dual-gate broker safety
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('wrangler.toml', 'utf8');
          const replacements = {
            TRADINGVIEW_DIRECT_INGRESS_ENABLED: 'false',
            TRADINGVIEW_CERT_PROBE_ENABLED: 'false',
            TRADING_ACCESS_ENABLED: 'true',
            BROKER_EXECUTION_ENABLED: 'true',
            TRADING_CUSTOM_HOSTNAMES_ENABLED: 'true',
          };
          let output = source;
          for (const [key, value] of Object.entries(replacements)) {
            const pattern = new RegExp(`^${key} = ".*"$`, 'm');
            if (!pattern.test(output)) throw new Error(`Missing expected Wrangler var: ${key}`);
            output = output.replace(pattern, `${key} = "${value}"`);
          }
          const extra = {
            TRADING_ACCESS_CODE_REDEMPTION_ENABLED: 'true',
            TRADING_ACCESS_CODE_SESSION_ENABLED: 'true',
            CLOUDFLARE_ZONE_ID: process.env.CLOUDFLARE_ZONE_ID,
            TRADING_CUSTOM_HOSTNAME_CNAME_TARGET: process.env.TRADING_CUSTOM_HOSTNAME_CNAME_TARGET,
            TRADING_WORKER_SCRIPT_NAME: process.env.TRADING_WORKER_SCRIPT_NAME,
            TRADING_CANONICAL_HOSTS: 'trade.mkety.com',
          };
          if (process.env.PRODUCTION_CTRADER_CBOT_GATEWAY_URL && process.env.PRODUCTION_CTRADER_CBOT_WS_URL) {
            extra.CTRADER_CBOT_GATEWAY_URL = process.env.PRODUCTION_CTRADER_CBOT_GATEWAY_URL;
            extra.CTRADER_CBOT_WS_URL = process.env.PRODUCTION_CTRADER_CBOT_WS_URL;
          }
          for (const [key, value] of Object.entries(extra)) {
            const line = `${key} = ${JSON.stringify(String(value))}`;
            const pattern = new RegExp(`^${key} = ".*"$`, 'm');
            output = pattern.test(output) ? output.replace(pattern, line) : output.replace('[vars]\n', `[vars]\n${line}\n`);
          }
          fs.writeFileSync('wrangler.production.generated.toml', output, { mode: 0o600 });
          NODE
          grep -Eq '^TRADING_ACCESS_ENABLED = "true"$' wrangler.production.generated.toml
          grep -Eq '^TRADING_ACCESS_CODE_REDEMPTION_ENABLED = "true"$' wrangler.production.generated.toml
          grep -Eq '^TRADING_ACCESS_CODE_SESSION_ENABLED = "true"$' wrangler.production.generated.toml
          grep -Eq '^BROKER_EXECUTION_ENABLED = "true"$' wrangler.production.generated.toml
          grep -Eq '^TRADING_CUSTOM_HOSTNAMES_ENABLED = "true"$' wrangler.production.generated.toml
          if [ -n "$PRODUCTION_CTRADER_CBOT_GATEWAY_URL" ]; then
            grep -Eq '^CTRADER_CBOT_GATEWAY_URL = "https://' wrangler.production.generated.toml
            grep -Eq '^CTRADER_CBOT_WS_URL = "wss://.*:25345/v1/cbot"$' wrangler.production.generated.toml
          fi

      - name: Build temporary production secrets file
        shell: bash
        run: |
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const payload = {
            TRADING_MASTER_KEY: process.env.PRODUCTION_TRADING_MASTER_KEY,
            TRADING_ACCESS_CODE_SESSION_SECRET: process.env.PRODUCTION_TRADING_ACCESS_CODE_SESSION_SECRET,
            MKETY_TRADING_ADMIN_SECRET: process.env.PRODUCTION_MKETY_TRADING_ADMIN_SECRET,
            CLOUDFLARE_API_TOKEN: process.env.CLOUDFLARE_API_TOKEN,
          };
          if (process.env.PRODUCTION_CBOT_TOKEN_SIGNING_KEY && process.env.PRODUCTION_CBOT_CONTROL_SECRET) {
            payload.CBOT_TOKEN_SIGNING_KEY = process.env.PRODUCTION_CBOT_TOKEN_SIGNING_KEY;
            payload.CBOT_CONTROL_SECRET = process.env.PRODUCTION_CBOT_CONTROL_SECRET;
          }
          for (const [key, value] of Object.entries(payload)) if (!value) throw new Error(`Missing required secret payload value: ${key}`);
          const target = path.join(process.env.RUNNER_TEMP, 'mkety-trading-production-secrets.json');
          fs.writeFileSync(target, JSON.stringify(payload), { mode: 0o600 });
          NODE

      - name: Final production dry-run
        run: npx wrangler deploy --dry-run --config wrangler.production.generated.toml

      - name: Snapshot persisted runtime controls before deployment
        shell: bash
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/runtime-controls-before.json"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' -H "X-Mkety-Admin-Secret: $PRODUCTION_MKETY_TRADING_ADMIN_SECRET" https://trade.mkety.com/api/v1/mkety-admin/runtime-controls)"
          if [ "$status" != "200" ]; then cat "$body_file" >&2; exit 1; fi
          RUNTIME_BODY="$(cat "$body_file")" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(process.env.RUNTIME_BODY || '{}');
          const keys = ['tradingAccessEnabled', 'brokerExecutionEnabled', 'liveBrokerExecutionEnabled'];
          if (!body.ok || keys.some((key) => typeof body[key] !== 'boolean')) {
            throw new Error('persisted runtime controls are unavailable or incomplete before deployment');
          }
          const snapshot = Object.fromEntries(keys.map((key) => [key, body[key]]));
          snapshot.tradingAccessUpdatedAt = body.tradingAccessUpdatedAt ?? null;
          snapshot.brokerExecutionUpdatedAt = body.brokerExecutionUpdatedAt ?? null;
          snapshot.liveBrokerExecutionUpdatedAt = body.liveBrokerExecutionUpdatedAt ?? null;
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/runtime-controls-before.json`, JSON.stringify(snapshot), { mode: 0o600 });
          console.log(`Persisted controls captured: trading=${snapshot.tradingAccessEnabled ? 'ON' : 'OFF'}, broker=${snapshot.brokerExecutionEnabled ? 'ON' : 'OFF'}, live=${snapshot.liveBrokerExecutionEnabled ? 'ON' : 'OFF'}`);
          NODE

      - name: Deploy production Trading Worker with persisted owner broker switch
        run: npx wrangler deploy --config wrangler.production.generated.toml --secrets-file "$RUNNER_TEMP/mkety-trading-production-secrets.json"

      - name: Remove legacy Supabase Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_json="$(npx wrangler secret list --config wrangler.production.generated.toml --format json)"
          legacy_names="$(SECRET_LIST_JSON="$secret_json" node <<'NODE'
          const parsed = JSON.parse(process.env.SECRET_LIST_JSON || 'null');
          if (!Array.isArray(parsed)) throw new Error('Cloudflare secret inventory returned an unexpected shape');
          const names = parsed.map((item) => typeof item === 'string' ? item : item?.name)
            .filter((name) => typeof name === 'string' && /^SUPABASE_/i.test(name));
          process.stdout.write([...new Set(names)].join('\n'));
          NODE
          )"
          if [ -n "$legacy_names" ]; then
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              npx wrangler secret delete "$name" --config wrangler.production.generated.toml
            done <<< "$legacy_names"
          fi
          remaining_json="$(npx wrangler secret list --config wrangler.production.generated.toml --format json)"
          SECRET_LIST_JSON="$remaining_json" node <<'NODE'
          const parsed = JSON.parse(process.env.SECRET_LIST_JSON || 'null');
          if (!Array.isArray(parsed)) throw new Error('Cloudflare secret inventory returned an unexpected shape');
          const remaining = parsed.map((item) => typeof item === 'string' ? item : item?.name)
            .filter((name) => typeof name === 'string' && /^SUPABASE_/i.test(name));
          if (remaining.length) throw new Error(`Legacy Supabase Worker secrets remain (${remaining.length})`);
          console.log('Legacy Supabase Worker secrets: absent');
          NODE

      - name: Probe production health
        shell: bash
        run: |
          health_url="${PRODUCTION_HEALTH_URL:-https://trade.mkety.com/api/v1/health}"
          body_file="$RUNNER_TEMP/production-health-body.json"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' "$health_url")"
          if [ "$status" != "200" ]; then cat "$body_file" >&2; exit 1; fi
          cat "$body_file"

      - name: Verify persisted owner broker switch without changing it
        shell: bash
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/runtime-control-body.json"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' -H "X-Mkety-Admin-Secret: $PRODUCTION_MKETY_TRADING_ADMIN_SECRET" https://trade.mkety.com/api/v1/mkety-admin/runtime-controls)"
          if [ "$status" != "200" ]; then cat "$body_file" >&2; exit 1; fi
          RUNTIME_BODY="$(cat "$body_file")" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(process.env.RUNTIME_BODY || '{}');
          const before = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/runtime-controls-before.json`, 'utf8'));
          if (!body.ok) throw new Error('runtime controls unavailable');
          if (body.brokerExecutionCapabilityEnabled !== true) throw new Error('deployment broker capability not enabled');
          const keys = ['tradingAccessEnabled', 'brokerExecutionEnabled', 'liveBrokerExecutionEnabled'];
          for (const key of keys) {
            if (typeof body[key] !== 'boolean') throw new Error(`persisted ${key} is invalid`);
            if (body[key] !== before[key]) throw new Error(`deployment changed persisted ${key}; refusing to report a safe deployment`);
          }
          for (const key of ['tradingAccessUpdatedAt', 'brokerExecutionUpdatedAt', 'liveBrokerExecutionUpdatedAt']) {
            if ((body[key] ?? null) !== before[key]) throw new Error(`persisted runtime control timestamp changed (${key}); deployment may have overlapped an admin update`);
          }
          if (typeof body.effectiveBrokerExecutionEnabled !== 'boolean') throw new Error('effective broker execution state is invalid');
          const expectedEffective = body.brokerExecutionCapabilityEnabled && body.brokerExecutionEnabled;
          if (body.effectiveBrokerExecutionEnabled !== expectedEffective) throw new Error('effective broker execution state is inconsistent');
          const expectedLive = body.tradingAccessEnabled && body.brokerExecutionEnabled && body.liveBrokerExecutionEnabled;
          if (body.effectiveLiveBrokerExecutionEnabled !== expectedLive) throw new Error('effective LIVE execution state is inconsistent');
          console.log(`Persisted controls preserved: trading=${body.tradingAccessEnabled ? 'ON' : 'OFF'}, broker=${body.brokerExecutionEnabled ? 'ON' : 'OFF'}, live=${body.liveBrokerExecutionEnabled ? 'ON' : 'OFF'}`);
          console.log(`Effective broker execution: ${body.effectiveBrokerExecutionEnabled ? 'ON' : 'OFF'}`);
          console.log(`Effective LIVE execution: ${body.effectiveLiveBrokerExecutionEnabled ? 'ON' : 'OFF'}`);
          NODE
          cat "$body_file"

      - name: Remove temporary production secrets file
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/mkety-trading-production-secrets.json" "$RUNNER_TEMP/runtime-controls-before.json" "$RUNNER_TEMP/runtime-control-body.json"

      - name: Record production safety posture
        shell: bash
        run: |
          echo "Production deploy completed from main."
          echo "Trading access: enabled"
          echo "Access-code redemption/session: enabled"
          echo "Mkety Trading admin secret: configured"
          echo "Cloudflare for SaaS custom hostnames: enabled"
          echo "White-label CNAME target: $TRADING_CUSTOM_HOSTNAME_CNAME_TARGET"
          echo "TradingView direct ingress: disabled"
          echo "Broker deployment capability: enabled"
          if [ -n "$PRODUCTION_CTRADER_CBOT_GATEWAY_URL" ]; then echo "Shared cTrader/MT5 gateway: configured"; else echo "Shared cTrader/MT5 gateway: not configured"; fi
          echo "Persisted owner broker switch: preserved (see verification step)"
