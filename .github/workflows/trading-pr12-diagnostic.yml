name: Trading PR12 Diagnostic

on:
  pull_request:
    paths:
      - 'cloudflare-v2/src/**'
      - 'cloudflare-v2/tests/**'
      - '.github/workflows/trading-pr12-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Enterprise connection sync contract
        run: node --test tests/enterprise_connections_sync.test.mjs
      - name: Enterprise portal controls contract
        run: node --test tests/enterprise_portal_controls.test.mjs
      - name: External MTProto policy contract
        run: node --test tests/external_mtproto_ingest_policy.test.mjs
      - name: Destination and broker routing contract
        run: node --test tests/enterprise_destination_contracts.test.mjs
      - name: AI router contract
        run: node --test tests/ai_router.test.mjs
      - name: Full Node regression suite
        run: npm run test:ci
