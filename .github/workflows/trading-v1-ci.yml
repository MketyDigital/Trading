      - name: Validate Paid and Free profiles without deployment
        run: |
          npx wrangler deploy --dry-run --config wrangler.toml
          npx wrangler deploy --dry-run --config wrangler.free.toml

      - name: Inventory Cloudflare queues
        run: npx wrangler queues list

