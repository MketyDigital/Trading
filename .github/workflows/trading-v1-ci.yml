name: Trading V1 CI

on:
  push:
    branches:
      - main
      - design/enterprise-trading-event-core
  pull_request:
    paths:
      - 'cloudflare-v2/**'
      - '.github/workflows/trading-v1-ci.yml'
      - 'AGENTS.md'
      - 'docs/superpowers/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker and trading-core tests
        run: npm run test:ci

      - name: Run pure MT5 bridge tests
        run: PYTHONPATH=bridges python -m unittest bridges/test_mt5_bridge.py -v

      - name: Run pure MTProto Python tests
        run: |
          PYTHONPATH=containers/mtproto-listener python -m unittest containers/mtproto-listener/test_listener.py -v
          PYTHONPATH=external/mtproto-adapter python -m unittest discover -s external/mtproto-adapter -p 'test_*.py' -v

      - name: Wrangler dry run
        run: |
          npx wrangler deploy --dry-run
          npx wrangler deploy --dry-run --config wrangler.free.toml

  cloudflare-inspect:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/design/enterprise-trading-event-core' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADINGVIEW_DIRECT_INGRESS_ENABLED: 'false'
      TRADINGVIEW_CERT_PROBE_ENABLED: 'false'
      TRADING_ACCESS_ENABLED: 'false'
      BROKER_EXECUTION_ENABLED: 'false'
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Validate Paid and Free profiles without deployment
        run: |
          npx wrangler deploy --dry-run --config wrangler.toml
          npx wrangler deploy --dry-run --config wrangler.free.toml

      - name: Inspect Paid Worker deployment history
        id: paid_deployments
        continue-on-error: true
        run: |
          set -o pipefail
          npx wrangler deployments list --config wrangler.toml 2>&1 | tee paid-deployments.log

      - name: Inspect Free Worker deployment history
        id: free_deployments
        continue-on-error: true
        run: |
          set -o pipefail
          npx wrangler deployments list --config wrangler.free.toml 2>&1 | tee free-deployments.log

      - name: Classify Worker deployment state
        run: |
          classify() {
            local outcome="$1"
            local log_file="$2"
            local label="$3"
            if [ "$outcome" = "success" ]; then
              echo "$label Worker state: deployment history available"
              return 0
            fi
            if grep -Eq 'Worker does not exist on your account|code: 10007' "$log_file"; then
              echo "$label Worker state: not deployed yet"
              return 0
            fi
            echo "$label Worker inspection failed for an unexpected Cloudflare API reason" >&2
            exit 1
          }
          classify "${{ steps.paid_deployments.outcome }}" paid-deployments.log Paid
          classify "${{ steps.free_deployments.outcome }}" free-deployments.log Free
