name: Trading V1 CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect, apply the existing schema, or import verified Trading data into the existing D1 and mkety targets
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - apply-existing-mkety-schema
          - import-existing-trading-data
      confirmation:
        description: Enter the exact schema or data-import confirmation for the selected mode
        required: false
        type: string
      freeze_evidence:
        description: Required for data import; enter source-freeze followed by your approved change or incident reference
        required: false
        type: string
  push:
    branches:
      - main
      - design/enterprise-trading-event-core
    paths:
      - 'cloudflare-v2/src/**'
      - 'cloudflare-v2/tests/**'
      - 'cloudflare-v2/bridges/**'
      - 'cloudflare-v2/containers/**'
      - 'cloudflare-v2/external/**'
      - 'cloudflare-v2/db/d1-migrations/**'
      - 'cloudflare-v2/db/postgres-migrations/**'
      - 'cloudflare-v2/db/schema.sql'
      - 'cloudflare-v2/scripts/**'
      - 'cloudflare-v2/package.json'
      - 'cloudflare-v2/package-lock.json'
      - 'cloudflare-v2/wrangler.toml'
      - 'cloudflare-v2/wrangler.free.toml'
      - 'cloudflare-v2/wrangler.trading-staging.toml'
      - 'cloudflare-v2/docs/GATE2_PAID_DEPLOY_TRIGGER.md'
      - 'cloudflare-v2/docs/GATE3_TRADINGVIEW_TRIGGER.md'
      - '.github/workflows/trading-v1-ci.yml'
  pull_request:
    paths:
      - 'cloudflare-v2/src/**'
      - 'cloudflare-v2/tests/**'
      - 'cloudflare-v2/bridges/**'
      - 'cloudflare-v2/containers/**'
      - 'cloudflare-v2/external/**'
      - 'cloudflare-v2/db/d1-migrations/**'
      - 'cloudflare-v2/db/postgres-migrations/**'
      - 'cloudflare-v2/db/schema.sql'
      - 'cloudflare-v2/scripts/**'
      - 'cloudflare-v2/package.json'
      - 'cloudflare-v2/package-lock.json'
      - 'cloudflare-v2/wrangler.toml'
      - 'cloudflare-v2/wrangler.free.toml'
      - 'cloudflare-v2/wrangler.trading-staging.toml'
      - '.github/workflows/trading-v1-ci.yml'
permissions:
  contents: read

jobs:
  test:
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/feat/trading-d1-cutover-implementation' &&
          (
            inputs.mode == 'inspect' ||
            (
              inputs.mode == 'apply-existing-mkety-schema' &&
              inputs.confirmation == 'APPLY_TRADING_STORAGE_SCHEMA'
            ) || (
              inputs.mode == 'import-existing-trading-data' &&
              inputs.confirmation == 'IMPORT_TRADING_DATA_TO_EXISTING_TARGETS' &&
              startsWith(inputs.freeze_evidence, 'source-freeze:')
            )
          )
        ) ||
        github.ref == 'refs/heads/main' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/design/enterprise-trading-event-core' &&
          (
            github.event.head_commit.message == 'cloudflare: deploy paid staging gate 2' ||
            github.event.head_commit.message == 'cloudflare: accept staging gate 2' ||
            github.event.head_commit.message == 'cloudflare: probe tradingview gate 3'
          )
        )
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Worker and trading-core tests
        run: npm run test:ci

      - name: Run pure MT5 bridge tests
        run: PYTHONPATH=bridges python -m unittest bridges/test_mt5_bridge.py -v

      - name: Run pure MTProto Python tests
        run: |
          PYTHONPATH=containers/mtproto-listener python -m unittest containers/mtproto-listener/test_listener.py -v
          PYTHONPATH=external/mtproto-adapter python -m unittest discover -s external/mtproto-adapter -p 'test_*.py' -v

  cloudflare-storage-inventory:
    needs: test
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'feat/trading-d1-cutover-implementation'
        ) || (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/feat/trading-d1-cutover-implementation' &&
          (
            inputs.mode == 'inspect' ||
            (
              inputs.mode == 'apply-existing-mkety-schema' &&
              inputs.confirmation == 'APPLY_TRADING_STORAGE_SCHEMA'
            ) || (
              inputs.mode == 'import-existing-trading-data' &&
              inputs.confirmation == 'IMPORT_TRADING_DATA_TO_EXISTING_TARGETS' &&
              startsWith(inputs.freeze_evidence, 'source-freeze:')
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: trading-coolify-postgres-staging
      cancel-in-progress: false
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies without Cloudflare credentials
        run: npm ci --no-audit --no-fund

      - name: Inspect or explicitly apply existing Trading D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_MODE: ${{ inputs.mode || 'inspect' }}
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing GitHub staging secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing GitHub staging secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npx wrangler whoami
          npx wrangler d1 list --json > "$RUNNER_TEMP/trading-d1-inventory.json"
          node --input-type=module <<'D1_INVENTORY'
          import { readFile } from 'node:fs/promises';

          const payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/trading-d1-inventory.json`, 'utf8'));
          const databases = Array.isArray(payload) ? payload : payload.result;
          if (!Array.isArray(databases)) throw new Error('Unexpected D1 inventory response shape');
          const safeDatabases = databases.map(({ name, uuid, num_tables }) => ({ name, uuid, num_tables }));
          console.log(`D1 inventory (safe fields only): ${JSON.stringify(safeDatabases)}`);
          D1_INVENTORY
          node --input-type=module <<'CHECK_TRADING_D1'
          import { readFile } from 'node:fs/promises';

          const payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/trading-d1-inventory.json`, 'utf8'));
          const databases = Array.isArray(payload) ? payload : payload.result;
          if (!Array.isArray(databases)) throw new Error('Unexpected D1 inventory response shape');
          if (!databases.some(({ name }) => name === 'trading-staging')) {
            throw new Error('Existing Trading staging D1 is missing; refusing to provision a database');
          }
          CHECK_TRADING_D1
          npx wrangler d1 list --json > "$RUNNER_TEMP/trading-d1-inventory.json"
          node --input-type=module <<'D1_CONFIG'
          import { readFile, writeFile } from 'node:fs/promises';

          const payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/trading-d1-inventory.json`, 'utf8'));
          const databases = Array.isArray(payload) ? payload : payload.result;
          const database = databases?.find(({ name }) => name === 'trading-staging');
          if (!database?.uuid) throw new Error('Existing Trading staging D1 is missing; refusing to provision a database');
          const config = [
            'name = "mkety-trading-staging-migrations"',
            'main = "src/v1_runtime_entry.js"',
            'compatibility_date = "2026-10-17"',
            'compatibility_flags = ["nodejs_compat"]',
            '',
            '[[d1_databases]]',
            'binding = "TRADING_DB"',
            'database_name = "trading-staging"',
            `database_id = "${database.uuid}"`,
            'migrations_dir = "db/d1-migrations"',
            ''
          ].join('\n');
          await writeFile('wrangler.trading-staging.toml', config, { mode: 0o600 });
          console.log(`Prepared isolated D1 migration target ${database.name} (${database.uuid})`);
          D1_CONFIG
          trap 'rm -f wrangler.trading-staging.toml' EXIT
          if [ "$STAGING_MODE" = 'apply-existing-mkety-schema' ]; then
            npx wrangler d1 migrations apply trading-staging --remote --config wrangler.trading-staging.toml
          fi
          npx wrangler d1 migrations list trading-staging --remote --config wrangler.trading-staging.toml
          npx wrangler d1 execute trading-staging --remote --config wrangler.trading-staging.toml --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name;" \
            > "$RUNNER_TEMP/trading-d1-schema-check.json"
          node --input-type=module <<'CHECK_TRADING_D1_SCHEMA'
          import { readFile } from 'node:fs/promises';
          import { compareD1MigrationTableInventory } from './scripts/trading_d1_schema_inventory.mjs';

          const migrationPaths = [
            'db/d1-migrations/0001_trading_storage_replication.sql',
            'db/d1-migrations/0002_trading_domain_schema.sql',
            'db/d1-migrations/0003_trading_replication_health.sql',
          ];
          const migrationSql = (await Promise.all(migrationPaths.map((path) => readFile(path, 'utf8')))).join('\n');
          const payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/trading-d1-schema-check.json`, 'utf8'));
          const rows = Array.isArray(payload)
            ? payload.flatMap((item) => Array.isArray(item?.results) ? item.results : [])
            : Array.isArray(payload?.results) ? payload.results : [];
          const inventory = compareD1MigrationTableInventory({
            migrationSql,
            actualTables: rows.map((row) => row?.name),
          });
          if (inventory.missing.length || inventory.unexpected.length) {
            throw new Error(`Remote Trading D1 schema mismatch: ${JSON.stringify(inventory)}`);
          }
          console.log(`Remote Trading D1 exact schema check passed (${inventory.actualCount} tables).`);
          CHECK_TRADING_D1_SCHEMA
      - name: Inspect existing Cloudflare Worker database and private-network bindings (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP"/cf-hyperdrive.json "$RUNNER_TEMP"/cf-tunnels.json "$RUNNER_TEMP"/cf-worker-settings.json' EXIT
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing Cloudflare API token for read-only connectivity inventory.'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing Cloudflare account ID for read-only connectivity inventory.'; exit 1; }
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --proto '=https' --tlsv1.2 -fsS --retry 2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' \
            "$base/hyperdrive/configs?per_page=100" -o "$RUNNER_TEMP/cf-hyperdrive.json"
          curl --proto '=https' --tlsv1.2 -fsS --retry 2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' \
            "$base/cfd_tunnel?is_deleted=false&per_page=100" -o "$RUNNER_TEMP/cf-tunnels.json"
          curl --proto '=https' --tlsv1.2 -fsS --retry 2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' \
            "$base/workers/scripts/mkety-copier-engine/settings" -o "$RUNNER_TEMP/cf-worker-settings.json"
          node <<'SAFE_CLOUDFLARE_BINDING_INVENTORY'
          const fs = require('node:fs');
          const readResult = (name) => {
            const response = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, 'utf8'));
            if (response.success !== true) throw new Error(`Cloudflare read-only inventory failed for ${name}`);
            return response.result;
          };
          const hyperdrivePayload = readResult('cf-hyperdrive.json');
          const hyperdrives = Array.isArray(hyperdrivePayload) ? hyperdrivePayload : hyperdrivePayload?.result;
          if (!Array.isArray(hyperdrives)) throw new Error('Unexpected Cloudflare Hyperdrive inventory response shape');
          const safeHyperdrives = hyperdrives.map((row) => ({
            id: typeof row?.id === 'string' ? row.id : null,
            name: typeof row?.name === 'string' ? row.name : null,
            database: typeof row?.origin?.database === 'string' ? row.origin.database : null,
            accessTunnelConfigured: Boolean(row?.origin?.access_client_id),
            vpcServiceConfigured: Boolean(row?.origin?.vpc_service_id)
          }));
          const tunnelPayload = readResult('cf-tunnels.json');
          const tunnels = Array.isArray(tunnelPayload) ? tunnelPayload : tunnelPayload?.result;
          if (!Array.isArray(tunnels)) throw new Error('Unexpected Cloudflare Tunnel inventory response shape');
          const safeTunnels = tunnels.map((row) => ({
            id: typeof row?.id === 'string' ? row.id : null,
            name: typeof row?.name === 'string' ? row.name : null,
            status: typeof row?.status === 'string' ? row.status : null,
            configSource: typeof row?.config_src === 'string' ? row.config_src : null,
            activeConnections: Array.isArray(row?.connections) ? row.connections.length : 0
          }));
          const settings = readResult('cf-worker-settings.json');
          const bindings = Array.isArray(settings?.bindings) ? settings.bindings : [];
          const safeDatabaseBindings = bindings.filter((row) => ['d1', 'hyperdrive'].includes(String(row?.type || '').toLowerCase())).map((row) => ({
            name: typeof row?.name === 'string' ? row.name : null,
            type: typeof row?.type === 'string' ? row.type : null,
            resourceId: typeof row?.id === 'string' ? row.id : typeof row?.database_id === 'string' ? row.database_id : null,
            databaseName: typeof row?.database_name === 'string' ? row.database_name : null
          }));
          console.log(`Cloudflare Hyperdrive inventory (safe fields only): ${JSON.stringify(safeHyperdrives)}`);
          console.log(`Cloudflare Tunnel inventory (safe fields only): ${JSON.stringify(safeTunnels)}`);
          console.log(`Production Worker database bindings (safe fields only): ${JSON.stringify(safeDatabaseBindings)}`);
          SAFE_CLOUDFLARE_BINDING_INVENTORY
      - name: Check access to the existing Coolify PostgreSQL database
        env:
          TRADING_PG_STAGING_DATABASE_URL: ${{ secrets.TRADING_PG_STAGING_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        shell: bash
        run: |
          if [ -n "${TRADING_PG_STAGING_DATABASE_URL:-}" ]; then
            echo 'Existing Coolify PostgreSQL connection secret is configured.'
          else
            echo 'Existing Coolify PostgreSQL connection secret is not configured.'
          fi
          if [ -n "${STAGING_DATABASE_URL:-}" ]; then
            echo 'A generic staging database credential is configured; it is not approved for Trading use.'
          fi
      - name: Inventory Coolify database resources (read-only)
        env:
          OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
          OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
          STAGING_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP"/coolify-*.json "$RUNNER_TEMP"/coolify-*.txt' EXIT
          if [[ -z "${OCI_COOLIFY_URL:-}" && -z "${OCI_COOLIFY_TOKEN:-}" ]]; then
            echo 'Coolify credentials are not available in the staging environment.'
            exit 0
          fi
          test -n "${OCI_COOLIFY_URL:-}" || { echo 'OCI_COOLIFY_URL is present without OCI_COOLIFY_TOKEN'; exit 1; }
          test -n "${OCI_COOLIFY_TOKEN:-}" || { echo 'OCI_COOLIFY_TOKEN is present without OCI_COOLIFY_URL'; exit 1; }
          if [[ "$OCI_COOLIFY_URL" == *$'\n'* || "$OCI_COOLIFY_TOKEN" == *$'\n'* ]]; then
            echo 'Coolify URL and token secrets must each be a single line.'
            exit 1
          fi
          root="${OCI_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" -H 'Accept: application/json' \
            "$api/databases" > "$RUNNER_TEMP/coolify-database-inventory.json"
          INVENTORY_PATH="$RUNNER_TEMP/coolify-database-inventory.json" node <<'SAFE_COOLIFY_INVENTORY'
          import { readFile, writeFile } from 'node:fs/promises';

          const payload = JSON.parse(await readFile(process.env.INVENTORY_PATH, 'utf8'));
          const databases = Array.isArray(payload) ? payload : payload.databases ?? payload.data ?? payload.result;
          if (!Array.isArray(databases)) throw new Error('Unexpected Coolify database inventory response shape');
          const safe = databases.map((row) => ({
            name: typeof row?.name === 'string' ? row.name : null,
            uuid: typeof row?.uuid === 'string' ? row.uuid : null,
            type: typeof row?.database_type === 'string' ? row.database_type : typeof row?.type === 'string' ? row.type : null,
            status: typeof row?.status === 'string' ? row.status : null,
            environment: typeof row?.environment_name === 'string' ? row.environment_name : null
          }));
          const candidates = safe.filter(({ name, type }) => /trading|postgres|postgresql|mkety/i.test(`${name || ''} ${type || ''}`));
          console.log(`Coolify database resource count: ${safe.length}`);
          console.log(`Coolify Trading/PostgreSQL candidates (safe fields only): ${JSON.stringify(candidates)}`);
          const central = databases.find((row) => String(row?.name || '').trim().toLowerCase() === 'mkety-postgres');
          if (central?.uuid) {
            if (!/^[a-z0-9-]+$/i.test(central.uuid)) throw new Error('Unexpected Coolify PostgreSQL resource identifier');
            await writeFile(`${process.env.RUNNER_TEMP}/coolify-mkety-postgres-uuid.txt`, central.uuid, { mode: 0o600 });
          }
          SAFE_COOLIFY_INVENTORY
          if [ -f "$RUNNER_TEMP/coolify-mkety-postgres-uuid.txt" ]; then
            target_uuid="$(cat "$RUNNER_TEMP/coolify-mkety-postgres-uuid.txt")"
            rm -f "$RUNNER_TEMP/trading-pg-backup-preflight.json"
            curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" -H 'Accept: application/json' \
              "$api/databases/$target_uuid" > "$RUNNER_TEMP/coolify-mkety-postgres.json"
            curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" -H 'Accept: application/json' \
              "$api/databases/$target_uuid/envs" > "$RUNNER_TEMP/coolify-mkety-postgres-envs.json"
            curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" -H 'Accept: application/json' \
              "$api/databases/$target_uuid/backups" > "$RUNNER_TEMP/coolify-mkety-postgres-backups.json"
            BACKUPS_PATH="$RUNNER_TEMP/coolify-mkety-postgres-backups.json" node <<'SAFE_COOLIFY_BACKUP_SCHEDULES'
          import { readFile, writeFile } from 'node:fs/promises';

          const payload = JSON.parse(await readFile(process.env.BACKUPS_PATH, 'utf8'));
          const schedules = Array.isArray(payload) ? payload : payload.backups ?? payload.scheduled_backups ?? payload.data ?? payload.result;
          if (!Array.isArray(schedules)) throw new Error('Unexpected Coolify PostgreSQL backup schedule response shape');
          const safe = schedules.map((row) => ({
            uuid: typeof row?.uuid === 'string' ? row.uuid : null,
            frequency: typeof row?.frequency === 'string' ? row.frequency : null,
            enabled: typeof row?.enabled === 'boolean' ? row.enabled : null,
            saveS3: typeof row?.save_s3 === 'boolean' ? row.save_s3 : null,
            retentionLocalCount: Number.isInteger(row?.database_backup_retention_amount_locally) ? row.database_backup_retention_amount_locally : null,
            retentionLocalDays: Number.isInteger(row?.database_backup_retention_days_locally) ? row.database_backup_retention_days_locally : null,
            retentionS3Count: Number.isInteger(row?.database_backup_retention_amount_s3) ? row.database_backup_retention_amount_s3 : null,
            retentionS3Days: Number.isInteger(row?.database_backup_retention_days_s3) ? row.database_backup_retention_days_s3 : null
          }));
          console.log(`Coolify PostgreSQL backup schedules (safe fields only): ${JSON.stringify(safe)}`);
          const ids = safe.map(({ uuid }) => uuid).filter((uuid) => /^[a-z0-9-]{8,64}$/i.test(String(uuid || '')));
          await writeFile(`${process.env.RUNNER_TEMP}/coolify-mkety-postgres-backup-uuids.txt`, ids.join('\n'), { mode: 0o600 });
          SAFE_COOLIFY_BACKUP_SCHEDULES
            while IFS= read -r backup_uuid; do
              [ -n "$backup_uuid" ] || continue
              curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" -H 'Accept: application/json' \
                "$api/databases/$target_uuid/backups/$backup_uuid/executions" > "$RUNNER_TEMP/coolify-mkety-postgres-backup-executions.json"
              BACKUP_UUID="$backup_uuid" BACKUP_EXECUTIONS_PATH="$RUNNER_TEMP/coolify-mkety-postgres-backup-executions.json" node <<'SAFE_COOLIFY_BACKUP_EXECUTIONS'
          import { readFile, writeFile } from 'node:fs/promises';

          const backupUuid = process.env.BACKUP_UUID;
          if (!/^[a-z0-9-]{8,64}$/i.test(String(backupUuid || ''))) throw new Error('Unexpected Coolify PostgreSQL backup identifier');
          const payload = JSON.parse(await readFile(process.env.BACKUP_EXECUTIONS_PATH, 'utf8'));
          const executions = Array.isArray(payload) ? payload : payload.executions ?? payload.data ?? payload.result;
          if (!Array.isArray(executions)) throw new Error('Unexpected Coolify PostgreSQL backup execution response shape');
          const safe = executions.map((row) => ({
            createdAt: typeof row?.created_at === 'string' ? row.created_at : null,
            status: typeof row?.status === 'string' ? row.status : null,
            sizeBytes: Number.isFinite(Number(row?.size)) ? Number(row.size) : null
          })).sort((left, right) => String(right.createdAt || '').localeCompare(String(left.createdAt || '')));
          console.log(`Coolify PostgreSQL backup executions (safe fields only): ${JSON.stringify({ backupUuid, count: safe.length, latest: safe[0] ?? null })}`);
          const cutoffMs = Date.now() - 24 * 60 * 60 * 1000;
          const recentSuccess = safe.find((item) => item.status?.toLowerCase() === 'success'
            && Number.isFinite(Date.parse(item.createdAt || ''))
            && Date.parse(item.createdAt) <= Date.now()
            && Date.parse(item.createdAt) >= cutoffMs);
          if (recentSuccess) {
            await writeFile(`${process.env.RUNNER_TEMP}/trading-pg-backup-preflight.json`, JSON.stringify({ backupUuid, ...recentSuccess }), { mode: 0o600 });
          }
          SAFE_COOLIFY_BACKUP_EXECUTIONS
            done < "$RUNNER_TEMP/coolify-mkety-postgres-backup-uuids.txt"
            if [ "$STAGING_MODE" = 'apply-existing-mkety-schema' ] || [ "$STAGING_MODE" = 'import-existing-trading-data' ]; then
              test -s "$RUNNER_TEMP/trading-pg-backup-preflight.json" || { echo 'Schema/data write refused: no successful Coolify PostgreSQL backup in the last 24 hours.'; exit 1; }
              echo 'Existing Coolify PostgreSQL backup preflight passed for the requested write operation.'
            fi
            node --input-type=module <<'SAFE_COOLIFY_POSTGRES_DETAILS'
