      - name: Deploy exact-commit Trading PostgreSQL probe or schema-only migration
        env:
          OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
          OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
          APP_UUID: ${{ steps.postgres-probe-app.outputs.app_uuid }}
          APPLY_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_UUID" || { echo 'Transient PostgreSQL probe app was not created.'; exit 1; }
          root="${OCI_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/trading-pg-probe-deploy.json" -w '%{http_code}' \
            --connect-timeout 10 --max-time 60 \
            -X POST -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/deploy?uuid=$APP_UUID&force=true")"
          [ "$code" = '200' ] || { echo "Coolify transient PostgreSQL probe deployment failed with HTTP $code."; exit 2; }
          deployment_uuid="$(node -e "const x=require(process.argv[1]);const d=Array.isArray(x.deployments)?x.deployments[0]:null;if(!/^[a-z0-9-]{8,64}$/i.test(String(d?.deployment_uuid||'')))process.exit(1);process.stdout.write(d.deployment_uuid)" "$RUNNER_TEMP/trading-pg-probe-deploy.json")"

          fetch_logs() {
            curl --proto '=https' --tlsv1.2 -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" \
              "$api/applications/$APP_UUID/logs?lines=1000&show_timestamps=false" \
              -o "$RUNNER_TEMP/trading-pg-probe-logs.json"
          }
          print_safe_failure() {
            node <<'SAFE_PROBE_FAILURE'
          const fs = require('node:fs');
          const redact = (value) => String(value || '')
            .replace(/postgres(?:ql)?:\/\/[^\s"'`]+/gi, 'postgresql://***')
            .replace(/Bearer\s+[^\s"'`]+/gi, 'Bearer ***')
            .replace(/((?:password|secret|token|authorization)\s*[=:]\s*)[^\s"'`]+/gi, '$1***');
          try {
            const deployment = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/trading-pg-probe-deployment-status.json', 'utf8'));
            console.error(`Sanitized Coolify deployment status: ${redact(deployment.status || 'unknown')}`);
            const deploymentLogs = String(deployment.logs || '').split(/\r?\n/).filter(Boolean).slice(-80).map(redact);
            if (deploymentLogs.length) console.error(deploymentLogs.join('\n'));
          } catch {}
          let logs = '';
          try { logs = String(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/trading-pg-probe-logs.json', 'utf8')).logs || ''); } catch {}
          const safe = logs.split(/\r?\n/).filter((line) => /Staging PostgreSQL probe failed during|PostgreSQL schema migration failed during|must be read-only|TRADING_PG_(?:PROBE|MIGRATION)_OK=/.test(line));
          for (const line of safe.slice(-5)) console.error(redact(line));
          SAFE_PROBE_FAILURE
          }

          deployment_done='no'
          for i in $(seq 1 120); do
            curl --proto '=https' --tlsv1.2 -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/deployments/$deployment_uuid" \
              -o "$RUNNER_TEMP/trading-pg-probe-deployment-status.json"
            status="$(node -e "const x=require(process.argv[1]);process.stdout.write(String(x.status||''))" "$RUNNER_TEMP/trading-pg-probe-deployment-status.json")"
            case "${status,,}" in
              finished|success|successful|succeeded|completed) deployment_done='yes'; break ;;
              failed|failure|error|cancelled|canceled)
                fetch_logs || true
                print_safe_failure
                echo "Transient PostgreSQL probe deployment failed with status $status."
                exit 3
                ;;
            esac
            sleep 5
          done
          if [ "$deployment_done" != 'yes' ]; then
            fetch_logs || true
            print_safe_failure
            echo 'Timed out waiting for transient PostgreSQL probe deployment.'
            exit 4
          fi

          probe_done='no'
          for i in $(seq 1 60); do
          if fetch_logs && APPLY_MODE="$APPLY_MODE" node <<'VERIFY_SAFE_PROBE_RESULT'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/trading-pg-probe-logs.json', 'utf8'));
          const logs = String(payload.logs || '');
          const applying = process.env.APPLY_MODE === 'apply-existing-mkety-schema';
          const importing = process.env.APPLY_MODE === 'import-existing-trading-data';
          const prefix = importing ? 'TRADING_SNAPSHOT_IMPORT_OK=' : applying ? 'TRADING_PG_MIGRATION_OK=' : 'TRADING_PG_PROBE_OK=';
          const line = logs.split(/\r?\n/).find((entry) => entry.startsWith(prefix));
          if (!line) process.exit(1);
          const result = JSON.parse(line.slice(prefix.length));
          if (importing) {
            const important = result.importantRows || {};
            if (result.tables !== 28 || result.targetsParityVerified !== true || result.authorityActivated !== true
              || !Number.isSafeInteger(result.d1Rows) || result.d1Rows !== result.postgresRows
              || !(important.workspaces > 0) || !(important.trading_workspace_access > 0)
              || result.fences?.globalControlsFenced !== 2
              || result.fences?.workspaceAccessPreserved !== important.trading_workspace_access) {
              throw new Error('Snapshot import did not verify all reviewed tables and preserve owner access while fencing broker execution.');
            }
            console.log(`Existing D1 and mkety data parity verified: tables=${result.tables}, rows=${result.d1Rows}; owner workspace/access rows=${important.workspaces}/${important.trading_workspace_access}; broker execution remains fenced.`);
          } else if (applying) {
            const expectedMigrations = [
              '0001_trading_storage_replication_authority.sql',
              '0002_trading_domain_schema.sql',
              '0003_trading_replication_health.sql'
            ];
            const appliedExactly = result.alreadyApplied === true
              || (Array.isArray(result.applied) && JSON.stringify(result.applied) === JSON.stringify(expectedMigrations));
            if (result.databaseName !== 'mkety' || result.schemaName !== 'trading_storage' || !appliedExactly) {
              throw new Error('Schema-only migration did not verify the expected database, schema, and migration ledger.');
            }
            console.log(`Existing mkety Trading schema migration verified: ${JSON.stringify(result)}`);
          } else {
            if (result.transactionReadOnly !== true || typeof result.databaseName !== 'string' || typeof result.roleIsSuperuser !== 'boolean') {
              throw new Error('Read-only PostgreSQL probe did not confirm database identity metadata.');
            }
            console.log(`Existing PostgreSQL staging connection verified inside Coolify: ${JSON.stringify(result)}`);
          }
          VERIFY_SAFE_PROBE_RESULT
            then
              probe_done='yes'
              break
            fi
            sleep 3
          done
          if [ "$probe_done" != 'yes' ]; then
            print_safe_failure
            echo 'The transient Coolify app did not report the expected read-only probe or schema-only migration result.'
            exit 5
          fi
      - name: Delete ephemeral Trading PostgreSQL probe host
        if: always() && steps.postgres-probe-app.outputs.app_uuid != ''
        env:
          OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
          OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
          APP_UUID: ${{ steps.postgres-probe-app.outputs.app_uuid }}
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS --connect-timeout 10 --max-time 60 \
            -X DELETE -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" \
            "$api/applications/$APP_UUID" >/dev/null
          echo 'Ephemeral Trading PostgreSQL probe host deleted.'

