          const final = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/gate2-containers-final.json', 'utf8'));
          const beforeIds = new Set(before.map((item) => String(item.id)));
          const created = final.filter((item) => !beforeIds.has(String(item.id)));
          if (created.length) {
            console.error(`Rollback verification found ${created.length} new Container instance(s).`);
            process.exit(1);
          }
          console.log(`Rollback verified with no new Container instance IDs; final instance records: ${final.length}.`);
          NODE

