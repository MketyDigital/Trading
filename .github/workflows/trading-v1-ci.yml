          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/gate2-containers-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/gate2-containers-after.json', 'utf8'));
          const beforeIds = new Set(before.map((item) => String(item.id)));
          const created = after.filter((item) => !beforeIds.has(String(item.id)));
          if (created.length) {
            console.error(`Gate 2 Container non-selection failed: ${created.length} new instance(s) appeared.`);
            process.exit(1);
          }
          console.log(`Gate 2 Container non-selection verified: ${before.length} instance record(s) before, ${after.length} after, 0 new instance IDs.`);
          NODE

      - name: Roll back to first known-good Paid staging version
        if: ${{ always() && steps.acceptance_deploy.outcome == 'success' }}
        run: npx wrangler rollback c25e85d5-bfe2-4d17-9ab4-5133d88ecec8 --config wrangler.toml --message "Gate 2 acceptance rollback"

      - name: Verify rollback and final Container state
        if: ${{ always() && steps.acceptance_deploy.outcome == 'success' }}
        shell: bash
        run: |
          npx wrangler deployments list --config wrangler.toml | head -40
          npx wrangler containers instances "$GATE2_CONTAINER_APPLICATION_ID" --json > "$RUNNER_TEMP/gate2-containers-final.json"
          node - <<'NODE'
          const fs = require('fs');
