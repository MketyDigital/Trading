name: Trading V1 CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'cloudflare-v2/**'
      - '.github/workflows/trading-v1-ci.yml'
      - 'AGENTS.md'
      - 'docs/superpowers/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker and trading-core tests
        run: npm run test:ci

      - name: Run pure MT5 bridge tests
        run: PYTHONPATH=bridges python -m unittest bridges/test_mt5_bridge.py -v

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
