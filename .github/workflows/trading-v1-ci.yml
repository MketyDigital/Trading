        run: npx wrangler containers instances "$GATE2_CONTAINER_APPLICATION_ID" --json > "$RUNNER_TEMP/gate2-containers-before.json"

      - name: Generate ephemeral acceptance secrets
        shell: bash
        run: |
          master_key="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          source_secret="$(openssl rand -hex 32)"
          internal_token="$(openssl rand -hex 32)"
          echo "::add-mask::$master_key"
          echo "::add-mask::$source_secret"
          echo "::add-mask::$internal_token"
          {
            echo "TRADING_MASTER_KEY=$master_key"
            echo "TRADING_V1_SOURCE_SECRET=$source_secret"
            echo "INTERNAL_SOURCE_TRANSPORT_TOKEN=$internal_token"
            echo "TRADE_STATE_INTERNAL_TOKEN=$internal_token"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/gate2-secrets.env" <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SERVICE_ROLE=$SUPABASE_SERVICE_ROLE
          TRADING_MASTER_KEY=$master_key
          TRADING_V1_SOURCE_SECRET=$source_secret
          INTERNAL_SOURCE_TRANSPORT_TOKEN=$internal_token
          TRADE_STATE_INTERNAL_TOKEN=$internal_token
          TRADING_V1_SIMULATION=true
