name: Diagnostic MTProto Tests

on:
  pull_request:
    paths:
      - 'cloudflare-v2/containers/mtproto-listener/**'
      - 'cloudflare-v2/external/mtproto-adapter/**'
      - '.github/workflows/diagnostic-mtproto-tests.yml'

permissions:
  contents: read

jobs:
  mtproto-test-log:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run hosted MTProto tests and capture output
        id: hosted
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=containers/mtproto-listener python -m unittest containers/mtproto-listener/test_listener.py -v 2>&1 | tee "$RUNNER_TEMP/hosted-mtproto.log"

      - name: Run external MTProto tests and capture output
        id: external
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=external/mtproto-adapter python -m unittest discover -s external/mtproto-adapter -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/external-mtproto.log"

      - name: Upload MTProto test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-mtproto-test-logs
          path: |
            ${{ runner.temp }}/hosted-mtproto.log
            ${{ runner.temp }}/external-mtproto.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail if either MTProto suite failed
        if: ${{ steps.hosted.outcome != 'success' || steps.external.outcome != 'success' }}
        run: exit 1
