name: Diagnose Cloudflare Credential

on:
  push:
    branches:
      - 'diag/coolify-cbot-runtime'
    paths:
      - '.github/workflows/diag-cloudflare-credential-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Test bearer token against verification and zone APIs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }
          python - <<'PY'
          import os
          v=os.environ['CLOUDFLARE_API_TOKEN']
          print(f'Token shape: length={len(v)} whitespace={any(c.isspace() for c in v)} bearer_prefix={v.lower().startswith("bearer ")} quote_wrapped={(len(v)>=2 and v[0] in chr(34)+chr(39) and v[-1]==v[0])} assignment_prefix={v.startswith("CLOUDFLARE_API_TOKEN=")}')
          print('Account ID configured:', bool(os.environ.get('CLOUDFLARE_ACCOUNT_ID')))
          PY

          verify_code="$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')"
          zone_code="$(curl -sS -o /tmp/zones.json -w '%{http_code}' \
            'https://api.cloudflare.com/client/v4/zones?name=mkety.com&status=active' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')"
          echo "Token verify endpoint HTTP: $verify_code"
          echo "mkety.com zones endpoint HTTP: $zone_code"
          python - <<'PY'
          import json
          for label,path in [('verify','/tmp/verify.json'),('zones','/tmp/zones.json')]:
              try: b=json.load(open(path))
              except Exception:
                  print(label+': non-JSON response')
                  continue
              errors=b.get('errors') or []
              safe=[]
              for e in errors[:3]:
                  safe.append({'code':e.get('code'),'message':e.get('message')})
              print(f'{label}: success={b.get("success")} errors={safe} result_count={len(b.get("result") or []) if isinstance(b.get("result"),list) else "n/a"}')
          PY
