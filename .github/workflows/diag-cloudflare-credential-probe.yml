name: Diagnose Cloudflare Credential

on:
  push:
    branches:
      - 'diag/coolify-cbot-runtime'
    paths:
      - '.github/workflows/diag-cloudflare-credential-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CANDIDATE_DNS: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
      CANDIDATE_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANDIDATE_CF_API: ${{ secrets.CF_API_TOKEN }}
      CANDIDATE_CF_DNS: ${{ secrets.CF_DNS_API_TOKEN }}
      CANDIDATE_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CANDIDATE_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CANDIDATE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CANDIDATE_CF_EMAIL: ${{ secrets.CF_API_EMAIL }}
    steps:
      - name: Inspect credential shapes and validate bearer candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          names=['CANDIDATE_DNS','CANDIDATE_API','CANDIDATE_CF_API','CANDIDATE_CF_DNS','CANDIDATE_KEY','CANDIDATE_GLOBAL_KEY','CANDIDATE_EMAIL','CANDIDATE_CF_EMAIL']
          for name in names:
              v=os.environ.get(name,'')
              if not v:
                  print(f'{name}: MISSING')
                  continue
              print(f'{name}: SET length={len(v)} whitespace={any(c.isspace() for c in v)} bearer_prefix={v.lower().startswith("bearer ")} quote_wrapped={(len(v)>=2 and v[0] in chr(34)+chr(39) and v[-1]==v[0])}')
          PY

          verify_bearer() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then return 0; fi
            code="$(curl -sS -o "/tmp/${name}.json" -w '%{http_code}' \
              https://api.cloudflare.com/client/v4/user/tokens/verify \
              -H "Authorization: Bearer $value" -H 'Content-Type: application/json')"
            success="$(python - "/tmp/${name}.json" <<'PY'
          import json,sys
          try: b=json.load(open(sys.argv[1])); print('yes' if b.get('success') and b.get('result',{}).get('status')=='active' else 'no')
          except Exception: print('no')
          PY
          )"
            echo "$name bearer verify: HTTP $code active=$success"
          }

          verify_bearer CANDIDATE_DNS "$CANDIDATE_DNS"
          verify_bearer CANDIDATE_API "$CANDIDATE_API"
          verify_bearer CANDIDATE_CF_API "$CANDIDATE_CF_API"
          verify_bearer CANDIDATE_CF_DNS "$CANDIDATE_CF_DNS"

      - name: Validate global-key candidates only if email is available
        shell: bash
        run: |
          set -euo pipefail
          email="${CANDIDATE_EMAIL:-${CANDIDATE_CF_EMAIL:-}}"
          if [ -z "$email" ]; then echo 'Global-key auth: no email candidate available'; exit 0; fi
          check_key() {
            name="$1"; key="$2"
            if [ -z "$key" ]; then return 0; fi
            code="$(curl -sS -o "/tmp/${name}-global.json" -w '%{http_code}' \
              'https://api.cloudflare.com/client/v4/zones?name=mkety.com&status=active' \
              -H "X-Auth-Email: $email" -H "X-Auth-Key: $key" -H 'Content-Type: application/json')"
            success="$(python - "/tmp/${name}-global.json" <<'PY'
          import json,sys
          try: b=json.load(open(sys.argv[1])); print('yes' if b.get('success') and len(b.get('result') or [])>0 else 'no')
          except Exception: print('no')
          PY
          )"
            echo "$name global-key verify: HTTP $code zone_access=$success"
          }
          check_key CANDIDATE_KEY "$CANDIDATE_KEY"
          check_key CANDIDATE_GLOBAL_KEY "$CANDIDATE_GLOBAL_KEY"
