name: Temporary Production Broker Secret Discovery

on:
  push:
    branches:
      - diag/production-broker-secret-discovery
    paths:
      - '.github/workflows/temporary-production-broker-secret-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    env:
      S_CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      S_CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      S_CBOT_TOKEN_SIGNING_KEY: ${{ secrets.CBOT_TOKEN_SIGNING_KEY }}
      S_CBOT_CONTROL_SECRET: ${{ secrets.CBOT_CONTROL_SECRET }}
      S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S_COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      S_COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Report production secret names without exposing values
        shell: bash
        run: |
          set -euo pipefail
          present() { [[ -n "${!1:-}" ]] && printf '%s=SET\n' "$1" || printf '%s=UNSET\n' "$1"; }
          for name in S_CTRADER_CLIENT_ID S_CTRADER_CLIENT_SECRET S_CBOT_TOKEN_SIGNING_KEY S_CBOT_CONTROL_SECRET S_CLOUDFLARE_API_TOKEN S_CLOUDFLARE_ACCOUNT_ID S_COOLIFY_URL S_COOLIFY_TOKEN; do
            present "$name"
          done

      - name: Discover gateway and broker key names in Coolify without printing values
        if: ${{ env.S_COOLIFY_URL != '' && env.S_COOLIFY_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          root="${S_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          auth=(-H "Authorization: Bearer $S_COOLIFY_TOKEN" -H 'Accept: application/json')
          curl -fsS --retry 3 --retry-all-errors "${auth[@]}" "$api/applications" > "$RUNNER_TEMP/apps.json"
          APPS="$RUNNER_TEMP/apps.json" node <<'NODE' > "$RUNNER_TEMP/app-uuids.txt"
          const fs=require('fs');
          const apps=JSON.parse(fs.readFileSync(process.env.APPS,'utf8')||'[]');
          for(const a of Array.isArray(apps)?apps:[]) if(a?.uuid) console.log(a.uuid);
          console.error(`COOLIFY_APPLICATION_COUNT=${Array.isArray(apps)?apps.length:0}`);
          NODE
          found_gateway=0
          found_cbot_sign=0
          found_cbot_control=0
          found_ctrader_id=0
          found_ctrader_secret=0
          while IFS= read -r uuid; do
            [ -n "$uuid" ] || continue
            code="$(curl -sS -o "$RUNNER_TEMP/envs.json" -w '%{http_code}' "${auth[@]}" "$api/applications/$uuid/envs")"
            [ "$code" = 200 ] || continue
            FLAGS="$RUNNER_TEMP/flags.env" ENVS="$RUNNER_TEMP/envs.json" APP_UUID="$uuid" node <<'NODE'
          const fs=require('fs');
          const envs=JSON.parse(fs.readFileSync(process.env.ENVS,'utf8')||'[]');
          const keys=new Set((Array.isArray(envs)?envs:[]).map(x=>String(x.key||'')));
          const interesting=['CBOT_PUBLIC_HOST','CBOT_TOKEN_SIGNING_KEY','CBOT_CONTROL_SECRET','CTRADER_CLIENT_ID','CTRADER_CLIENT_SECRET'];
          const present=interesting.filter(k=>keys.has(k));
          if(present.length) console.log(`APP_KEYS uuid=${process.env.APP_UUID} keys=${present.join(',')}`);
          fs.writeFileSync(process.env.FLAGS,[
            `gateway=${keys.has('CBOT_PUBLIC_HOST')?1:0}`,
            `sign=${keys.has('CBOT_TOKEN_SIGNING_KEY')?1:0}`,
            `control=${keys.has('CBOT_CONTROL_SECRET')?1:0}`,
            `ctrader_id=${keys.has('CTRADER_CLIENT_ID')?1:0}`,
            `ctrader_secret=${keys.has('CTRADER_CLIENT_SECRET')?1:0}`,
          ].join('\n'));
          NODE
            source "$RUNNER_TEMP/flags.env"
            (( found_gateway += gateway )) || true
            (( found_cbot_sign += sign )) || true
            (( found_cbot_control += control )) || true
            (( found_ctrader_id += ctrader_id )) || true
            (( found_ctrader_secret += ctrader_secret )) || true
          done < "$RUNNER_TEMP/app-uuids.txt"
          echo "COOLIFY_GATEWAY_APP_MATCHES=$found_gateway"
          echo "COOLIFY_CBOT_TOKEN_SIGNING_KEY_MATCHES=$found_cbot_sign"
          echo "COOLIFY_CBOT_CONTROL_SECRET_MATCHES=$found_cbot_control"
          echo "COOLIFY_CTRADER_CLIENT_ID_MATCHES=$found_ctrader_id"
          echo "COOLIFY_CTRADER_CLIENT_SECRET_MATCHES=$found_ctrader_secret"
