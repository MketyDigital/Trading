name: Temporary Production Broker Secret Discovery

on:
  push:
    branches:
      - diag/production-broker-secret-discovery
    paths:
      - '.github/workflows/temporary-production-broker-secret-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    env:
      S_CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      S_CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      S_CBOT_TOKEN_SIGNING_KEY: ${{ secrets.CBOT_TOKEN_SIGNING_KEY }}
      S_CBOT_CONTROL_SECRET: ${{ secrets.CBOT_CONTROL_SECRET }}
      S_COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      S_COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      S_COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
      V_COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      V_COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      V_COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      S_COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      S_COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      S_COOLIFY_ACCESS_TOKEN: ${{ secrets.COOLIFY_ACCESS_TOKEN }}
      S_COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
      S_COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      S_COOLIFY_APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
      S_COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
      S_COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
      V_COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      V_COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      V_COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
      V_COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
    steps:
      - name: Report production access shape without exposing values
        shell: bash
        run: |
          set -euo pipefail
          present() { [[ -n "${!1:-}" ]] && printf '%s=SET\n' "$1" || printf '%s=UNSET\n' "$1"; }
          for name in \
            S_CTRADER_CLIENT_ID S_CTRADER_CLIENT_SECRET S_CBOT_TOKEN_SIGNING_KEY S_CBOT_CONTROL_SECRET \
            S_COOLIFY_URL S_COOLIFY_API_URL S_COOLIFY_BASE_URL V_COOLIFY_URL V_COOLIFY_API_URL V_COOLIFY_BASE_URL \
            S_COOLIFY_TOKEN S_COOLIFY_API_TOKEN S_COOLIFY_ACCESS_TOKEN S_COOLIFY_API_KEY \
            S_COOLIFY_APP_UUID S_COOLIFY_APPLICATION_UUID S_COOLIFY_RESOURCE_UUID S_COOLIFY_SERVICE_UUID \
            V_COOLIFY_APP_UUID V_COOLIFY_APPLICATION_UUID V_COOLIFY_RESOURCE_UUID V_COOLIFY_SERVICE_UUID; do
            present "$name"
          done
          first_set() {
            for name in "$@"; do
              if [[ -n "${!name:-}" ]]; then printf '%s' "${!name}"; return 0; fi
            done
            return 1
          }
          api_url="$(first_set S_COOLIFY_URL S_COOLIFY_API_URL S_COOLIFY_BASE_URL V_COOLIFY_URL V_COOLIFY_API_URL V_COOLIFY_BASE_URL || true)"
          api_token="$(first_set S_COOLIFY_TOKEN S_COOLIFY_API_TOKEN S_COOLIFY_ACCESS_TOKEN S_COOLIFY_API_KEY || true)"
          resource_uuid="$(first_set S_COOLIFY_APP_UUID S_COOLIFY_APPLICATION_UUID S_COOLIFY_RESOURCE_UUID S_COOLIFY_SERVICE_UUID V_COOLIFY_APP_UUID V_COOLIFY_APPLICATION_UUID V_COOLIFY_RESOURCE_UUID V_COOLIFY_SERVICE_UUID || true)"
          [[ -n "$api_url" && -n "$api_token" && -n "$resource_uuid" ]] && echo 'COOLIFY_API_ACCESS=READY' || echo 'COOLIFY_API_ACCESS=INCOMPLETE'
