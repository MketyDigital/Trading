name: Private Repository Readiness Inventory
on:
  push:
    branches:
      - ops/private-readiness-20260919
    paths:
      - ".github/workflows/private-repo-readiness.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
      OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
      OCI_APP_UUID: p9xqtqpbljnggchy36mzd7a0
    steps:
      - name: Inspect OCI Coolify source integration without secrets
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"; [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/applications/$OCI_APP_UUID" > /tmp/app.json
          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/github-apps" > /tmp/apps.json
          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/github-apps/1/repositories" > /tmp/repos.json
          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/github-apps/1/repositories/MketyDigital/Trading/branches" > /tmp/branches.json

          node <<'NODE'
          const app=require('/tmp/app.json');
          const apps=require('/tmp/apps.json');
          const safeApp={
            uuid:app.uuid,
            name:app.name,
            git_repository:app.git_repository,
            git_branch:app.git_branch,
            build_pack:app.build_pack,
            base_directory:app.base_directory,
            docker_compose_location:app.docker_compose_location,
            github_app_uuid:app.github_app_uuid ?? null,
            source_id:app.source_id ?? null,
            source_type:app.source_type ?? null,
          };
          console.log('APP='+JSON.stringify(safeApp));
          console.log('GITHUB_APPS='+JSON.stringify((Array.isArray(apps)?apps:[]).map(x=>({
            id:x.id,uuid:x.uuid,name:x.name,organization:x.organization,
            installation_id:x.installation_id,is_public:x.is_public,type:x.type
          }))));
          const repos=require('/tmp/repos.json');
          const branches=require('/tmp/branches.json');
          const list=Array.isArray(repos?.repositories)?repos.repositories:[];
          const trading=list.filter(r => String(r.full_name||r.name||'').includes('Trading'));
          console.log('PRIVATE_APP_TRADING_REPOS='+JSON.stringify(trading.map(r=>({id:r.id,name:r.name,full_name:r.full_name,private:r.private}))));
          const bs=Array.isArray(branches?.branches)?branches.branches:[];
          console.log('PRIVATE_APP_HAS_MAIN='+bs.some(b=>b.name==='main'));
          NODE


  rebind-and-verify:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
      OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
      OCI_APP_UUID: p9xqtqpbljnggchy36mzd7a0
      PRIVATE_GITHUB_APP_UUID: chvanp2mn8p5msyzifqwywac
    steps:
      - name: Guard current gateway and rebind to private GitHub App
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"; [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"

          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/applications/$OCI_APP_UUID" > /tmp/before.json
          node <<'NODE'
          const a=require('/tmp/before.json');
          if(a.uuid!=='p9xqtqpbljnggchy36mzd7a0') throw new Error('unexpected application');
          if(a.git_repository!=='MketyDigital/Trading') throw new Error('unexpected repository '+a.git_repository);
          if(a.git_branch!=='main') throw new Error('unexpected branch '+a.git_branch);
          if(a.build_pack!=='dockercompose') throw new Error('unexpected build pack '+a.build_pack);
          if(a.docker_compose_location!=='/ctrader-cbot-gateway/deploy/coolify/docker-compose.yml') throw new Error('unexpected compose location');
          console.log('PRE_REBIND_GUARD=PASS');
          NODE

          node - <<'NODE' > /tmp/patch.json
          process.stdout.write(JSON.stringify({
            github_app_uuid: process.env.PRIVATE_GITHUB_APP_UUID,
            git_repository: 'MketyDigital/Trading',
            git_branch: 'main',
            build_pack: 'dockercompose',
            base_directory: '/',
            docker_compose_location: '/ctrader-cbot-gateway/deploy/coolify/docker-compose.yml',
            is_preserve_repository_enabled: false
          }));
          NODE

          http_code="$(curl -sS -o /tmp/patch-result.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/patch.json \
            "$api/applications/$OCI_APP_UUID")"
          if [ "$http_code" != "200" ]; then
            echo "PATCH_HTTP=$http_code"
            node -e "const x=require('/tmp/patch-result.json'); console.log(JSON.stringify({message:x.message||null,errors:x.errors||null}))"
            exit 2
          fi

          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/applications/$OCI_APP_UUID" > /tmp/after.json
          node <<'NODE'
          const a=require('/tmp/after.json');
          const ok =
            a.git_repository==='MketyDigital/Trading' &&
            a.git_branch==='main' &&
            a.build_pack==='dockercompose' &&
            a.docker_compose_location==='/ctrader-cbot-gateway/deploy/coolify/docker-compose.yml' &&
            (a.github_app_uuid==='chvanp2mn8p5msyzifqwywac' || Number(a.source_id)===1);
          if(!ok) throw new Error('private GitHub App rebind did not persist');
          console.log('PRIVATE_SOURCE_REBIND=PASS');
          console.log(JSON.stringify({
            github_app_uuid:a.github_app_uuid??null,
            source_id:a.source_id??null,
            source_type:a.source_type??null,
            repository:a.git_repository,
            branch:a.git_branch
          }));
          NODE

      - name: Redeploy through authenticated source
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"; [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          curl -fsS -X POST             -H "Authorization: Bearer $OCI_COOLIFY_TOKEN"             "$api/applications/$OCI_APP_UUID/start?force=true&instant_deploy=false" > /tmp/deploy.json
          deployment_uuid="$(node -e "const x=require('/tmp/deploy.json'); if(!x.deployment_uuid)process.exit(1); process.stdout.write(String(x.deployment_uuid))")"
          echo "DEPLOYMENT_UUID=$deployment_uuid"

          for i in $(seq 1 80); do
            curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/applications/$OCI_APP_UUID" > /tmp/app.json
            status="$(node -e "const x=require('/tmp/app.json');process.stdout.write(String(x.status||''))")"
            echo "APP_STATUS=$status"
            case "${status,,}" in
              running|running:*) break ;;
              exited|exited:*|failed|failed:*) echo "authenticated-source deploy failed"; exit 3 ;;
            esac
            sleep 5
          done

          curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 20             https://cbot.mkety.com:25345/health > /tmp/health.json
          node -e "const x=require('/tmp/health.json');if(!x.ok)process.exit(1);console.log('PRIVATE_SOURCE_PUBLIC_HEALTH=PASS')"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f /tmp/before.json /tmp/patch.json /tmp/patch-result.json /tmp/after.json /tmp/deploy.json /tmp/app.json /tmp/health.json


  create-private-source-app:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
      OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
      PRIVATE_GITHUB_APP_UUID: chvanp2mn8p5msyzifqwywac
      PROJECT_UUID: xrhsinddvxzghzcxgwux9esj
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      ENVIRONMENT_UUID: ewiwnpz3mow3lko3kiaoznbt
      DESTINATION_UUID: nb5cewtbcimgywinjww047mx
    steps:
      - name: Create or locate authenticated private-source gateway
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"; [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/applications" > /tmp/apps.json
          existing="$(node -e "const xs=require('/tmp/apps.json');const a=(Array.isArray(xs)?xs:[]).find(x=>x.name==='Cbot Tcp gateway private'&&x.git_repository==='MketyDigital/Trading');if(a)process.stdout.write(a.uuid)")"
          if [ -n "$existing" ]; then
            uuid="$existing"
            echo "PRIVATE_APP_REUSED=$uuid"
          else
            node - <<'NODE' > /tmp/create.json
          process.stdout.write(JSON.stringify({
            project_uuid: process.env.PROJECT_UUID,
            server_uuid: process.env.SERVER_UUID,
            environment_uuid: process.env.ENVIRONMENT_UUID,
            destination_uuid: process.env.DESTINATION_UUID,
            github_app_uuid: process.env.PRIVATE_GITHUB_APP_UUID,
            git_repository: 'MketyDigital/Trading',
            git_branch: 'main',
            build_pack: 'dockercompose',
            name: 'Cbot Tcp gateway private',
            description: 'Authenticated private GitHub App source for Mkety shared cTrader + MT5 gateway',
            base_directory: '/',
            docker_compose_location: '/ctrader-cbot-gateway/deploy/coolify/docker-compose.yml',
            instant_deploy: false
          }));
          NODE
            code="$(curl -sS -o /tmp/result.json -w '%{http_code}' -X POST               -H "Authorization: Bearer $OCI_COOLIFY_TOKEN"               -H "Content-Type: application/json"               --data-binary @/tmp/create.json               "$api/applications/private-github-app")"
            if [ "$code" != "201" ]; then
              echo "CREATE_HTTP=$code"
              node -e "const x=require('/tmp/result.json');console.log(JSON.stringify({message:x.message||null,errors:x.errors||null}))"
              exit 2
            fi
            uuid="$(node -e "const x=require('/tmp/result.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"
            echo "PRIVATE_APP_CREATED=$uuid"
          fi
          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" "$api/applications/$uuid" > /tmp/app.json
          node <<'NODE'
          const a=require('/tmp/app.json');
          if(a.git_repository!=='MketyDigital/Trading') throw new Error('repo mismatch');
          if(a.git_branch!=='main') throw new Error('branch mismatch');
          if(a.build_pack!=='dockercompose') throw new Error('build pack mismatch');
          if(a.docker_compose_location!=='/ctrader-cbot-gateway/deploy/coolify/docker-compose.yml') throw new Error('compose path mismatch');
          console.log('PRIVATE_APP_CONTRACT=PASS');
          console.log(JSON.stringify({uuid:a.uuid,name:a.name,status:a.status,source_id:a.source_id??null,source_type:a.source_type??null,github_app_uuid:a.github_app_uuid??null}));
          NODE
