name: Cleanup Private Coolify Clone Probe
on:
  push:
    branches:
      - ops/private-coolify-clone-20260919
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
      OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
      CLONE_UUID: lne867rvcoe635pdul2nhnzw
    steps:
      - name: Delete inactive probe clone only
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"; [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE             -H "Authorization: Bearer $OCI_COOLIFY_TOKEN"             "$api/applications/$CLONE_UUID?delete_configurations=true&delete_volumes=false&docker_cleanup=false&delete_connected_networks=false")"
          [ "$code" = "200" ] || { echo "DELETE_HTTP=$code"; cat /tmp/delete.json; exit 2; }
          echo "PRIVATE_PROBE_CLONE_DELETED=PASS"
