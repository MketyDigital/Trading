name: Private Source Gateway Env Sync

on:
  push:
    branches:
      - ops/private-source-gateway-cutover-20260919

permissions:
  contents: read

concurrency:
  group: private-source-gateway-cutover
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
      OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
      SOURCE_APP_UUID: p9xqtqpbljnggchy36mzd7a0
      TARGET_APP_UUID: wp23orxgfa9py7giponnvcjt
    steps:
      - name: Snapshot current OCI gateway envs in-memory and mask values
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS --retry 3 --retry-all-errors             -H "Authorization: Bearer $OCI_COOLIFY_TOKEN"             "$api/applications/$SOURCE_APP_UUID/envs" > "$RUNNER_TEMP/source-envs.json"

          SOURCE_ENVS="$RUNNER_TEMP/source-envs.json" node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync(process.env.SOURCE_ENVS,'utf8')||'[]');
          const required=[
            'ACME_EMAIL','CBOT_COMMAND_TIMEOUT_MS','CBOT_CONTROL_SECRET',
            'CBOT_PUBLIC_HOST','CBOT_TOKEN_SIGNING_KEY',
            'CLOUDFLARE_DNS_API_TOKEN','MT5_CONNECTOR_COMMAND_TIMEOUT_MS'
          ];
          const prod=new Map();
          for(const row of Array.isArray(rows)?rows:[]){
            if(row?.is_preview===false && required.includes(String(row.key||''))) prod.set(String(row.key),row);
          }
          const missing=required.filter(k=>!prod.has(k));
          if(missing.length) throw new Error('Source missing env keys: '+missing.join(','));
          for(const key of required){
            const value=String(prod.get(key).value??'');
            if(!value) throw new Error('Source env empty: '+key);
            process.stdout.write('::add-mask::'+value.replace(/\r?\n/g,'')+'\n');
          }
          const safe=required.map(key=>{
            const row=prod.get(key);
            return {
              key,
              value:String(row.value??''),
              is_preview:false,
              is_literal:row.is_literal??false,
              is_multiline:row.is_multiline??false,
              is_shown_once:row.is_shown_once??false
            };
          });
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gateway-prod-envs.json',JSON.stringify(safe));
          console.log('SOURCE_GATEWAY_ENV_SNAPSHOT=READY keys='+required.join(','));
          NODE

      - name: Sync envs into staged authenticated-source app
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          endpoint="$api/applications/$TARGET_APP_UUID/envs"

          curl --proto '=https' --tlsv1.2 -fsS             -H "Authorization: Bearer $OCI_COOLIFY_TOKEN"             "$endpoint" > "$RUNNER_TEMP/target-before.json"

          SOURCE="$RUNNER_TEMP/gateway-prod-envs.json" TARGET="$RUNNER_TEMP/target-before.json" node <<'NODE'
          const fs=require('node:fs');
          const source=JSON.parse(fs.readFileSync(process.env.SOURCE,'utf8'));
          const target=JSON.parse(fs.readFileSync(process.env.TARGET,'utf8')||'[]');
          const existing=new Set((Array.isArray(target)?target:[])
            .filter(x=>x?.is_preview===false).map(x=>String(x.key||'')));
          fs.mkdirSync(process.env.RUNNER_TEMP+'/env-payloads',{recursive:true});
          const manifest=[];
          source.forEach((row,i)=>{
            const body={
              key:row.key,value:row.value,is_preview:false,
              is_literal:row.is_literal,is_multiline:row.is_multiline,
              is_shown_once:row.is_shown_once
            };
            const path=process.env.RUNNER_TEMP+'/env-payloads/'+i+'.json';
            fs.writeFileSync(path,JSON.stringify(body));
            manifest.push({key:row.key,path,method:existing.has(row.key)?'PATCH':'POST'});
          });
          fs.writeFileSync(process.env.RUNNER_TEMP+'/env-manifest.json',JSON.stringify(manifest));
          NODE

          count="$(node -e "const x=require(process.env.RUNNER_TEMP+'/env-manifest.json');process.stdout.write(String(x.length))")"
          for i in $(seq 0 $((count-1))); do
            key="$(I="$i" node -e "const x=require(process.env.RUNNER_TEMP+'/env-manifest.json');process.stdout.write(x[Number(process.env.I)].key)")"
            file="$(I="$i" node -e "const x=require(process.env.RUNNER_TEMP+'/env-manifest.json');process.stdout.write(x[Number(process.env.I)].path)")"
            method="$(I="$i" node -e "const x=require(process.env.RUNNER_TEMP+'/env-manifest.json');process.stdout.write(x[Number(process.env.I)].method)")"
            code="$(curl --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/env-response-$i.json" -w '%{http_code}'               -X "$method" -H "Authorization: Bearer $OCI_COOLIFY_TOKEN"               -H 'Content-Type: application/json' --data-binary @"$file" "$endpoint")"
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              echo "TARGET_ENV_SYNC_FAILED=$key HTTP=$code"
              exit 4
            fi
            echo "TARGET_ENV_SYNCED=$key"
          done

          curl --proto '=https' --tlsv1.2 -fsS             -H "Authorization: Bearer $OCI_COOLIFY_TOKEN"             "$endpoint" > "$RUNNER_TEMP/target-after.json"

          SOURCE="$RUNNER_TEMP/gateway-prod-envs.json" TARGET="$RUNNER_TEMP/target-after.json" node <<'NODE'
          const fs=require('node:fs');
          const source=JSON.parse(fs.readFileSync(process.env.SOURCE,'utf8'));
          const rows=JSON.parse(fs.readFileSync(process.env.TARGET,'utf8')||'[]');
          const target=new Map((Array.isArray(rows)?rows:[])
            .filter(x=>x?.is_preview===false).map(x=>[String(x.key||''),x]));
          for(const s of source){
            const t=target.get(s.key);
            if(!t) throw new Error('Target env missing: '+s.key);
            if(String(t.value??'')!==String(s.value??'')) throw new Error('Target env mismatch: '+s.key);
            if(Boolean(t.is_literal)!==Boolean(s.is_literal)) throw new Error('Target literal flag mismatch: '+s.key);
          }
          console.log('PRIVATE_SOURCE_GATEWAY_ENV_EXACT_MATCH=PASS');
          NODE

      - name: Confirm staged private-source app remains stopped
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          curl -fsS -H "Authorization: Bearer $OCI_COOLIFY_TOKEN"             "$api/applications/$TARGET_APP_UUID" > "$RUNNER_TEMP/target-app.json"
          status="$(node -e "const x=require(process.env.RUNNER_TEMP+'/target-app.json');process.stdout.write(String(x.status||''))")"
          echo "PRIVATE_SOURCE_APP_STATUS=$status"
          case "${status,,}" in
            running|running:*) echo "Staged app unexpectedly running"; exit 5 ;;
            *) ;;
          esac

      - name: Cleanup temporary secret-bearing files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/source-envs.json" "$RUNNER_TEMP/gateway-prod-envs.json"             "$RUNNER_TEMP/env-payloads" "$RUNNER_TEMP/env-manifest.json"             "$RUNNER_TEMP/target-before.json" "$RUNNER_TEMP/target-after.json"             "$RUNNER_TEMP"/env-response-*.json "$RUNNER_TEMP/target-app.json"
