name: Diagnose Azure Credential Availability

on:
  push:
    branches:
      - 'diag/coolify-cbot-runtime'
    paths:
      - '.github/workflows/diag-azure-credential-availability.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AZURE_CREDENTIALS_VALUE: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_CLIENT_ID_VALUE: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID_VALUE: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID_VALUE: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET_VALUE: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_CLIENT_ID_VALUE: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID_VALUE: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID_VALUE: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET_VALUE: ${{ secrets.ARM_CLIENT_SECRET }}
    steps:
      - name: Report credential names only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          for name in [
            'AZURE_CREDENTIALS_VALUE','AZURE_CLIENT_ID_VALUE','AZURE_TENANT_ID_VALUE','AZURE_SUBSCRIPTION_ID_VALUE','AZURE_CLIENT_SECRET_VALUE',
            'ARM_CLIENT_ID_VALUE','ARM_TENANT_ID_VALUE','ARM_SUBSCRIPTION_ID_VALUE','ARM_CLIENT_SECRET_VALUE'
          ]:
            v=os.environ.get(name,'')
            print(name.replace('_VALUE','')+': '+('AVAILABLE' if v else 'MISSING'))
          PY
