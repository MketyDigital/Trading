name: Audit Coolify cBot Environment Placeholders

on:
  push:
    branches: ['diag/coolify-cbot-runtime']
    paths: ['.github/workflows/diag-coolify-env-placeholder-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: staging
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      GH_CBOT_SIGNING: ${{ secrets.CBOT_TOKEN_SIGNING_KEY }}
      GH_CBOT_CONTROL: ${{ secrets.CBOT_CONTROL_SECRET }}
      GH_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit values without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}"; case "$base" in */api/v1) api="$base";; *) api="$base/api/v1";; esac
          curl -fsS "$api/applications" -H "Authorization: Bearer $COOLIFY_TOKEN" > /tmp/apps.json
          uuid="$(python - <<'PY'
          import json
          apps=json.load(open('/tmp/apps.json'))
          rows=[a for a in apps if str(a.get('git_repository') or '').lower()=='mketydigital/trading' and 'ctrader-cbot-gateway/deploy/coolify/docker-compose.yml' in str(a.get('docker_compose_location') or '').lower()]
          if len(rows)!=1: raise SystemExit(f'Expected one app, found {len(rows)}')
          print(rows[0]['uuid'])
          PY
          )"
          curl -fsS "$api/applications/$uuid/envs" -H "Authorization: Bearer $COOLIFY_TOKEN" > /tmp/envs.json
          python - <<'PY'
          import json,os
          envs=json.load(open('/tmp/envs.json'))
          by={e.get('key'):e for e in envs}
          keys=['CBOT_PUBLIC_HOST','ACME_EMAIL','CLOUDFLARE_DNS_API_TOKEN','CBOT_TOKEN_SIGNING_KEY','CBOT_CONTROL_SECRET','CBOT_COMMAND_TIMEOUT_MS']
          print('Coolify cBot environment audit:')
          for k in keys:
              e=by.get(k)
              v=(e or {}).get('real_value') or (e or {}).get('value') or ''
              state='MISSING' if not v else ('PLACEHOLDER_REQUIRED' if v=='required' else 'SET_NONPLACEHOLDER')
              print(f'  {k}: {state}; length={len(v) if v else 0}; literal={(e or {}).get("is_literal")}; runtime={(e or {}).get("is_runtime")}')
          print('GitHub environment cBot secret availability:')
          for k,envname in [('CBOT_TOKEN_SIGNING_KEY','GH_CBOT_SIGNING'),('CBOT_CONTROL_SECRET','GH_CBOT_CONTROL'),('CLOUDFLARE_API_TOKEN','GH_CLOUDFLARE')]:
              v=os.environ.get(envname,'')
              print(f'  {k}: {"AVAILABLE" if v else "MISSING"}; length={len(v) if v else 0}')
          PY
