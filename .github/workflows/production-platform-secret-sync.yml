name: Production Platform Secret Sync

on:
  workflow_run:
    workflows:
      - Production Cloudflare Deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-trading-production-platform-secrets
  cancel-in-progress: false

jobs:
  sync-platform-secrets:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CBOT_TOKEN_SIGNING_KEY: ${{ secrets.CBOT_TOKEN_SIGNING_KEY }}
      CBOT_CONTROL_SECRET: ${{ secrets.CBOT_CONTROL_SECRET }}
      TRADING_WORKER_SCRIPT_NAME: mkety-copier-engine

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate platform secret pairs without printing values
        shell: bash
        run: |
          set -euo pipefail
          require_pair() {
            local label="$1" left_name="$2" right_name="$3" left="$4" right="$5"
            if { [ -n "$left" ] && [ -z "$right" ]; } || { [ -z "$left" ] && [ -n "$right" ]; }; then
              echo "$label production configuration is partial; configure $left_name and $right_name together." >&2
              exit 1
            fi
            if [ -z "$left" ] && [ -z "$right" ]; then
              echo "$label production configuration is absent." >&2
              exit 1
            fi
          }
          require_pair "cTrader Direct" CTRADER_CLIENT_ID CTRADER_CLIENT_SECRET "$CTRADER_CLIENT_ID" "$CTRADER_CLIENT_SECRET"
          require_pair "Shared cTrader/MT5 gateway" CBOT_TOKEN_SIGNING_KEY CBOT_CONTROL_SECRET "$CBOT_TOKEN_SIGNING_KEY" "$CBOT_CONTROL_SECRET"

      - name: Synchronize platform secrets into the existing Worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const payload = {
            CTRADER_CLIENT_ID: process.env.CTRADER_CLIENT_ID,
            CTRADER_CLIENT_SECRET: process.env.CTRADER_CLIENT_SECRET,
            CBOT_TOKEN_SIGNING_KEY: process.env.CBOT_TOKEN_SIGNING_KEY,
            CBOT_CONTROL_SECRET: process.env.CBOT_CONTROL_SECRET,
          };
          for (const [name, value] of Object.entries(payload)) {
            if (!value) throw new Error(`Missing required platform secret: ${name}`);
          }
          const target = path.join(process.env.RUNNER_TEMP, 'mkety-platform-secrets.json');
          fs.writeFileSync(target, JSON.stringify(payload), { mode: 0o600 });
          NODE
          npx wrangler secret bulk "$RUNNER_TEMP/mkety-platform-secrets.json" --name "$TRADING_WORKER_SCRIPT_NAME"

      - name: Verify required secret bindings exist by name only
        shell: bash
        run: |
          set -euo pipefail
          bindings="$RUNNER_TEMP/mkety-secret-bindings.json"
          npx wrangler secret list --name "$TRADING_WORKER_SCRIPT_NAME" > "$bindings"
          BINDINGS_FILE="$bindings" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.BINDINGS_FILE, 'utf8'));
          const names = new Set((Array.isArray(body) ? body : body.result || []).map((row) => String(row.name || row.key || '')));
          for (const required of ['CTRADER_CLIENT_ID', 'CTRADER_CLIENT_SECRET', 'CBOT_TOKEN_SIGNING_KEY', 'CBOT_CONTROL_SECRET']) {
            if (!names.has(required)) throw new Error(`Worker secret binding missing after sync: ${required}`);
          }
          console.log('Required cTrader Direct and shared gateway Worker secret bindings are present.');
          NODE

      - name: Probe production health after secret synchronization
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/production-health-after-secret-sync.json"
          status="$(curl -sS -o "$body" -w '%{http_code}' https://trade.mkety.com/api/v1/health)"
          if [ "$status" != "200" ]; then
            cat "$body" >&2
            exit 1
          fi
          cat "$body"

      - name: Remove temporary secret material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mkety-platform-secrets.json" "$RUNNER_TEMP/mkety-secret-bindings.json"
