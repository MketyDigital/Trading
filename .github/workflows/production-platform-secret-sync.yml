name: Production Platform Configuration Verification

on:
  workflow_run:
    workflows:
      - Production Cloudflare Deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-trading-production-platform-verification
  cancel-in-progress: false

jobs:
  verify-worker-broker-bindings:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_WORKER_SCRIPT_NAME: mkety-copier-engine

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify required Worker broker secret bindings by name only
        shell: bash
        run: |
          set -euo pipefail
          bindings="$RUNNER_TEMP/mkety-worker-secret-bindings.json"
          npx wrangler secret list --name "$TRADING_WORKER_SCRIPT_NAME" > "$bindings"
          BINDINGS_FILE="$bindings" node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.BINDINGS_FILE, 'utf8'));
          const rows = Array.isArray(body) ? body : body.result || [];
          const names = new Set(rows.map((row) => String(row.name || row.key || '')));
          for (const required of ['CTRADER_CLIENT_ID', 'CTRADER_CLIENT_SECRET', 'CBOT_TOKEN_SIGNING_KEY', 'CBOT_CONTROL_SECRET']) {
            if (!names.has(required)) throw new Error(`Worker broker secret binding missing after deploy: ${required}`);
          }
          console.log('Required cTrader Direct and shared gateway Worker secret bindings are present.');
          NODE

      - name: Probe production Worker health after binding verification
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/production-health-after-binding-check.json"
          status="$(curl -sS -o "$body" -w '%{http_code}' https://trade.mkety.com/api/v1/health)"
          test "$status" = "200"
          BODY="$body" node <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.env.BODY,'utf8'));
          if(!b.ok || !b.ready) throw new Error('production Worker is not ready');
          console.log(`WORKER_HEALTH=PASS service=${b.service || 'unknown'}`);
          NODE

      - name: Remove temporary binding metadata
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mkety-worker-secret-bindings.json" "$RUNNER_TEMP/production-health-after-binding-check.json"

  verify-shared-gateway-configuration:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    environment: production
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PUBLIC_GATEWAY: cbot.mkety.com

    steps:
      - name: Require Coolify access without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COOLIFY_URL" || { echo 'Missing production Coolify URL'; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo 'Missing production Coolify token'; exit 1; }
          echo 'COOLIFY_ACCESS=READY'

      - name: Verify shared gateway application has required secret keys by name only
        shell: bash
        run: |
          set -euo pipefail
          root="${COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json')
          curl -fsS --retry 3 --retry-all-errors "${auth[@]}" "$api/applications" > "$RUNNER_TEMP/apps.json"
          APPS="$RUNNER_TEMP/apps.json" node <<'NODE' > "$RUNNER_TEMP/gateway-candidates.txt"
          const fs=require('node:fs');
          const apps=JSON.parse(fs.readFileSync(process.env.APPS,'utf8')||'[]');
          const matches=(Array.isArray(apps)?apps:[]).filter((a)=>{
            const text=[a.name,a.description,a.fqdn,a.git_repository,a.git_full_url,a.base_directory,a.docker_compose_location].filter(Boolean).join(' ').toLowerCase();
            return text.includes('cbot.mkety.com') || (text.includes('mkety') && (text.includes('cbot') || text.includes('gateway'))) || (text.includes('mketydigital/trading') && text.includes('ctrader-cbot-gateway'));
          });
          if(matches.length !== 1) throw new Error(`Expected exactly one Mkety gateway application, found ${matches.length}`);
          process.stdout.write(String(matches[0].uuid));
          NODE
          uuid="$(cat "$RUNNER_TEMP/gateway-candidates.txt")"
          test -n "$uuid"
          curl -fsS --retry 3 --retry-all-errors "${auth[@]}" "$api/applications/$uuid/envs" > "$RUNNER_TEMP/gateway-envs.json"
          ENVS="$RUNNER_TEMP/gateway-envs.json" node <<'NODE'
          const fs=require('node:fs');
          const envs=JSON.parse(fs.readFileSync(process.env.ENVS,'utf8')||'[]');
          const keys=new Set((Array.isArray(envs)?envs:[]).map((row)=>String(row.key||'')));
          for(const required of ['CBOT_PUBLIC_HOST','CBOT_TOKEN_SIGNING_KEY','CBOT_CONTROL_SECRET']) {
            if(!keys.has(required)) throw new Error(`Coolify gateway environment key missing: ${required}`);
          }
          console.log('COOLIFY_GATEWAY_REQUIRED_KEYS=PASS');
          NODE

      - name: Verify public gateway health and both WebSocket routes
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 20 "https://$PUBLIC_GATEWAY:25345/health")"
          BODY="$body" node -e "const b=JSON.parse(process.env.BODY);if(!b.ok)process.exit(1);console.log('PUBLIC_GATEWAY_HEALTH=PASS')"
          mkdir -p "$RUNNER_TEMP/wsprobe"
          cd "$RUNNER_TEMP/wsprobe"
          npm init -y >/dev/null 2>&1
          npm install --silent ws@8
          PUBLIC_GATEWAY="$PUBLIC_GATEWAY" node <<'NODE'
          const WebSocket=require('ws');
          async function probe(path){
            return new Promise((resolve,reject)=>{
              const ws=new WebSocket(`wss://${process.env.PUBLIC_GATEWAY}:25345${path}`);
              let opened=false;
              const timer=setTimeout(()=>reject(new Error(`${path} timeout`)),12000);
              ws.on('open',()=>{opened=true;});
              ws.on('error',reject);
              ws.on('close',(code,reason)=>{
                clearTimeout(timer);
                const why=String(reason||'');
                if(!opened) return reject(new Error(`${path} never upgraded`));
                if(code!==1008 || why!=='AUTH_REQUIRED') return reject(new Error(`${path} unexpected close=${code} ${why}`));
                console.log(`${path}=PASS`);
                resolve();
              });
            });
          }
          (async()=>{await probe('/v1/cbot');await probe('/v1/mt5');})().catch((e)=>{console.error(e);process.exit(1);});
          NODE

      - name: Remove temporary gateway metadata
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/apps.json" "$RUNNER_TEMP/gateway-candidates.txt" "$RUNNER_TEMP/gateway-envs.json"
