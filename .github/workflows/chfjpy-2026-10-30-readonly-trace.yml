name: CHFJPY 2026-10-30 D1 Read-only Incident Trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read CHFJPY event and execution evidence (no writes, no orders)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw Error('Cloudflare credentials unavailable');
          const config = fs.readFileSync('cloudflare-v2/wrangler.toml','utf8');
          const block = config.match(/\[\[d1_databases\]\]([\s\S]*?)(?=\n\[\[|$)/)?.[1] || '';
          const name = block.match(/database_name\s*=\s*"([^"]+)"/)?.[1];
          const id = block.match(/database_id\s*=\s*"([^"]+)"/)?.[1];
          if(name !== 'trading-staging' || !/^[0-9a-f-]{36}$/i.test(id||'')) throw Error('D1 binding mismatch');
          const start='2026-10-30 01:20:00', end='2026-10-30 01:40:00';
          const symbol="upper(coalesce(json_extract(e.canonical_intent,'$.symbol.canonical'),json_extract(e.canonical_intent,'$.symbol'),''))";
          const match="(instr("+symbol+",'CHFJPY')>0 OR instr(upper(coalesce(e.raw_text,'')),'CHFJPY')>0 OR instr(upper(coalesce(e.raw_text,'')),'CHF/JPY')>0 OR instr(upper(coalesce(e.raw_text,'')),'CHF JPY')>0)";
          const eventBase="FROM trading_events e WHERE e.received_at >= '"+start+"' AND e.received_at < '"+end+"' AND "+match;
          const queries=[
            {label:'EVENTS',sql:"SELECT e.id AS incident_event_key,e.received_at,e.occurred_at,e.processing_status,e.error_code,e.source_type,upper(coalesce(json_extract(e.canonical_intent,'$.side'),'')) AS side,"+symbol+" AS canonical_symbol,CASE WHEN e.canonical_intent IS NULL THEN 0 ELSE 1 END AS has_intent "+eventBase+" ORDER BY e.received_at LIMIT 30"},
            {label:'JOURNAL',sql:"WITH matched AS (SELECT e.id "+eventBase+" LIMIT 30) SELECT j.trading_event_id AS incident_event_key,j.observed_at,j.stage,j.operation,j.status,j.error_code,j.failure_class,j.retryable,upper(coalesce(json_extract(j.details,'$.status'),'')) AS planning_status FROM operation_journal j JOIN matched m ON m.id=j.trading_event_id ORDER BY j.observed_at LIMIT 250"},
            {label:'DELIVERIES',sql:"WITH matched AS (SELECT e.id "+eventBase+" LIMIT 30) SELECT d.trading_event_id AS incident_event_key,d.destination_type,d.status,d.error_code,d.failure_class,d.attempt_count FROM destination_deliveries d JOIN matched m ON m.id=d.trading_event_id LIMIT 100"},
            {label:'GROUPS',sql:"WITH matched AS (SELECT e.id "+eventBase+" LIMIT 30) SELECT g.source_event_id AS incident_event_key,g.canonical_symbol,g.side,g.order_type,g.status,COUNT(l.id) AS legs,SUM(CASE WHEN l.broker_position_id IS NOT NULL OR l.broker_order_id IS NOT NULL THEN 1 ELSE 0 END) AS broker_bound_legs FROM position_groups g LEFT JOIN position_legs l ON l.position_group_id=g.id WHERE g.source_event_id IN (SELECT id FROM matched) GROUP BY g.id LIMIT 100"},
            {label:'WINDOW_COUNTS',sql:"SELECT COUNT(*) AS captured_events,(SELECT COUNT(*) FROM operation_journal WHERE observed_at >= '"+start+"' AND observed_at < '"+end+"') AS journal_entries FROM trading_events WHERE received_at >= '"+start+"' AND received_at < '"+end+"'"}
          ];
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/d1/database/'+encodeURIComponent(id)+'/query',{method:'POST',headers,body:JSON.stringify({batch:queries.map(q=>({sql:q.sql,params:[]}))})});
          if(!response.ok) throw Error('D1 read failed HTTP '+response.status);
          const payload=await response.json();
          if(!payload.success || !Array.isArray(payload.result) || payload.result.length!==queries.length) throw Error('D1 query batch failed');
          const report=['# CHFJPY 2026-10-30 01:20–01:40 UTC','Read-only: no D1 writes or broker actions. Incident event keys are pseudonyms local to this report.'];
          const keys=new Map();let next=1, totalWrites=0;
          for(let i=0;i<queries.length;i++){
            const part=payload.result[i];if(!part.success || !Array.isArray(part.results))throw Error('Failed section '+queries[i].label);
            totalWrites+=Number(part.meta?.rows_written||0);
            report.push('## '+queries[i].label);
            for(const row of part.results){
              const item={...row};
              if(Object.hasOwn(item,'incident_event_key') && item.incident_event_key){
                if(!keys.has(item.incident_event_key)) keys.set(item.incident_event_key,'EVENT_'+next++);
                item.incident_event_key=keys.get(item.incident_event_key);
              }
              report.push(JSON.stringify(item));
            }
            if(!part.results.length)report.push('No rows');
          }
          if(totalWrites!==0)throw Error('Unexpected D1 writes detected');
          report.push('D1_ROWS_WRITTEN=0');
          const output=report.join('\n');
          console.log(output);
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,output+'\n');
          NODE
