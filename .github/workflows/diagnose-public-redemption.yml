name: Diagnose Public Redemption

on:
  push:
    branches: [diag-portal-script-parse]
    paths:
      - '.github/workflows/diagnose-public-redemption.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://trade.mkety.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live portal around browser syntax-error location
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/" -o /tmp/page.html
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/page.html', 'utf8');
          const lines = html.split('\n');
          const lineNumber = 48; // CDP is zero-based: lineNumber 47
          const column = 566;
          const line = lines[lineNumber - 1] || '';
          console.log('TOTAL_LINES=' + lines.length);
          console.log('LINE_LENGTH=' + line.length);
          console.log('CONTEXT=' + JSON.stringify(line.slice(Math.max(0, column - 180), column + 180)));
          console.log('AT_COLUMN=' + JSON.stringify(line.slice(column - 10, column + 20)));
          console.log('CHAR_CODES=' + JSON.stringify([...line.slice(Math.max(0, column - 8), column + 8)].map(c => c.codePointAt(0))));
          NODE
