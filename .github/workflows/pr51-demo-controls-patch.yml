name: PR51 Demo Controls Patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simplify-demo-account-controls
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/pr51_patch.py
      - name: Focused tests
        run: cd cloudflare-v2 && node --test tests/demo_account_control_simplification.test.mjs tests/v1_admin_connections.test.mjs tests/ctrader_custom_hostname_oauth.test.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add cloudflare-v2/src/http/v1_admin_connections.js cloudflare-v2/src/dashboard_unified_connections.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: simplify demo account trading controls'
          git push origin HEAD:feat/simplify-demo-account-controls
