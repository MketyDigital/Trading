name: PR47 Implementation Patch

on:
  push:
    branches:
      - fix/routing-ai-provider-presentation-host-audit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pr47-patcher]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/routing-ai-provider-presentation-host-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded implementation patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  print(f'{label}: already applied')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected source pattern not found')
              p.write_text(text.replace(old, new, 1))
              print(f'{label}: applied')

          path = 'cloudflare-v2/src/http/v1_admin_destinations.js'
          replace_once(
              path,
              "function templateItemMatch(pathname) {\n  return pathname.match(/^\\/api\\/v1\\/admin\\/templates\\/([^/]+)$/);\n}\n\nfunction routeActionMatch(pathname) {",
              "function templateItemMatch(pathname) {\n  return pathname.match(/^\\/api\\/v1\\/admin\\/templates\\/([^/]+)$/);\n}\n\nfunction routeItemMatch(pathname) {\n  return pathname.match(/^\\/api\\/v1\\/admin\\/routes\\/([^/]+)$/);\n}\n\nfunction routeActionMatch(pathname) {",
              'route item matcher',
          )
          replace_once(
              path,
              "    async listTemplates(workspaceId) {",
              "    async removeDestination(workspaceId, id) {\n      const { data, error } = await supabase.from('trading_destinations').delete().eq('workspace_id', String(workspaceId)).eq('id', String(id)).select('id').maybeSingle();\n      if (error) throw new Error('DESTINATION_DELETE_FAILED');\n      return Boolean(data);\n    },\n    async listTemplates(workspaceId) {",
              'destination store delete',
          )
          replace_once(
              path,
              "    async setRouteEnabled(workspaceId, id, enabled) {\n      const { data, error } = await supabase.from('source_destination_routes').update({ is_active: Boolean(enabled) }).eq('workspace_id', String(workspaceId)).eq('id', String(id)).select(ROUTE_SELECT).maybeSingle();\n      if (error) throw new Error('ROUTE_UPDATE_FAILED');\n      return data || null;\n    },\n  };",
              "    async setRouteEnabled(workspaceId, id, enabled) {\n      const { data, error } = await supabase.from('source_destination_routes').update({ is_active: Boolean(enabled) }).eq('workspace_id', String(workspaceId)).eq('id', String(id)).select(ROUTE_SELECT).maybeSingle();\n      if (error) throw new Error('ROUTE_UPDATE_FAILED');\n      return data || null;\n    },\n    async removeRoute(workspaceId, id) {\n      const { data, error } = await supabase.from('source_destination_routes').delete().eq('workspace_id', String(workspaceId)).eq('id', String(id)).select('id').maybeSingle();\n      if (error) throw new Error('ROUTE_DELETE_FAILED');\n      return Boolean(data);\n    },\n  };",
              'route store delete',
          )
          replace_once(
              path,
              "  const destinationItem = destinationItemMatch(url.pathname);\n  if (destinationItem) {\n    if (request.method !== 'PUT') return json({ ok: false, reason: 'METHOD_NOT_ALLOWED' }, 405, { Allow: 'PUT' });\n    if (!can(authorization, 'sources.write')) return json({ ok: false, reason: 'TRADING_PERMISSION_DENIED' }, 403);",
              "  const destinationItem = destinationItemMatch(url.pathname);\n  if (destinationItem) {\n    const id = decodeURIComponent(destinationItem[1]);\n    if (request.method === 'DELETE') {\n      if (!can(authorization, 'sources.write')) return json({ ok: false, reason: 'TRADING_PERMISSION_DENIED' }, 403);\n      try {\n        const removed = await destinationStore.removeDestination(workspaceId, id);\n        if (!removed) return json({ ok: false, reason: 'DESTINATION_NOT_FOUND' }, 404);\n        return json({ ok: true, workspaceId, deleted: true, destinationId: id });\n      } catch {\n        return json({ ok: false, reason: 'DESTINATION_DELETE_FAILED' }, 503);\n      }\n    }\n    if (request.method !== 'PUT') return json({ ok: false, reason: 'METHOD_NOT_ALLOWED' }, 405, { Allow: 'PUT, DELETE' });\n    if (!can(authorization, 'sources.write')) return json({ ok: false, reason: 'TRADING_PERMISSION_DENIED' }, 403);",
              'destination delete handler',
          )
          replace_once(
              path,
              "      const row = await destinationStore.updateDestination(workspaceId, decodeURIComponent(destinationItem[1]), parsed.input);",
              "      const row = await destinationStore.updateDestination(workspaceId, id, parsed.input);",
              'destination update id reuse',
          )
          replace_once(
              path,
              "  const routeAction = routeActionMatch(url.pathname);",
              "  const routeItem = routeItemMatch(url.pathname);\n  if (routeItem) {\n    if (request.method !== 'DELETE') return json({ ok: false, reason: 'METHOD_NOT_ALLOWED' }, 405, { Allow: 'DELETE' });\n    if (!can(authorization, 'sources.write')) return json({ ok: false, reason: 'TRADING_PERMISSION_DENIED' }, 403);\n    const id = decodeURIComponent(routeItem[1]);\n    try {\n      const removed = await destinationStore.removeRoute(workspaceId, id);\n      if (!removed) return json({ ok: false, reason: 'ROUTE_NOT_FOUND' }, 404);\n      return json({ ok: true, workspaceId, deleted: true, routeId: id });\n    } catch {\n      return json({ ok: false, reason: 'ROUTE_DELETE_FAILED' }, 503);\n    }\n  }\n\n  const routeAction = routeActionMatch(url.pathname);",
              'route delete handler',
          )

          replace_once(
              'cloudflare-v2/src/destinations/v1_destination_delivery_stage.js',
              "    emojiStyle: template.emoji_style ?? null,\n    aiTimeoutMs: Number(layout.aiTimeoutMs ?? layout.ai_timeout_ms ?? 500),",
              "    emojiStyle: template.emoji_style ?? null,\n    aiInstructions: text(layout.aiInstructions ?? layout.ai_instructions) || null,\n    aiTimeoutMs: Number(layout.aiTimeoutMs ?? layout.ai_timeout_ms ?? 500),",
              'presentation instruction delivery',
          )
          replace_once(
              'cloudflare-v2/src/destinations/telegram_ai_formatter.js',
              "      brandName: brandName ?? null,\n      style: {",
              "      brandName: brandName ?? null,\n      presentationInstructions: String(presentation.aiInstructions ?? presentation.ai_instructions ?? '').trim() || null,\n      style: {",
              'formatter presentation instructions',
          )

          replace_once(
              'cloudflare-v2/src/v1_entry.js',
              "import { withEnterpriseConnectionEnhancements } from './dashboard_enterprise_enhancements.js';\n",
              "import { withEnterpriseConnectionEnhancements } from './dashboard_enterprise_enhancements.js';\nimport { withRoutingAiCompletion } from './dashboard_routing_ai_completion.js';\n",
              'completion wrapper import',
          )
          replace_once(
              'cloudflare-v2/src/v1_entry.js',
              "        const portal = normalizeEnterprisePortalHtml(withEnterpriseConnectionEnhancements(normalizeEnterprisePortalHtml(renderEnterpriseTradingPortal(env))));",
              "        const portal = normalizeEnterprisePortalHtml(withRoutingAiCompletion(withEnterpriseConnectionEnhancements(normalizeEnterprisePortalHtml(renderEnterpriseTradingPortal(env)))));",
              'completion wrapper integration',
          )

          test_path = Path('cloudflare-v2/tests/routing_ai_product_gaps.test.mjs')
          test = test_path.read_text()
          old_import = "import { withEnterpriseConnectionEnhancements } from '../src/dashboard_enterprise_enhancements.js';\n"
          new_import = old_import + "import { withRoutingAiCompletion } from '../src/dashboard_routing_ai_completion.js';\n"
          if "withRoutingAiCompletion" not in test:
              if old_import not in test:
                  raise SystemExit('test wrapper import pattern not found')
              test = test.replace(old_import, new_import, 1)
          old_call = "  const html = withEnterpriseConnectionEnhancements('<html><body><div id=\"workspaceMessage\"></div></body></html>');"
          new_call = "  const html = withRoutingAiCompletion(withEnterpriseConnectionEnhancements('<html><body><div id=\"workspaceMessage\"></div></body></html>'));"
          if new_call not in test:
              if old_call not in test:
                  raise SystemExit('test wrapper call pattern not found')
              test = test.replace(old_call, new_call, 1)
          test_path.write_text(test)
          PY
      - name: Run targeted regression tests
        run: |
          cd cloudflare-v2
          npm ci
          node --test tests/routing_ai_product_gaps.test.mjs tests/v1_admin_destinations.test.mjs tests/telegram_destination_ai_mode_v1.test.mjs tests/ctrader_custom_hostname_oauth.test.mjs
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-v2/src cloudflare-v2/tests
          git commit -m "fix: complete routing and AI presentation controls [pr47-patcher]"
          git push origin HEAD:fix/routing-ai-provider-presentation-host-audit
