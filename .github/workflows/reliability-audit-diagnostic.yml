name: Reliability Audit Diagnostic

on:
  push:
    branches:
      - 'fix/full-production-reliability-audit'

permissions:
  contents: write

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-production-reliability-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply MTProto onboarding implementation
        run: node .github/scripts/apply-reliability-mtproto-fix.mjs
      - name: Install dependencies
        working-directory: cloudflare-v2
        run: npm install --no-audit --no-fund
      - name: Run focused reliability regressions
        working-directory: cloudflare-v2
        run: node --test tests/secret_box.test.mjs tests/returning_session_runtime_controls.test.mjs tests/external_mtproto_onboarding.test.mjs
      - name: Commit implementation when patched
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'Mkety Reliability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-v2/src/http/v1_admin_sources.js cloudflare-v2/src/dashboard_enterprise_portal.js
          git commit -m 'fix: expose external mtproto onboarding endpoint'
          git push origin HEAD:fix/full-production-reliability-audit
