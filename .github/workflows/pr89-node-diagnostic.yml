name: PR89 Node Test Diagnostic

on:
  pull_request:
    paths:
      - 'cloudflare-v2/**'
      - '.github/workflows/pr89-node-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-test-diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Node tests and capture output
        id: node_tests
        shell: bash
        run: |
          set +e
          npm run test:ci > "$RUNNER_TEMP/node-test-output.log" 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Node test output
        uses: actions/upload-artifact@v4
        with:
          name: pr89-node-test-output
          path: ${{ runner.temp }}/node-test-output.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test failure status
        shell: bash
        run: |
          code='${{ steps.node_tests.outputs.exit_code }}'
          if [ "$code" != '0' ]; then
            echo "Node tests failed with exit code $code. See pr89-node-test-output artifact."
            exit "$code"
          fi
