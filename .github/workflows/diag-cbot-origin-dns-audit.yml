name: Audit cBot Origin and Cloudflare DNS

on:
  push:
    branches:
      - 'diag/coolify-cbot-runtime'
    paths:
      - '.github/workflows/diag-cbot-origin-dns-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: staging
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Resolve wildcard origin used by cBot hostname
        shell: bash
        run: |
          set -euo pipefail
          coolify_host="$(python - <<'PY'
          import os,urllib.parse
          print(urllib.parse.urlparse(os.environ['COOLIFY_URL']).hostname or '')
          PY
          )"
          test -n "$coolify_host" || { echo 'Unable to parse COOLIFY_URL host'; exit 1; }

          code="$(curl -sS -o /tmp/zones.json -w '%{http_code}' 'https://api.cloudflare.com/client/v4/zones?name=mkety.com&status=active' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          test "$code" = 200 || { echo "Cloudflare zone lookup HTTP $code"; exit 1; }
          zone_id="$(python - <<'PY'
          import json
          b=json.load(open('/tmp/zones.json')); rows=b.get('result') or []
          if len(rows)!=1: raise SystemExit('Expected one mkety.com zone')
          print(rows[0]['id'])
          PY
          )"

          code="$(curl -sS -o /tmp/dns-all.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=500" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          test "$code" = 200 || { echo "Cloudflare DNS list HTTP $code"; exit 1; }
          COOLIFY_HOST="$coolify_host" python - <<'PY'
          import json,os
          b=json.load(open('/tmp/dns-all.json')); rows=b.get('result') or []
          host=os.environ['COOLIFY_HOST'].lower()
          print('Relevant DNS records:')
          keep=[]
          for r in rows:
              name=str(r.get('name') or '').lower()
              content=str(r.get('content') or '')
              if name in {'*.mkety.com','cbot.mkety.com',host} or name.startswith('coolify.') or 'azure' in content.lower():
                  keep.append(r)
          if not keep:
              print('  none matched')
          for r in keep:
              print('  id=',r.get('id'),'name=',r.get('name'),'type=',r.get('type'),'content=',r.get('content'),'proxied=',r.get('proxied'),'ttl=',r.get('ttl'))
          PY
