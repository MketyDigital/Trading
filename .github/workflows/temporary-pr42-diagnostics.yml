name: Temporary PR42 Diagnostics

on:
  push:
    branches:
      - feat/telegram-bot-source-ai-fallback

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run every Node test independently
        shell: bash
        run: |
          failed=0
          for file in tests/*.test.mjs; do
            echo "=== $file ==="
            log="$RUNNER_TEMP/$(basename "$file").log"
            if node --test "$file" >"$log" 2>&1; then
              echo "PASS $file"
            else
              echo "::error file=$file,title=FAILED_TEST::$file"
              cat "$log"
              failed=1
            fi
          done
          exit "$failed"
