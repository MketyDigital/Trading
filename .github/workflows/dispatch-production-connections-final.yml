name: Dispatch Production Connections Final E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-production-connections-final.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production frontend E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-frontend-e2e.yml --repo "${{ github.repository }}"
