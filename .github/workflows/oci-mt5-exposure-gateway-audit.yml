name: OCI MT5 Exposure Gateway Deployment Audit (Read Only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oci-mt5-exposure-gateway-audit.yml'

permissions:
  contents: read

jobs:
  inspect-active-oci-gateway:
    name: Inspect active OCI gateway without mutations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      OCI_COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
      OCI_COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
      EXPECTED_APP_UUID: wp23orxgfa9py7giponnvcjt
      REQUIRED_EXPOSURE_COMMIT: a94013778aedfee29f373f362c32b2396102cead
    steps:
      - name: Read active application metadata (GET only, sanitized)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OCI_COOLIFY_URL:-}" || { echo 'OCI_COOLIFY_URL is not configured'; exit 1; }
          test -n "${OCI_COOLIFY_TOKEN:-}" || { echo 'OCI_COOLIFY_TOKEN is not configured'; exit 1; }
          root="${OCI_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          body="$RUNNER_TEMP/oci-gateway-audit.json"
          trap 'rm -f "$body"' EXIT
          # Only authenticated metadata GETs. Never print raw API JSON, headers, credentials or env values.
          code="$(curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            --connect-timeout 10 --max-time 35 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$api/applications/$EXPECTED_APP_UUID")"
          echo "OCI_COOLIFY_APPLICATION_HTTP=$code"
          APP_METADATA_PATH="$body" node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync(process.env.APP_METADATA_PATH, 'utf8'));
          const app = response.application ?? response.data ?? response.result ?? response;
          const string = value => typeof value === 'string' ? value : '';
          const uuid = string(app.uuid);
          if (uuid !== process.env.EXPECTED_APP_UUID) throw new Error('Active Coolify application UUID mismatch');
          const revisionCandidates = [
            app.git_commit_sha, app.commit_sha, app.current_commit, app.last_deployed_commit,
            app.latest_deployment?.commit, app.latest_deployment?.commit_sha,
            app.latest_deployment?.git_commit_sha,
          ].map(string).filter(Boolean);
          const safe = {
            applicationUuid: uuid,
            applicationName: string(app.name),
            status: string(app.status),
            gitBranch: string(app.git_branch),
            buildPack: string(app.build_pack),
            configuredRevision: revisionCandidates[0] || null,
            configuredRevisionFields: revisionCandidates.length,
          };
          console.log('ACTIVE_OCI_GATEWAY_METADATA=' + JSON.stringify(safe));
          const expected = process.env.REQUIRED_EXPOSURE_COMMIT;
          if (!revisionCandidates.length) {
            console.log('DEPLOYED_EXPOSURE_REVISION=UNKNOWN (application API omitted commit fields; inspect deployment record/image)');
          } else if (revisionCandidates.some(x => x === expected || x.startsWith(expected.slice(0, 10)))) {
            console.log('DEPLOYED_EXPOSURE_REVISION=REPORTED_REQUIRED_COMMIT (still verify running image)');
          } else {
            console.log('DEPLOYED_EXPOSURE_REVISION=UNVERIFIED_OTHER_COMMIT (check ancestry/build and active container)');
          }
          NODE
      - name: Inspect latest deployments of active application (GET only, sanitized)
        shell: bash
        run: |
          set -euo pipefail
          root="${OCI_COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          body="$RUNNER_TEMP/oci-gateway-deployments.json"
          trap 'rm -f "$body"' EXIT
          code="$(curl --proto '=https' --tlsv1.2 -sS \
            --connect-timeout 10 --max-time 35 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $OCI_COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$api/deployments/applications/$EXPECTED_APP_UUID?take=12")"
          echo "OCI_GATEWAY_DEPLOYMENTS_HTTP=$code"
          if [ "$code" != '200' ]; then
            echo 'OCI_GATEWAY_DEPLOYMENTS=UNAVAILABLE'
            exit 0
          fi
          DEPLOYMENTS_PATH="$body" node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.env.DEPLOYMENTS_PATH,'utf8'));
          const data = Array.isArray(raw) ? raw : raw.data ?? raw.deployments ?? [];
          if (!Array.isArray(data)) throw new Error('Unexpected deployments response');
          const safe = data.slice(0,12).map((d) => ({
            deploymentUuid: typeof d.deployment_uuid === 'string' ? d.deployment_uuid : (typeof d.uuid === 'string' ? d.uuid : null),
            commit: typeof d.commit === 'string' ? d.commit : (typeof d.git_commit_sha === 'string' ? d.git_commit_sha : null),
            status: typeof d.status === 'string' ? d.status : null,
            createdAt: typeof d.created_at === 'string' ? d.created_at : null,
            updatedAt: typeof d.updated_at === 'string' ? d.updated_at : null,
          }));
          console.log('OCI_GATEWAY_DEPLOYMENT_HISTORY=' + JSON.stringify(safe));
          const succeeded = safe.filter(d => /finished|success|completed/i.test(d.status || ''));
          if (!succeeded.length) console.log('LAST_SUCCESSFUL_GATEWAY_DEPLOYMENT=UNKNOWN');
          else console.log('LAST_SUCCESSFUL_GATEWAY_DEPLOYMENT=' + JSON.stringify(succeeded[0]));
          NODE
      - name: Verify authenticated FBS exposure context (GET only, no order)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const target = '5fd04cbf-fb82-4ca3-a9e1-cda6adbe4f51';
          const expectedNumber = '110664480', expectedServer = 'FBS-Real';
          const root = String(process.env.OCI_COOLIFY_URL || '').replace(/\/$/, '');
          const base = root.endsWith('/api/v1') ? root : root + '/api/v1';
          const apiToken = String(process.env.OCI_COOLIFY_TOKEN || '');
          const timeout = 12000;
          const get = async (url, options = {}) => {
            const response = await fetch(url, { method: 'GET', signal: AbortSignal.timeout(timeout), ...options });
            let body = null;
            try { body = await response.json(); } catch {}
            return { status: response.status, body };
          };
          (async () => {
            // Coolify API is queried inside this trusted production-environment job.
            // Raw environment values and the full broker context are never printed.
            const envs = await get(base + '/applications/' + process.env.EXPECTED_APP_UUID + '/envs', {
              headers: { Authorization: 'Bearer ' + apiToken, Accept: 'application/json' },
            });
            console.log('FBS_EXPOSURE_CONTROL_ENV_HTTP=' + envs.status);
            if (envs.status !== 200) { console.log('FBS_EXPOSURE_CHECK=NO_COOLIFY_ENV_ACCESS'); return; }
            const rows = Array.isArray(envs.body) ? envs.body : envs.body?.data;
            if (!Array.isArray(rows)) { console.log('FBS_EXPOSURE_CHECK=UNKNOWN_ENV_RESPONSE'); return; }
            const candidates = rows.filter(row => row?.key === 'CBOT_CONTROL_SECRET');
            if (candidates.length !== 1) { console.log('FBS_EXPOSURE_CHECK=CONTROL_SECRET_NOT_UNIQUE'); return; }
            const item = candidates[0];
            const candidatesValues = [item.real_value, item.value].filter(v => typeof v === 'string' && v.trim());
            const controlSecret = candidatesValues.find(v => !/^(\*+|\[hidden\]|\[redacted\]|<redacted>|null)$/i.test(v.trim()));
            if (!controlSecret) { console.log('FBS_EXPOSURE_CHECK=CONTROL_SECRET_MASKED'); return; }
            const context = await get('https://cbot.mkety.com:25345/v1/mt5-context/' + target + '?symbol=EURUSD&includeExposure=true', {
              headers: { Authorization: 'Bearer ' + controlSecret, Accept: 'application/json' },
            });
            console.log('FBS_EXPOSURE_CONTEXT_HTTP=' + context.status);
            const response = context.body || {};
            const record = response.context || {};
            const identity = record.account || {};
            const accountMatch = String(identity.accountNumber ?? '') === expectedNumber;
            const serverMatch = String(identity.serverName ?? '') === expectedServer;
            const exposure = record.exposure;
            const open = exposure?.currentOpenRiskPercent;
            const daily = exposure?.currentDailyPnlPercent;
            const numerical = typeof open === 'number' && Number.isFinite(open) && open >= 0
              && typeof daily === 'number' && Number.isFinite(daily);
            const reason = typeof response.reason === 'string' && /^[A-Z0-9_]{2,100}$/.test(response.reason)
              ? response.reason : null;
            console.log('FBS_EXPOSURE_RESULT=' + JSON.stringify({
              status: context.status,
              ok: response.ok === true,
              accountBound: String(response.accountRowId ?? '') === target,
              brokerAccountMatch: accountMatch,
              brokerServerMatch: serverMatch,
              exposurePresent: Boolean(exposure && typeof exposure === 'object'),
              validNumericRiskValues: numerical,
              reasonCode: reason,
            }));
            if (context.status === 200 && response.ok === true
              && String(response.accountRowId ?? '') === target && accountMatch && serverMatch && numerical) {
              console.log('FBS_EXPOSURE_CHECK=PASS_AUTHENTICATED_BROKER_EXPOSURE');
            } else {
              console.log('FBS_EXPOSURE_CHECK=NOT_VERIFIED');
            }
          })().catch(err => {
            const name = String(err?.name || 'UnknownError');
            console.log('FBS_EXPOSURE_CHECK=REQUEST_FAILED:' + (/^[A-Za-z]+Error$/.test(name) ? name : 'UnknownError'));
            process.exitCode = 0;
          });
          NODE
      - name: Public gateway health (no authentication or trading)
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail -sS \
            --connect-timeout 10 --max-time 20 \
            -o "$RUNNER_TEMP/oci-gateway-health.json" \
            'https://cbot.mkety.com:25345/health'
          HEALTH_PATH="$RUNNER_TEMP/oci-gateway-health.json" node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync(process.env.HEALTH_PATH, 'utf8'));
          if (response.ok !== true) throw new Error('Public gateway health is not OK');
          console.log('PUBLIC_GATEWAY_HEALTH=PASS');
          NODE
          rm -f "$RUNNER_TEMP/oci-gateway-health.json"
