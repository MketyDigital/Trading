name: Diagnostic Node Tests

on:
  push:
    branches:
      - fix/frontend-readonly-shipped-contract-20260915
    paths:
      - 'cloudflare-v2/tests/**'
      - '.github/workflows/diagnostic-node-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Node tests one file at a time
        shell: bash
        run: |
          set +e
          failed=0
          while IFS= read -r test_file; do
            echo "Running $test_file"
            node --test "$test_file"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error file=$test_file,title=Isolated Node test failed::$test_file exited with status $status"
              failed=1
            fi
          done < <(find tests -maxdepth 1 -name '*.test.mjs' -print | sort)
          exit "$failed"
