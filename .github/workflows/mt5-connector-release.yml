name: MT5 Connector Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional explicit release tag (main only), e.g. mt5-connector-v1.1.0'
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/mt5-connector-release.yml'
      - 'mt5-connector/**'
      - 'cloudflare-v2/bridges/mt5_bridge.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mt5-connector-release.yml'
      - 'mt5-connector/**'
      - 'cloudflare-v2/bridges/mt5_bridge.py'
    tags:
      - 'mt5-connector-v*'

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned connector build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.16.0" "websocket-client==1.8.0" "certifi==2026.7.22" "numpy==2.1.3" "MetaTrader5==5.0.5200"

      - name: Run pure connector regression tests
        shell: pwsh
        run: python -m unittest discover -s mt5-connector -p 'test_*.py'

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name MketyMT5Connector `
            --paths cloudflare-v2/bridges `
            --hidden-import mt5_bridge `
            --hidden-import websocket `
            --hidden-import manager_ui `
            --hidden-import process_supervisor `
            --hidden-import profile_store `
            --hidden-import terminal_catalog `
            --collect-data certifi `
            --collect-all numpy `
            mt5-connector/mkety_mt5_connector.py
          if (!(Test-Path "dist/MketyMT5Connector.exe")) { throw "MT5 connector executable was not produced" }

      # Exercise both the explicit CLI and hidden worker entrypoint without connecting to a broker.
      - name: Smoke-test packaged manager and worker entrypoints
        shell: pwsh
        run: |
          $help = Start-Process -FilePath "dist/MketyMT5Connector.exe" -ArgumentList @('--help') -PassThru -Wait
          if ($help.ExitCode -ne 0) { throw "Packaged explicit CLI entrypoint failed" }
          $runtime = Start-Process -FilePath "dist/MketyMT5Connector.exe" -ArgumentList @('--runtime-smoke') -PassThru -Wait
          if ($runtime.ExitCode -ne 0) { throw "Packaged MT5, NumPy, WebSocket or CA runtime import failed" }
          $status = Join-Path $env:RUNNER_TEMP 'mkety-mt5-worker-smoke.json'
          $config = Join-Path $env:RUNNER_TEMP 'mkety-mt5-missing-config.json'
          $terminal = Join-Path $env:RUNNER_TEMP 'terminal64.exe'
          $worker = Start-Process `
            -FilePath "dist/MketyMT5Connector.exe" `
            -ArgumentList @('--worker','--profile-id','smoke','--status-file',$status,'--terminal',$terminal,'--config',$config,'--ledger',(Join-Path $env:RUNNER_TEMP 'ledger.sqlite')) `
            -PassThru `
            -Wait
          if ($worker.ExitCode -ne 2) { throw "Packaged worker did not fail closed when its pairing config was missing" }
          $workerStatus = Get-Content $status -Raw | ConvertFrom-Json
          if ($workerStatus.state -ne 'stopped') { throw "Packaged worker did not write its stopped status" }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/MketyMT5Connector.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  MketyMT5Connector.exe" | Out-File -FilePath "dist/MketyMT5Connector.exe.sha256" -Encoding ascii -NoNewline

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MketyMT5Connector-windows
          path: |
            dist/MketyMT5Connector.exe
            dist/MketyMT5Connector.exe.sha256
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mt5-connector-v') || (github.ref == 'refs/heads/main' && inputs.release_tag != '')
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the commit to release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download verified Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MketyMT5Connector-windows
          path: dist

      - name: Create an explicit version tag from main when dispatched
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual connector releases can run only from main." >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^mt5-connector-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use mt5-connector-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to replace it." >&2
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create a new versioned release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$RELEASE_TAG"
          fi
          if [[ ! "$tag" =~ ^mt5-connector-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use mt5-connector-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/MketyMT5Connector.exe \
            dist/MketyMT5Connector.exe.sha256 \
            --verify-tag \
            --latest \
            --title "Mkety MT5 Connector ${tag#mt5-connector-v}" \
            --generate-notes
