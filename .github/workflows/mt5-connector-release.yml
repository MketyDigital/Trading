name: MT5 Connector Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mt5-connector-release.yml'
      - 'mt5-connector/**'
      - 'cloudflare-v2/bridges/mt5_bridge.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mt5-connector-release.yml'
      - 'mt5-connector/**'
      - 'cloudflare-v2/bridges/mt5_bridge.py'
    tags:
      - 'mt5-connector-v*'

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned connector build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.16.0" "websocket-client==1.8.0" "certifi==2026.7.22" "numpy==2.1.3" "MetaTrader5==5.0.5200"

      - name: Run pure connector regression tests
        shell: pwsh
        run: python -m unittest discover -s mt5-connector -p 'test_*.py'

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name MketyMT5Connector `
            --paths cloudflare-v2/bridges `
            --hidden-import mt5_bridge `
            --hidden-import websocket `
            --collect-data certifi `
            --collect-all numpy `
            mt5-connector/mkety_mt5_connector.py
          if (!(Test-Path "dist/MketyMT5Connector.exe")) { throw "MT5 connector executable was not produced" }

      # Exercise the packaged EXE so binary-only dependency omissions fail before release publication.
      - name: Smoke-test packaged runtime dependencies
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'mkety-mt5-smoke.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'mkety-mt5-smoke.stderr.txt'
          $process = Start-Process `
            -FilePath "dist/MketyMT5Connector.exe" `
            -ArgumentList @('--token','ci-packaging-smoke','--gateway','ws://127.0.0.1:9') `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
          }
          $output = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Host $output
          if ($output -match 'ModuleNotFoundError') { throw "Packaged connector has a missing Python runtime module" }
          if ($output -match 'numpy\._core\.multiarray') { throw "Packaged connector cannot import NumPy multiarray" }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/MketyMT5Connector.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  MketyMT5Connector.exe" | Out-File -FilePath "dist/MketyMT5Connector.exe.sha256" -Encoding ascii -NoNewline

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MketyMT5Connector-windows
          path: |
            dist/MketyMT5Connector.exe
            dist/MketyMT5Connector.exe.sha256
          if-no-files-found: error

      - name: Publish stable GitHub Release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/mt5-connector-v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'mt5-connector-v1.0.0'
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/MketyMT5Connector.exe dist/MketyMT5Connector.exe.sha256 --clobber
          } else {
            gh release create $tag dist/MketyMT5Connector.exe dist/MketyMT5Connector.exe.sha256 --target main --title "Mkety MT5 Connector $($tag.Replace('mt5-connector-v',''))" --generate-notes
          }
