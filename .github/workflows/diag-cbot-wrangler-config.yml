name: Validate cBot Wrangler Production Config

on:
  push:
    branches:
      - 'diag/coolify-cbot-runtime'
    paths:
      - 'cloudflare-v2/wrangler.toml'
      - '.github/workflows/diag-cbot-wrangler-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: cloudflare-v2
        run: npm install --no-audit --no-fund
      - name: Validate config and required remote secret bindings
        working-directory: cloudflare-v2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.toml >/tmp/dryrun.txt
          npx wrangler secret list --config wrangler.toml > /tmp/secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/secrets.json','utf8');
          let rows;
          try { rows=JSON.parse(raw); } catch { throw new Error('wrangler secret list did not return JSON'); }
          const names=new Set((Array.isArray(rows)?rows:[]).map(x=>String(x.name||'')));
          for (const name of ['CBOT_TOKEN_SIGNING_KEY','CBOT_CONTROL_SECRET']) {
            if (!names.has(name)) throw new Error(`Missing remote Worker secret: ${name}`);
          }
          const config=fs.readFileSync('wrangler.toml','utf8');
          if (!config.includes('CTRADER_CBOT_GATEWAY_URL = "https://cbot.mkety.com:25345"')) throw new Error('Gateway URL missing');
          if (!config.includes('CTRADER_CBOT_WS_URL = "wss://cbot.mkety.com:25345/v1/cbot"')) throw new Error('WebSocket URL missing');
          console.log('Wrangler config and remote cBot secret bindings verified.');
          NODE
