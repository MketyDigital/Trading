name: Diagnostic Trading Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run Node suite and capture output
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee ../trading-node-test.log
      - name: Upload diagnostic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-node-test-log
          path: trading-node-test.log
          if-no-files-found: error
          retention-days: 1
