name: Coolify Credential Scope Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/coolify-credential-scope-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository_secrets:
    name: Coolify metadata using repository secrets
    runs-on: ubuntu-latest
    steps:
      - name: Read existing PostgreSQL metadata (GET only)
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.OCI_COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.OCI_COOLIFY_TOKEN }}
          DATABASE_UUID: hgxwkiyxgbmb2i3pl57kmxc8
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_URL:-}" ] || [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "REPOSITORY_SCOPE_CREDENTIALS=missing"
            exit 0
          fi
          root="${COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          status="$(curl --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/coolify-db.json" -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json' \
            "$api/databases/$DATABASE_UUID")"
          echo "REPOSITORY_SCOPE_HTTP_STATUS=$status"
          [ "$status" = "200" ] || exit 0
          DB_PATH="$RUNNER_TEMP/coolify-db.json" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.DB_PATH, 'utf8'));
          const db = payload?.database ?? payload?.data ?? payload?.result ?? payload;
          const safe = {
            responseKeys: Object.keys(payload ?? {}).sort(),
            databaseKeys: Object.keys(db ?? {}).sort(),
            name: typeof db?.name === 'string' ? db.name : null,
            uuid: typeof db?.uuid === 'string' ? db.uuid : null,
            status: typeof db?.status === 'string' ? db.status : null,
            isPublic: typeof db?.is_public === 'boolean' ? db.is_public : null,
            environmentId: db?.environment_id ?? null,
            environmentUuid: typeof db?.environment_uuid === 'string' ? db.environment_uuid : typeof db?.environment?.uuid === 'string' ? db.environment.uuid : null
          };
          console.log('REPOSITORY_SCOPE_METADATA=' + JSON.stringify(safe));
          NODE
          PROJECT_UUID=0zqhpkprlhtvlacmsgmfyyhs
          root="${COOLIFY_URL%/}"
          [[ "$root" == */api/v1 ]] && api="$root" || api="$root/api/v1"
          status="$(curl --proto '=https' --tlsv1.2 -sS -o "$RUNNER_TEMP/coolify-environments.json" -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json' \
            "$api/projects/$PROJECT_UUID/environments")"
          echo "PROJECT_ENVIRONMENTS_HTTP_STATUS=$status"
          [ "$status" = "200" ] || exit 0
          PROJECT_UUID=0zqhpkprlhtvlacmsgmfyyhs node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RUNNER_TEMP + '/coolify-environments.json';
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = Array.isArray(payload) ? payload : payload?.environments ?? payload?.data ?? payload?.result ?? [];
          if (!Array.isArray(rows)) throw new Error('Unexpected Coolify project environment response shape');
          const safe = rows.map((row) => ({ id: row?.id ?? null, name: typeof row?.name === 'string' ? row.name : null, projectId: row?.project_id ?? null, uuid: typeof row?.uuid === 'string' ? row.uuid : null }));
          console.log('REPOSITORY_SCOPE_PROJECT_ENVIRONMENTS=' + JSON.stringify(safe));
          NODE

  staging_environment_secrets:
