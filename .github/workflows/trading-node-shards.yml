name: Trading Node Shards

on:
  pull_request:
    paths:
      - 'cloudflare-v2/src/**'
      - 'cloudflare-v2/tests/**'
      - '.github/workflows/trading-node-shards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: enterprise-old
            pattern: 'tests/enterprise_single_entry.test.mjs tests/entry_materializer.test.mjs'
          - name: execution-old
            pattern: 'tests/execution_binding_repair.test.mjs tests/execution_commands.test.mjs tests/execution_plan.test.mjs'
          - name: external-old
            pattern: 'tests/external_mtproto_ci_contract.test.mjs tests/external_mtproto_replay_acceptance.test.mjs tests/external_mtproto_tenant_isolation.test.mjs'
          - name: enterprise-new
            pattern: 'tests/enterprise_connections_sync.test.mjs tests/enterprise_destination_contracts.test.mjs tests/enterprise_portal_controls.test.mjs'
    name: node-${{ matrix.name }}
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run shard
        shell: bash
        run: node --test ${{ matrix.pattern }}
