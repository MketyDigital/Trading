name: Trading Node Shards

on:
  pull_request:
    paths:
      - 'cloudflare-v2/src/**'
      - 'cloudflare-v2/tests/**'
      - '.github/workflows/trading-node-shards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: d
            pattern: 'tests/d*.test.mjs'
          - name: e
            pattern: 'tests/e*.test.mjs'
          - name: f
            pattern: 'tests/f*.test.mjs'
    name: node-${{ matrix.name }}
    defaults:
      run:
        working-directory: cloudflare-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Run shard
        shell: bash
        run: node --test ${{ matrix.pattern }}
