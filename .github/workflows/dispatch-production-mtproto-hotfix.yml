name: Dispatch Production MTProto Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-production-mtproto-hotfix.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-cloudflare-deploy.yml --repo "${{ github.repository }}" -f mode=deploy-paid-access-code-dashboard
