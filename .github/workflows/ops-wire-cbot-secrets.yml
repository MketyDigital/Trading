name: Wire cBot Gateway Secrets

on:
  push:
    branches: ['diag/coolify-cbot-runtime']
    paths: ['.github/workflows/ops-wire-cbot-secrets.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire:
    runs-on: ubuntu-latest
    environment: staging
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve application and validate operator access
        shell: bash
        run: |
          set -euo pipefail
          for k in COOLIFY_URL COOLIFY_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!k:-}" || { echo "$k missing"; exit 1; }
          done
          base="${COOLIFY_URL%/}"; case "$base" in */api/v1) api="$base";; *) api="$base/api/v1";; esac
          echo "COOLIFY_API=$api" >> "$GITHUB_ENV"
          curl -fsS "$api/applications" -H "Authorization: Bearer $COOLIFY_TOKEN" > /tmp/apps.json
          python - <<'PY'
          import json,os
          apps=json.load(open('/tmp/apps.json'))
          rows=[a for a in apps if str(a.get('git_repository') or '').lower()=='mketydigital/trading' and 'ctrader-cbot-gateway/deploy/coolify/docker-compose.yml' in str(a.get('docker_compose_location') or '').lower()]
          if len(rows)!=1: raise SystemExit(f'Expected one cBot app, found {len(rows)}')
          a=rows[0]
          print('Selected Coolify app:',a.get('name'),a.get('uuid'))
          open(os.environ['GITHUB_ENV'],'a').write(f"COOLIFY_APP_UUID={a['uuid']}\n")
          PY
          status="$(curl -sS -o /tmp/cf-zone.json -w '%{http_code}' 'https://api.cloudflare.com/client/v4/zones?name=mkety.com&status=active' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          test "$status" = 200 || { echo "Cloudflare zone access HTTP $status"; exit 1; }
          python - <<'PY'
          import json
          b=json.load(open('/tmp/cf-zone.json'))
          if not b.get('success') or len(b.get('result') or [])!=1: raise SystemExit('Cloudflare zone access failed')
          print('Cloudflare account can access mkety.com.')
          PY

      - name: Generate independent cryptographic secrets
        shell: bash
        run: |
          set -euo pipefail
          signing="$(openssl rand -base64 48 | tr '+/' '-_' | tr -d '=\n')"
          control="$(openssl rand -base64 48 | tr '+/' '-_' | tr -d '=\n')"
          test ${#signing} -ge 60
          test ${#control} -ge 60
          test "$signing" != "$control"
          echo "::add-mask::$signing"
          echo "::add-mask::$control"
          echo "CBOT_SIGNING_VALUE=$signing" >> "$GITHUB_ENV"
          echo "CBOT_CONTROL_VALUE=$control" >> "$GITHUB_ENV"
          echo 'Generated two independent cBot secrets.'

      - name: Replace production Coolify cBot placeholder secrets
        shell: bash
        run: |
          set -euo pipefail
          update_env() {
            key="$1" value="$2"
            payload="$(KEY="$key" VALUE="$value" python - <<'PY'
          import json,os
          print(json.dumps({'key':os.environ['KEY'],'value':os.environ['VALUE'],'is_preview':False,'is_literal':True,'is_multiline':False}))
          PY
          )"
            code="$(curl -sS -o "/tmp/update-$key.json" -w '%{http_code}' -X PATCH "$COOLIFY_API/applications/$COOLIFY_APP_UUID/envs" -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Content-Type: application/json' --data "$payload")"
            test "$code" = 201 || { echo "Coolify update $key HTTP $code"; exit 1; }
            echo "$key updated in Coolify production environment."
          }
          update_env CBOT_TOKEN_SIGNING_KEY "$CBOT_SIGNING_VALUE"
          update_env CBOT_CONTROL_SECRET "$CBOT_CONTROL_VALUE"

      - name: Verify exact production Coolify rows
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$COOLIFY_API/applications/$COOLIFY_APP_UUID/envs" -H "Authorization: Bearer $COOLIFY_TOKEN" > /tmp/envs.json
          python - <<'PY'
          import json,os,hmac
          envs=json.load(open('/tmp/envs.json'))
          def prod(key):
              rows=[e for e in envs if e.get('key')==key and not e.get('is_preview')]
              if len(rows)!=1: raise SystemExit(f'{key}: expected one production row, found {len(rows)}')
              v=rows[0].get('real_value') or rows[0].get('value') or ''
              if len(v)>=2 and v[0]==v[-1] and v[0] in "'\"": v=v[1:-1]
              return v,rows[0]
          expected={'CBOT_TOKEN_SIGNING_KEY':os.environ['CBOT_SIGNING_VALUE'],'CBOT_CONTROL_SECRET':os.environ['CBOT_CONTROL_VALUE']}
          for key,want in expected.items():
              got,row=prod(key)
              if not hmac.compare_digest(got,want): raise SystemExit(f'{key}: stored production value mismatch')
              if not row.get('is_literal'): raise SystemExit(f'{key}: production row must be literal')
              print(f'{key}: exact production value verified, preview=false, literal=true')
          PY

      - name: Install Worker dependencies
        working-directory: cloudflare-v2
        run: npm install --no-audit --no-fund

      - name: Upload matching encrypted secrets to Cloudflare Worker
        working-directory: cloudflare-v2
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CBOT_SIGNING_VALUE" | npx wrangler secret put CBOT_TOKEN_SIGNING_KEY --name mkety-copier-engine
          printf '%s' "$CBOT_CONTROL_VALUE" | npx wrangler secret put CBOT_CONTROL_SECRET --name mkety-copier-engine
          echo 'Matching cBot secrets uploaded to mkety-copier-engine.'

      - name: Verify Worker secret names exist
        working-directory: cloudflare-v2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name mkety-copier-engine > /tmp/worker-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/worker-secrets.json','utf8'));
          const names=new Set(rows.map(x=>x.name));
          for (const key of ['CBOT_TOKEN_SIGNING_KEY','CBOT_CONTROL_SECRET']) {
            if (!names.has(key)) throw new Error(`Worker secret missing: ${key}`);
            console.log(`${key}: present as encrypted Worker secret`);
          }
          NODE
