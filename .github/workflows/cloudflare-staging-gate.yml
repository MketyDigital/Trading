name: Cloudflare Staging Gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safe Cloudflare staging action
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - deploy-paid
          - deploy-free

permissions:
  contents: read

concurrency:
  group: cloudflare-trading-staging
  cancel-in-progress: false

jobs:
  staging-gate:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
      STAGING_SUPABASE_URL_VAR: ${{ vars.SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      STAGING_TRADING_MASTER_KEY: ${{ secrets.TRADING_MASTER_KEY }}
      TRADINGVIEW_DIRECT_INGRESS_ENABLED: 'false'
      TRADINGVIEW_CERT_PROBE_ENABLED: 'false'
      TRADING_ACCESS_ENABLED: 'false'
      BROKER_EXECUTION_ENABLED: 'false'

    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v4

      - name: Refuse non-PR-2 branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "design/enterprise-trading-event-core" ]; then
            echo "Cloudflare staging gate may run only from design/enterprise-trading-event-core."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare staging credentials by name only
        shell: bash
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing GitHub staging secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing GitHub staging secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Require paid runtime configuration by name only
        if: ${{ inputs.mode == 'deploy-paid' }}
        shell: bash
        run: |
          missing=0
          if [ -z "${STAGING_SUPABASE_URL_SECRET:-}" ] && [ -z "${STAGING_SUPABASE_URL_VAR:-}" ]; then
            echo "Missing GitHub staging configuration: SUPABASE_URL"
            missing=1
          fi
          if [ -z "${STAGING_SUPABASE_SERVICE_ROLE:-}" ] && [ -z "${STAGING_SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${STAGING_SUPABASE_SERVICE_KEY:-}" ]; then
            echo "Missing GitHub staging secret: one of SUPABASE_SERVICE_ROLE, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_SERVICE_KEY"
            missing=1
          fi
          if [ -z "${STAGING_TRADING_MASTER_KEY:-}" ]; then
            echo "Missing GitHub staging secret: TRADING_MASTER_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify Cloudflare identity
        run: npx wrangler whoami

      - name: Validate Paid and Free Wrangler profiles
        shell: bash
        run: |
          npx wrangler deploy --dry-run --config wrangler.toml
          npx wrangler deploy --dry-run --config wrangler.free.toml

      - name: Inspect current Paid deployment state
        if: ${{ inputs.mode == 'inspect' }}
        run: npx wrangler deployments list --config wrangler.toml

      - name: Build ephemeral Paid staging secrets file
        if: ${{ inputs.mode == 'deploy-paid' }}
        shell: bash
        run: |
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const supabaseUrl = process.env.STAGING_SUPABASE_URL_SECRET || process.env.STAGING_SUPABASE_URL_VAR;
          const serviceRole = process.env.STAGING_SUPABASE_SERVICE_ROLE ||
            process.env.STAGING_SUPABASE_SERVICE_ROLE_KEY ||
            process.env.STAGING_SUPABASE_SERVICE_KEY;

          const payload = {
            SUPABASE_URL: supabaseUrl,
            SUPABASE_SERVICE_ROLE: serviceRole,
            TRADING_MASTER_KEY: process.env.STAGING_TRADING_MASTER_KEY,
          };

          const target = path.join(process.env.RUNNER_TEMP, 'mkety-trading-staging-secrets.json');
          fs.writeFileSync(target, JSON.stringify(payload), { mode: 0o600 });
          NODE

      - name: Deploy reviewed Paid staging profile
        if: ${{ inputs.mode == 'deploy-paid' }}
        shell: bash
        run: npx wrangler deploy --config wrangler.toml --secrets-file "$RUNNER_TEMP/mkety-trading-staging-secrets.json"

      - name: Remove ephemeral Paid staging secrets file
        if: ${{ always() && inputs.mode == 'deploy-paid' }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/mkety-trading-staging-secrets.json"

      - name: Deploy reviewed Free staging profile
        if: ${{ inputs.mode == 'deploy-free' }}
        run: npx wrangler deploy --config wrangler.free.toml

      - name: Record safety posture
        shell: bash
        run: |
          echo "Cloudflare staging mode: ${{ inputs.mode }}"
          echo "TradingView direct ingress: disabled"
          echo "TradingView certificate probe: disabled"
          echo "Trading access entitlement: disabled"
          echo "Broker execution: disabled"
