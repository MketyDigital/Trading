name: Trading Storage Staging Inspection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only inspection of the existing Trading staging target
        required: true
        type: choice
        default: inspect
        options:
          - inspect

permissions:
  contents: read

concurrency:
  group: cloudflare-trading-staging
  cancel-in-progress: false

jobs:
  staging-gate:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cloudflare-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADINGVIEW_DIRECT_INGRESS_ENABLED: 'false'
      TRADINGVIEW_CERT_PROBE_ENABLED: 'false'
      TRADING_ACCESS_ENABLED: 'false'
      BROKER_EXECUTION_ENABLED: 'false'
      LIVE_BROKER_EXECUTION_ENABLED: 'false'

    steps:
      - name: Checkout reviewed ref
        uses: actions/checkout@v4

      - name: Refuse unreviewed branch
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "feat/trading-d1-cutover-implementation" ]; then
            echo "Trading storage inspection may run only from the reviewed migration branch."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies without Cloudflare credentials
        run: npm ci --no-audit --no-fund

      - name: Require Cloudflare staging credentials by name only
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing GitHub staging secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing GitHub staging secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Verify Cloudflare identity
        run: npx wrangler whoami

      - name: Confirm the existing Trading D1 resource
        shell: bash
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/trading-d1-inventory.json"
          node --input-type=module <<'CHECK_EXISTING_D1'
          import { readFile } from 'node:fs/promises';

          const payload = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/trading-d1-inventory.json`, 'utf8'));
          const databases = Array.isArray(payload) ? payload : payload.result;
          if (!Array.isArray(databases)) throw new Error('Unexpected D1 inventory response shape');
          const database = databases.find(({ name }) => name === 'trading-staging');
          if (!database?.uuid) throw new Error('Existing Trading staging D1 is missing; refusing to provision a database');
          console.log(`Existing Trading D1 found (${database.name}); resource id withheld.`);
          CHECK_EXISTING_D1

      - name: Dry-run the Trading storage staging Worker
        run: npx wrangler deploy --dry-run --containers-rollout=none --config wrangler.trading-staging.toml

      - name: Inspect existing Trading D1 migration state
        run: npx wrangler d1 migrations list trading-staging --remote --config wrangler.trading-staging.toml

      - name: Verify migrated Trading tables exist
        shell: bash
        run: |
          npx wrangler d1 execute trading-staging --remote --config wrangler.trading-staging.toml \
            --command "SELECT CASE WHEN COUNT(*) >= 34 THEN 'TRADING_D1_SCHEMA_OK' ELSE 'TRADING_D1_SCHEMA_MISSING' END AS status FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%';" \
            > "$RUNNER_TEMP/trading-d1-schema-check.txt"
          if ! grep -q 'TRADING_D1_SCHEMA_OK' "$RUNNER_TEMP/trading-d1-schema-check.txt"; then
            echo 'Existing Trading D1 schema verification failed.'
            exit 1
          fi
          echo 'Existing Trading D1 schema check passed.'

      - name: Inspect current Trading staging deployment state
        run: npx wrangler deployments list --config wrangler.trading-staging.toml

      - name: Record fail-closed staging posture
        shell: bash
        run: |
          echo "Cloudflare mode: read-only inspect and dry-run"
          echo "D1 provisioning: disabled"
          echo "Worker deployment: disabled"
          echo "TradingView direct ingress: disabled"
          echo "Trading access: disabled"
          echo "Broker execution: disabled"
