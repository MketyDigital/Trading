name: Dispatch Production Browser Acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-e2e-pr26.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing production browser gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-frontend-e2e.yml --repo "$GITHUB_REPOSITORY" --ref main
