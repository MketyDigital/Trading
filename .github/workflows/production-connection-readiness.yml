name: Production Connection Readiness
# Production release probe: strictly read-only. It must never create/redeem/revoke
# access fixtures or mutate customer/workspace state.

on:
  workflow_run:
    workflows:
      - Production Cloudflare Deploy
    types:
      - completed
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-connection-readiness.yml'

permissions:
  contents: read

env:
  E2E_BASE_URL: https://trade.mkety.com

jobs:
  connection-readiness:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      MKETY_TRADING_ADMIN_SECRET: ${{ secrets.MKETY_TRADING_ADMIN_SECRET }}
    steps:
      - name: Verify production health read-only
        shell: bash
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/production-health.json"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' "$E2E_BASE_URL/api/v1/health")"
          test "$status" = "200"
          HEALTH_BODY="$(cat "$body_file")" node <<'NODE'
          const body = JSON.parse(process.env.HEALTH_BODY || '{}');
          if (body.ok !== true || body.ready !== true) throw new Error('production health is not ready');
          console.log('PRODUCTION_HEALTH=PASS');
          NODE

      - name: Verify persisted runtime safety read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MKETY_TRADING_ADMIN_SECRET"
          body_file="$RUNNER_TEMP/runtime-controls.json"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -H "X-Mkety-Admin-Secret: $MKETY_TRADING_ADMIN_SECRET" \
            "$E2E_BASE_URL/api/v1/mkety-admin/runtime-controls")"
          test "$status" = "200"
          RUNTIME_BODY="$(cat "$body_file")" node <<'NODE'
          const body = JSON.parse(process.env.RUNTIME_BODY || '{}');
          if (body.ok !== true) throw new Error('runtime controls unavailable');
          if (body.brokerExecutionCapabilityEnabled !== true) throw new Error('broker execution capability is unavailable');
          if (typeof body.tradingAccessEnabled !== 'boolean') throw new Error('trading access state is invalid');
          if (typeof body.brokerExecutionEnabled !== 'boolean') throw new Error('broker execution state is invalid');
          if (typeof body.liveBrokerExecutionEnabled !== 'boolean') throw new Error('LIVE broker execution state is invalid');
          if (typeof body.effectiveBrokerExecutionEnabled !== 'boolean') throw new Error('effective broker execution state is invalid');
          if (typeof body.effectiveLiveBrokerExecutionEnabled !== 'boolean') throw new Error('effective LIVE broker execution state is invalid');
          const expectedEffectiveBroker = body.tradingAccessEnabled && body.brokerExecutionEnabled;
          const expectedEffectiveLive = expectedEffectiveBroker && body.liveBrokerExecutionEnabled;
          if (body.effectiveBrokerExecutionEnabled !== expectedEffectiveBroker) throw new Error('effective broker execution state is inconsistent');
          if (body.effectiveLiveBrokerExecutionEnabled !== expectedEffectiveLive) throw new Error('effective LIVE broker execution state is inconsistent');
          console.log('BROKER_EXECUTION_CAPABILITY=PASS');
          console.log(`LIVE_EXECUTION_STATE=${body.liveBrokerExecutionEnabled ? 'ENABLED' : 'DISABLED'}`);
          NODE

      - name: Verify staff API remains private
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/staff-unauthorized.json" -w '%{http_code}' "$E2E_BASE_URL/api/v1/mkety-admin/access-codes")"
          test "$status" = "401"
          echo 'STAFF_API_AUTH_BOUNDARY=PASS'

      - name: Record read-only connection readiness posture
        shell: bash
        run: |
          echo 'Production connection readiness probe completed without creating or mutating any workspace, access code, account, source, route, destination, or trade state.'
          echo 'cTrader/MT5 deployed integration configuration remains covered by the production platform verification and the release database/account preflight.'
